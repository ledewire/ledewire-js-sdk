name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      # Publishing uses npm trusted publishing (OIDC via `id-token: write`), which
      # needs Node >= 22.14 and npm >= 11.5.1. No npm token is stored: each package
      # on npmjs.com trusts this workflow file. `registry-url` is deliberately unset
      # so setup-node doesn't write a token-based .npmrc.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changeset publish` → `pnpm publish` → the `npm` binary on PATH, so fail
      # fast here rather than mid-publish if the bundled npm can't do OIDC.
      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$NPM_VERSION"; then
            echo "::error::npm $NPM_VERSION is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi
          echo "npm $NPM_VERSION supports trusted publishing"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Creates a "Version Packages" PR, or publishes if that PR was just merged
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          # No NPM_TOKEN: without it, changesets/action skips writing an .npmrc
          # and npm authenticates via OIDC trusted publishing.

      - name: Attach browser CDN bundle to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/browser/package.json').version")
          TAG="@ledewire/browser@${VERSION}"
          # Create the release if changesets didn't (e.g. first-publish with no changeset files)
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" \
            packages/browser/dist/ledewire.min.js \
            packages/browser/dist/ledewire.min.js.map \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Build and deploy API docs
    needs: release
    runs-on: ubuntu-latest
    # Run on every push to main, not just on releases
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate TypeDoc API reference
        run: pnpm run docs
      - name: Deploy docs to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
