  /v1/wallet/payment-session:
    post:
      summary: Initialize a wallet funding payment session
      description: >
        Creates a payment session for wallet funding and returns the necessary details for client-side payment processing.
        Currently implemented using Stripe payment intents. The client should use the returned client_secret with
        the payment provider's client library to collect payment details and process the payment.
        After payment is processed, the provider will send a webhook notification to confirm the payment status.
        Opening a new session cancels the caller's earlier sessions that are still `pending`.
        Requires a buyer token; seller and merchant tokens get 403 `Invalid Role`.
      tags:
        - Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletPaymentSessionRequest'
      responses:
        '200':
          description: Payment session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPaymentSessionResponse'
              examples:
                success:
                  summary: Payment session created
                  value:
                    client_secret: 'pi_3MkLpgHxoRklNe0j1W96LQcG_secret_pCFpWjPDDVtT9YPtqtjvBQrXV'
                    session_id: 'pi_3MkLpgHxoRklNe0j1W96LQcG'
                    public_key: 'pk_test_51MkLpgHxoRklNe0j'
        '400':
          description: >
            The body failed validation: `amount_cents` missing or not from 1 to 2147483647, a `currency`
            other than `usd`, or `metadata` that is not an object or breaks its limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_amount:
                  summary: Invalid amount
                  value:
                    error:
                      code: 400
                      message: 'amount_cents must be greater than 0'
                invalid_currency:
                  summary: Unsupported currency
                  value:
                    error:
                      code: 400
                      message: 'currency must be a valid currency code'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      code: 401
                      message: 'Invalid token'
                missing_token:
                  summary: No bearer token
                  value:
                    error:
                      code: 401
                      message: 'Request must include a valid Bearer Token'
        '402':
          description: >
            The payment provider refused to create the payment intent. `message` carries the
            provider's reason. The session is recorded as failed and no money moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                provider_error:
                  summary: Provider refused the intent
                  value:
                    error:
                      code: 402
                      message: 'Payment intent creation failed: Your card was declined.'
        '403':
          description: The token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_role:
                  summary: Non-buyer token
                  value:
                    error:
                      code: 403
                      message: 'Invalid Role'

  /v1/wallet/payment-status/{session_id}:
    get:
      summary: Check the status of a wallet payment
      description: >
        Allows clients to check the current status of a payment session.
        This endpoint can be polled after payment submission to determine
        when a webhook has been processed. Only the caller's own personal top-up sessions are
        found: another user's session id, and a Company wallet top-up's, answer 400 exactly as
        an unknown id does. Requires a buyer token; seller and merchant tokens get 403
        `Invalid Role`.
      tags:
        - Wallet
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          description: The `session_id` returned by `POST /v1/wallet/payment-session`.
          schema:
            type: string
      responses:
        '200':
          description: Payment status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPaymentStatusResponse'
        '400':
          description: >
            No personal top-up session of the caller's has this id (unknown, another user's, or a
            Company top-up). A 400, not a 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Unknown session
                  value:
                    error:
                      code: 400
                      message: 'Session Identifier was not found'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/wallet/payment-webhook:
    post:
      summary: Webhook handler for wallet funding completion
      description: >
        Receives webhook notifications from payment providers for payment events.
        When a payment success event is received for a wallet funding transaction,
        the system will automatically update the transaction status and fund the user's wallet.
        Currently implemented for Stripe webhook events. The body is verified against the
        `Stripe-Signature` header over the raw request bytes. Every verified event answers 200
        `{received: true}` — including event types with no handler, intents that are not wallet
        funding, unknown intents, and a funding-transfer id mismatch. Not authenticated by bearer
        token and not throttled; the signature is the credential.
      tags:
        - Wallet
      security: [] # No authentication required for payment provider webhooks
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe's signature over the raw body, verified with the endpoint signing secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Event received (handled, ignored, or of a type with no handler)
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          description: >
            The signature did not verify (including a missing `Stripe-Signature` header), or the
            body is not JSON. `error` carries the underlying message.
          content:
            application/json:
              schema:
                type: object
                description: A flat error, not the `ErrorResponse` envelope.
                required: [error]
                properties:
                  error:
                    type: string
              examples:
                bad_signature:
                  summary: Signature did not verify
                  value:
                    error: 'No signatures found matching the expected signature for payload'
        '500':
          description: The event verified but handling it failed; Stripe retries it.
          content:
            application/json:
              schema:
                type: object
                description: A flat error, not the `ErrorResponse` envelope.
                required: [error]
                properties:
                  error:
                    type: string
              examples:
                internal:
                  summary: Handler failed
                  value:
                    error: 'Internal error'

  /v1/webhooks/payment:
    post:
      summary: Generic payment provider webhook endpoint
      description: >
        Receives Stripe webhook events and routes them to the appropriate handlers. The body is a
        Stripe event, and it is verified against the `Stripe-Signature` header over the raw request
        bytes, so it must be delivered exactly as Stripe sent it. Event types with no handler are
        acknowledged with the same 200. Not authenticated by bearer token and not throttled; the
        signature is the credential.
      tags:
        - Webhooks
      security: [] # No authentication required for payment provider webhooks
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe's signature over the raw body, verified with the endpoint signing secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Event received (handled, or of a type with no handler)
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    enum: [true]
        '400':
          description: >
            The signature did not verify (including a missing `Stripe-Signature` header), or the
            body is not JSON. `error` carries the underlying message.
          content:
            application/json:
              schema:
                type: object
                description: A flat error, not the `ErrorResponse` envelope.
                required: [error]
                properties:
                  error:
                    type: string
              examples:
                bad_signature:
                  summary: Signature did not verify
                  value:
                    error: 'No signatures found matching the expected signature for payload'
        '500':
          description: The event verified but handling it failed; Stripe retries it.
          content:
            application/json:
              schema:
                type: object
                description: A flat error, not the `ErrorResponse` envelope.
                required: [error]
                properties:
                  error:
                    type: string
              examples:
                internal:
                  summary: Handler failed
                  value:
                    error: 'Internal error'

  /v1/wallet/balance:
