  /v1/auth/invite-info/{token}:
    get:
      summary: Look up a pending store invitation
      description: >
        What the store invitation behind `token` is for, so a signup page can show it before the
        invitee has an account. No authentication and no throttle; the token is the credential.
        An invitation expires 7 days after it was sent.
      tags:
        - Authentication
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The `invitation_token` from the invitation email.
          schema:
            type: string
      responses:
        '200':
          description: The pending invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfoResponse'
        '404':
          description: No invitation has this token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Unknown token
                  value:
                    error:
                      code: 404
                      message: 'Invitation not found'
        '409':
          description: The invitation has already been accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accepted:
                  summary: Already accepted
                  value:
                    error:
                      code: 409
                      message: 'Invitation already accepted'
        '410':
          description: The invitation was sent more than 7 days ago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  summary: Expired
                  value:
                    error:
                      code: 410
                      message: 'Invitation has expired'

  /v1/merchant/{store_id}/users:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store ID. The authenticated user must have a StoreUser record for this store.
    get:
      summary: List store members
      description: >
        Returns a paginated list of all StoreUser records for the given store.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
        Non-owner users (including `is_author: true`) receive `403 Forbidden`.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based).
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of items per page. Maximum 100.
      responses:
        '200':
          description: Paginated list of store members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Invite a user to the store
      description: >
        Adds a user as a member of the store.
        If the user already has an account, they are added immediately.
        If not, an invitation email is sent and a pending StoreUser is created.


        `is_author` defaults to `true`; set it explicitly to `false` to add
        a store member without authoring permissions.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantInviteRequest'
            examples:
              add_author:
                summary: Invite an existing user as an author
                value:
                  email: 'author@example.com'
              add_member_no_authorship:
                summary: Invite a member without author permissions
                value:
                  email: 'member@example.com'
                  is_author: false
      responses:
        '201':
          description: User added or invitation sent
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MerchantUser'
                  - $ref: '#/components/schemas/MerchantInviteResponse'
        '401':
          description: No, invalid or expired Bearer token, or its user no longer exists (`User not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already a member of this store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/users/{id}:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store ID
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: StoreUser ID
    patch:
      summary: Update a store member's permissions
      description: >
        Updates attributes for a store member. Supports toggling `is_author` and setting
        a per-author fee override (`author_fee_bps`). At least one field must be provided.
        `author_fee_bps: null` clears the per-author override, reverting to the store default.
        Role (`owner`) can only be assigned via the platform admin UI.
        Owners cannot update their own record.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_author:
                  type: boolean
                  description: Grant or revoke author permissions.
                author_fee_bps:
                  type: [integer, 'null']
                  description: Per-author fee override in basis points (0–10000). Set to `null` to revert to the store default.
            examples:
              grant_authorship:
                summary: Grant author permissions
                value:
                  is_author: true
              revoke_authorship:
                summary: Revoke author permissions
                value:
                  is_author: false
              set_author_fee:
                summary: Set a custom author fee of 18%
                value:
                  author_fee_bps: 1800
              clear_author_fee:
                summary: Clear the per-author fee override
                value:
                  author_fee_bps: null
      responses:
        '200':
          description: Updated store member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantUser'
        '401':
          description: No, invalid or expired Bearer token, or its user no longer exists (`User not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — cannot modify own record or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove a store member
      description: >
        Removes a user from the store. Owners cannot remove themselves.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Removed successfully
        '401':
          description: No, invalid or expired Bearer token, or its user no longer exists (`User not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — cannot remove self or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/content:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
