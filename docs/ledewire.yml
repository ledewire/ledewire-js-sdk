    ContentWithAccessResponse:
      description: >
        Full content detail plus real-time access and wallet context for a specific user.
        Returned by the buyer-facing `GET /v1/content/:id/with-access` endpoint.


        **URI gating for remote content:** `content_uri` is only present in the response when
        `access_info.has_purchased` is `true`. This applies to `external_ref` content and
        remote-mode `html` content (where the payload is a URI rather than an inline body).
        For all other states (unauthenticated, insufficient funds, not yet purchased) it is
        omitted, ensuring buyers cannot access the Vimeo link, PDF URI, or other external
        resource without completing a purchase.
      allOf:
        - $ref: '#/components/schemas/ContentResponse'
        - type: object
          required: [access_info]
          properties:
            access_info:
              $ref: '#/components/schemas/ContentAccessInfo'

    User:
      type: object
