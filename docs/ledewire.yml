  /v1/company/members/{id}:
    patch:
      summary: Change a member's role or daily Spend cap
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read.
        Promote a member or demote an admin, including yourself, so long as the Company keeps at
        least one admin. Set any member's daily Spend cap, including your own. A Machine user cannot
        be made an admin (422).
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMemberRoleRequest'
      responses:
        '200':
          description: The updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMember'
        '400':
          description: >
            Neither `role` nor `daily_spend_limit_cents` given, a `role` that is empty or not a
            string, or a cap that is null, not an integer, negative or above 2147483647
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company, or the member is not in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Unknown role, a Machine user made an admin, or it would leave the Company with no admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a member
      description: >
        Company admins remove any member. Any member may also remove their own membership, which is
        leaving the Company exactly as DELETE /v1/company/membership does. Closes the membership;
        the member's ledger accounts stay with the Company. The last admin cannot be removed.
        Removing a Machine user deactivates it permanently, as DELETE /v1/company/machine-users/{id}
        does.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin and the membership is not their own; the caller is a
            Machine user removing its own membership (`Machine users cannot leave a Company`); or the
            token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The caller belongs to no Company, or the member is not in it (including one just
            removed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            The member is a Machine user that is already deactivated, e.g. by a concurrent removal
            (`Machine user is already deactivated`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: It would leave the Company with no admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/membership:
    get:
      summary: Read the authenticated buyer's own membership
      description: >
        The session token names the buyer, and a buyer belongs to at most one Company.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The membership
          content:
            application/json:
