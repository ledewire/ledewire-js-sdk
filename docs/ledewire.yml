  /v1/auth/password/reset-request:
    post:
      summary: Request a password reset code
      description: >
        Sends a 6-digit reset code to the given email address if a matching account exists.
        Always returns 200 to prevent email enumeration.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset code sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_requested:
                  summary: Reset code sent (or silently suppressed for unknown email)
                  value:
                    message: 'If an account with this email exists, a reset code has been sent.'
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error:
                      code: 400
                      message: 'email must be a valid email address'
        '429':
          description: >
            Too many requests. The source IP is limited to 10 requests per minute, one budget shared by
            `POST /v1/auth/password/reset-request` and `POST /v1/auth/password/reset`.
            Each address may also request only a few codes before a growing backoff (up to 15 minutes)
            applies; every request counts, whether or not the account exists.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'

  /v1/auth/password/reset:
    post:
      summary: Reset password using code
      description: >
        Validates the 6-digit reset code and replaces the user's password.
        The reset code is single-use and expires after a short window.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6-digit numeric code received by email
                  example: '246810'
                password:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 10 requests per minute, one budget shared by
            `POST /v1/auth/password/reset-request` and `POST /v1/auth/password/reset`.
            Repeated failed resets against one address also earn it a growing backoff (up to 15 minutes).
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_success:
                  summary: Password updated
                  value:
                    message: 'Password has been successfully reset.'
        '400':
          description: >
            A field is missing or invalid (email format, a `reset_code` that is not 6 digits, a
            password shorter than 6 characters), or the code is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_code:
                  summary: Invalid or expired code
                  value:
                    error:
                      code: 400
                      message: 'Invalid or expired reset code'
                invalid_password:
                  summary: Password too short
                  value:
                    error:
                      code: 400
                      message: 'password must be at least 6 characters long'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    error:
                      code: 404
                      message: 'User not found'

  /ahoy/events:
    post:
      summary: Track an analytics event
      description: >
        Records product-analytics events, using the Ahoy gem's own endpoint and contract. These
        are Ahoy's events: they carry no Company and no user, and per-Company usage reporting never
        counts them.


        Every request must identify a visit and a visitor: send the `Ahoy-Visit` and
        `Ahoy-Visitor` headers (or `visit_token` / `visitor_token` in the body). Without both the
        answer is a plain-text 400. An event for a visit not yet recorded creates the visit.


        A request whose `User-Agent` reads as a bot, or is absent, still gets a 200 and records
        nothing.
      tags:
        - Analytics
      security: [] # No authentication required for analytics tracking
      parameters:
        - name: Ahoy-Visit
          in: header
          required: false
          schema:
            type: string
          description: The visit token. Required unless `visit_token` is in the body.
        - name: Ahoy-Visitor
          in: header
          required: false
          schema:
            type: string
          description: The visitor token. Required unless `visitor_token` is in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AhoyEventRequest'
            examples:
              page_view:
                summary: A single event
                value:
                  name: "Page View"
                  properties:
                    page: "/content/123"
                    title: "Sample Blog Post"
              batch:
                summary: A batch
                value:
                  events:
                    - name: "Button Click"
                      properties:
                        button_id: "purchase_button"
                        content_id: "123"
                    - name: "Page View"
                      properties:
                        page: "/content/123"
      responses:
        '200':
          description: Accepted. The body is always an empty object.
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
              examples:
                accepted:
                  value: {}
        '400':
          description: >
            The visit or visitor token is missing (`Missing required parameters`), or the body is
            neither a named event nor a batch (`Invalid parameters`). Plain text, not
            `ErrorResponse`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                missing_tokens:
                  value: "Missing required parameters\n"
                invalid:
                  value: "Invalid parameters\n"
        '413':
          description: The body is over 8 KB. Plain text, not `ErrorResponse`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                too_large:
                  value: "Payload too large\n"

  /ahoy/visits:
    post:
      summary: Track a visit
      description: >
        Records a visit, using the Ahoy gem's own endpoint and contract. Send the `Ahoy-Visit` and
        `Ahoy-Visitor` headers (or the tokens in the body); without both the answer is a
        plain-text 400. Re-posting a visit token already recorded is not an error and changes
        nothing.


        A request whose `User-Agent` reads as a bot, or is absent, still gets a 200 and records
        nothing.
      tags:
        - Analytics
      security: [] # No authentication required for analytics tracking
      parameters:
        - name: Ahoy-Visit
          in: header
          required: false
          schema:
            type: string
          description: The visit token. Required unless `visit_token` is in the body.
        - name: Ahoy-Visitor
          in: header
          required: false
          schema:
            type: string
          description: The visitor token. Required unless `visitor_token` is in the body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AhoyVisitRequest'
            examples:
              web_visit:
                summary: A web visit
                value:
                  visit_token: "6f1c1f1e-3d2b-4c55-9b0a-2f4e8f0d9a11"
                  visitor_token: "a9e2c7d4-51f8-4f0e-8d6b-3c2a1b0e9f87"
                  referrer: "https://google.com"
                  landing_page: "https://ledewire.com/content/123?utm_source=google&utm_medium=cpc"
              mobile_visit:
                summary: A native-app visit
                value:
                  visit_token: "0b7d3e52-8a41-4f6c-b2e9-5d1a7c3f6e20"
                  visitor_token: "c4f8a1b6-2e9d-4a73-9f05-7b3e6d2c1a84"
                  landing_page: "https://ledewire.com/content/456"
                  app_version: "1.2.3"
                  os_version: "14.7.1"
                  platform: "ios"
      responses:
        '200':
          description: >
            Accepted. Echoes the tokens in force; `visit_id` and `visitor_id` repeat them under
            Ahoy's legacy names.
          content:
            application/json:
              schema:
                type: object
                required: [visit_token, visitor_token, visit_id, visitor_id]
                properties:
                  visit_token:
                    type: string
                  visitor_token:
                    type: string
                  visit_id:
                    type: string
                    description: Same as `visit_token`.
                  visitor_id:
                    type: string
                    description: Same as `visitor_token`.
              examples:
                accepted:
                  value:
                    visit_token: "6f1c1f1e-3d2b-4c55-9b0a-2f4e8f0d9a11"
                    visitor_token: "a9e2c7d4-51f8-4f0e-8d6b-3c2a1b0e9f87"
                    visit_id: "6f1c1f1e-3d2b-4c55-9b0a-2f4e8f0d9a11"
                    visitor_id: "a9e2c7d4-51f8-4f0e-8d6b-3c2a1b0e9f87"
        '400':
          description: The visit or visitor token is missing. Plain text, not `ErrorResponse`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                missing_tokens:
                  value: "Missing required parameters\n"
        '413':
          description: The body is over 8 KB. Plain text, not `ErrorResponse`.
          content:
            text/plain:
              schema:
                type: string
              examples:
                too_large:
                  value: "Payload too large\n"

  /v1/x402/contents/{id}:
    get:
      summary: Fetch content via x402 payment protocol
      description: >
        Implements the x402 v2 payment protocol using the `ledewire-wallet` scheme.
        On the first request (no `PAYMENT-SIGNATURE` header) the server responds with
        `402 Payment Required` and a `PAYMENT-REQUIRED` header describing the price and
        a single-use nonce. The client retries with a `PAYMENT-SIGNATURE` header
        containing the buyer JWT and nonce. On success the server responds with `200`,
        a `PAYMENT-RESPONSE` header with the settlement result, and the content body.


        Free seller content (`price_cents: 0`) returns `200` immediately, with no handshake and
        no purchase. Every priced work goes through the handshake on every request: a past
        purchase does not skip it, and each settled handshake is a new charge.


        Retrying is **not** idempotent. There is no idempotency key; a nonce is single-use, so a
        replayed `PAYMENT-SIGNATURE` gets a fresh 402 rather than a second charge, but a client
        that starts a new handshake after a lost response pays again.
      tags:
        - x402
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: >
            Content UUID, or the work UUID of a licensable catalogue entry (as returned by
            search) that has no content row yet.
        - in: header
          name: PAYMENT-SIGNATURE
          required: false
          schema:
            type: string
          description: >-
            Base64-encoded x402 v2 PaymentPayload JSON object. Required for paid content.
            Must carry `x402Version: 2`; `accepted.scheme: "ledewire-wallet"` and
            `accepted.network: "ledewire:v1"`; and `payload.contentId` (this work's id),
            `payload.nonce` (from the 402's `accepts[0].extra.nonce`) and `payload.token` (a
            buyer JWT, with or without a `Bearer ` prefix). Other members are ignored. An unknown,
            expired or already-used nonce gets a fresh 402 with a new nonce, not a 400.
      responses:
        '200':
          description: Payment settled; content delivered.
          headers:
            PAYMENT-RESPONSE:
              schema:
                type: string
                contentEncoding: base64
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/SettlementResponse'
              description: >
                Base64-encoded x402 v2 SettlementResponse JSON. Omitted for free content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402ContentResponse'
        '402':
          description: Payment required. PAYMENT-REQUIRED header contains the x402 v2 PaymentRequired JSON (Base64-encoded).
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: >
                Base64-encoded x402 v2 PaymentRequired JSON: `x402Version` (2); `error`
                (`PAYMENT-SIGNATURE header is required`); `resource` with `url` (this endpoint
                for the work), `description` (the work's display title) and `mimeType`
                (`application/json`); `accepts`, one entry with `scheme` (`ledewire-wallet`),
                `network` (`ledewire:v1`), `amount` (price in cents, as a string), `asset`
                (`USD`), `payTo` (`store:<store id>`, the Store selling the work; for a brokered work,
                LedeWire's fixed id `f67c246e-206c-5d62-b113-c526c54fac76`), `maxTimeoutSeconds` (300) and `extra` with
                `nonce` (single-use, valid 300 seconds) and `expiresAt` (Unix timestamp); and
                `extensions`, always `{}`. The work's id is not in the payload: it is the `id`
                in the request path, which the client echoes as `payload.contentId`.

                A 402 carrying a `DailySpendCapReachedError` body and **no** PAYMENT-REQUIRED header is
                the other case: the buyer's daily spend cap would be exceeded. Retrying the handshake
                cannot help and neither can funding the wallet — the cap resets at `resets_at`.
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a DailySpendCapReachedError body also satisfies
                # ErrorResponse, which only constrains the envelope.
                anyOf:
                  - $ref: '#/components/schemas/DailySpendCapReachedError'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                payment_required:
                  summary: x402 handshake — read the PAYMENT-REQUIRED header
                  value:
                    error:
                      code: 402
                      message: 'Payment required'
                daily_spend_cap_reached:
                  summary: Daily spend cap reached
                  value:
                    error:
                      code: 402
                      message: 'Daily spend cap reached'
                      type: 'daily_spend_cap_reached'
                    cap_cents: 1000
                    spent_cents: 1000
                    remaining_cents: 0
                    resets_at: '2026-08-21T00:00:00Z'
        '400':
          description: >
            `Malformed PAYMENT-SIGNATURE header` (not Base64, not JSON, not a JSON object, or an
            `accepted` or `payload` that is not an object), `Unsupported x402 version`,
            `Unsupported payment scheme or network`, `Content ID mismatch in payment payload`,
            or `Nonce was not issued for this content`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                malformed:
                  value:
                    error:
                      code: 400
                      message: 'Malformed PAYMENT-SIGNATURE header'
        '401':
          description: Invalid or expired JWT in `payload.token` (`Invalid token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The JWT in `payload.token` is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content not found or not publicly visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Insufficient wallet balance, or another refusal of the purchase — including a work
            whose body could not be built, rolled back with `type: client_error`.
          content:
            application/json:
              schema:
                # anyOf, not oneOf: an InsufficientFundsError body also satisfies
                # ErrorResponse, which only constrains the envelope.
                anyOf:
                  - $ref: '#/components/schemas/InsufficientFundsError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Rate limit exceeded (30 requests per minute per IP). Waiting `Retry-After` seconds
            is always enough.
          headers:
            Retry-After:
              description: Seconds to wait. Always the full window (60).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limited:
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/x402/discovery/resources:
    get:
      summary: Discover publicly available x402 v2 resources (Bazaar)
      description: >
        Unauthenticated endpoint for x402 crawlers and agents to discover Ledewire content
        without requiring MCP support. Returns public content formatted as x402 v2 Bazaar
        resource entries. `content_body` and `content_uri` are never included.
      tags:
        - x402
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
          description: >
            Number of resources to return. A value above 100 is not refused: it is capped at 100.
            Below 1 or not a base-10 integer is a 400.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
          description: Zero-based offset for pagination. Negative, above 1000000, or not a base-10 integer is a 400.
      responses:
        '200':
          description: Paginated list of x402 v2 Bazaar resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402BazaarDiscoveryResponse'
        '400':
          description: '`limit` or `offset` out of range or not a base-10 integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                negative_offset:
                  value:
                    error:
                      code: 400
                      message: 'limit must be a positive integer (above 100 is capped at 100) and offset an integer from 0 to 1000000'

  /v1/x402/verify-origin:
    get:
      summary: Verify that a URL is a registered Ledewire content item
      description: >
        Unauthenticated endpoint used by the browser extension, JS snippet, and proxy
        to confirm that a URL is legitimately registered as a Ledewire content item
        before showing any payment UI. Returns `verified: false` silently for unknown
        URLs to prevent enumeration and to avoid misleading users.


        Only `verified: true` responses are HTTP-cached, for the configured TTL (default 1
        hour); `verified: false` is never cached, so a newly registered URL verifies at once.
      tags:
        - x402
      security: []
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: >
            Absolute URL of the page to verify (e.g. https://theirsite.com/articles/slug). A
            missing or invalid URL is not a 400: it answers `verified: false`.
        - in: query
          name: store_id
          required: false
          schema:
            type: string
          description: >
            The store whose pricing rules may cover the URL. When the URL is not yet registered,
            the store has verified its domain, and one of the store's pricing rules matches it,
            the server registers it — creating a content record on this GET — and answers
            `verified: true`. A caller with a known store id can
            therefore learn which URLs that store's rules cover.
      responses:
        '200':
          description: >
            Except when rate limited, always 200. `verified: true` means the URL is registered;
            `verified: false` means it is not (or the URL was missing or invalid).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOriginVerified'
                  - $ref: '#/components/schemas/VerifyOriginUnverified'
        '429':
          description: >
            Rate limit exceeded (60 requests per minute per IP). Waiting `Retry-After` seconds
            is always enough.
          headers:
            Retry-After:
              description: Seconds to wait. Always the full window (60).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limited:
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'

  /.well-known/x402-jwks.json:
    get:
      summary: JSON Web Key Set for x402 accessToken verification
      description: >
        Publishes the RS256 public key used to sign `accessToken` values included in
        `PAYMENT-RESPONSE`. Third-party proxies and CMS plugins fetch this once (and
        cache it for 24 hours) to verify access tokens offline without calling Ledewire
        on every request.

        Standard JWKS format (RFC 7517). The `kid` claim in the access token matches
        the `kid` in the JWKS entry.
      tags:
        - x402
      security: []
      responses:
        '200':
          description: JWKS document
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=86400, public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '503':
          description: >
            Key material unavailable (credentials not configured). Sent with
            `Cache-Control: no-store`. The body is a bare string, not the ErrorResponse envelope.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: ['JWKS unavailable']

  /v1/publications:
    get:
      summary: List the publications available to license
      description: >
        Every Publication the Broker reports as ready to license, ordered by name. Served from our
        own registry, reconciled daily against the Broker's directory, so it answers even while
        the Broker is unreachable.


        Licensability is the only filter. A publication that publishes no `FULL_USE` rate is
        listed and flagged `bulk_licensable: false` rather than omitted, and nothing is hidden
        for its page types, article lengths or perceived value.


        `q`, `bulk_licensable` and `topics[]` narrow the list on the server and combine with AND;
        `pagination` counts the filtered set. Without any of them, the list is unfiltered.
        `unclassified_count` is how many listed publications have no Topics yet, whatever the
        filter, so a Topic-filtered page that may be incomplete says so.


        **Authorization:** none, or a **Buyer token**. A Buyer whose Company holds a Subscription
        also sees the Publications it opens, listed, filtered and counted like the rest. Without a
        token, or with a Buyer token and no Subscription, the list is the same. A token that is
        sent must be a valid Buyer token: anything else is refused rather than read as anonymous.
      tags:
        - bulk-licensing
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring of the publication's name or of any of its listed domains
            (as listed, e.g. `www.forbes.com`, or bare, e.g. `forbes.com`). Blank is no filter.
          schema:
            type: string
          example: times
        - name: bulk_licensable
          in: query
          required: false
          description: >
            `true` returns only publications that can be bulk-licensed; `false` only those that
            cannot.
          schema:
            type: boolean
        - name: topics[]
          in: query
          required: false
          description: >
            Only publications carrying any of these Topics. Repeat the parameter for several
            (`topics[]=sports&topics[]=travel`). An unknown Topic is a 400 naming the valid ones.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TopicSlug'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: >
            Page number (1-based). A value below 1, or one that is not a number, reads as 1; a page
            past the end returns an empty `data`.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: >
            Number of items per page. A value above 100 is capped at 100, not refused; a negative
            one is refused with 400. When it is absent, 0 or not a number, `limit` is read instead,
            and failing that the default applies.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: >
            An alias for `per_page`, under the same rules, read only when `per_page` is absent, 0 or
            not a number.
      responses:
        '200':
          description: A page of publications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationListResponse'
        '400':
          description: >
            Invalid pagination parameters, a `bulk_licensable` that is not a boolean, or a `topics[]`
            entry that is not a Topic (the message names the valid ones)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            An `Authorization` header that is not a valid Buyer token (`Request must include a valid
            Bearer Token`, `Invalid token`, `User not found`), or a deactivated Machine user (`Machine
            user is deactivated`). Leave the header out to browse anonymously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/publications/{id}:
    get:
      summary: Get one publication
      description: >
        One Publication, exactly as its row in `GET /v1/publications`. Served from the same
        registry, so it answers even while the Broker is unreachable, and an id the list would not
        show to this caller (not ready to license, withdrawn, or opened only by a Subscription the
        caller does not hold) is a 404 here too.


        **Authorization:** none, or a **Buyer token**, as on `GET /v1/publications`.
      tags:
        - bulk-licensing
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '401':
          description: >
            An `Authorization` header that is not a valid Buyer token (`Request must include a valid
            Bearer Token`, `Invalid token`, `User not found`), or a deactivated Machine user (`Machine
            user is deactivated`). Leave the header out to browse anonymously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No publication listed to this caller has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/publications/{id}/works:
    get:
      summary: List a publication's works by date range
      description: >
        One page of the article URLs a Publication has available to license, read live from the
        Broker's catalog and optionally bounded by modification date. A page of URLs is exactly
        what `POST /v1/acquisitions` takes as a Selection. Works are not priced here; pricing
        happens when the Selection is quoted.


        Check `date_filter` before reading an empty page as "nothing in range". Some publications'
        catalogs carry no modification dates, and on those the Broker's date filter returns
        nothing at all. That is reported as `unsupported`.


        **Authorization:** none.
      tags:
        - bulk-licensing
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Earliest modification date, inclusive, as `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Latest modification date, inclusive, as `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: cursor
          in: query
          required: false
          description: The previous page's `next_cursor`, sent with the same `from`/`to`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Works per page. Defaults to the maximum.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: A page of works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWorkListResponse'
        '400':
          description: A malformed or reversed date, a limit out of range, or a cursor that is invalid or was issued for a different query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No listed publication has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many requests from this address — 15 a minute per source IP, because every request
            is a live call to the Broker. Waiting `Retry-After` seconds is always enough.
          headers:
            Retry-After:
              description: >
                Seconds to wait. Always the full window (60), so an upper bound: the window opened
                at this address's first request and may close sooner.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Broker's catalog could not be read, even after retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/topics:
    get:
      summary: List the Topics, with how many publications carry each
      description: >
        Every Topic a Publication can carry, in vocabulary order, with its IAB unique ID, its IAB
        display name and the number of listed Publications that carry it. Topics are IAB Content
        Taxonomy tier-1 subject areas, so the list is also every value `topics[]` on
        `GET /v1/publications` accepts.


        Each `publication_count` is exactly what `GET /v1/publications?topics[]=<slug>` reports as
        `pagination.total`. A Topic no Publication carries yet is listed with 0.
        `unclassified_count` is how many listed Publications have no Topics yet, so are counted
        under none of them.


        **Authorization:** none.
      tags:
        - bulk-licensing
      security: []
      responses:
        '200':
          description: The Topic directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDirectoryResponse'

  /v1/acquisitions:
    post:
      summary: Submit a Selection and open a Bulk acquisition
      description: >
        Uploads the list of works a Buyer wants and returns the acquisition that will carry its
        quote. Returns in milliseconds: nothing here calls the broker.


        **Quoting is asynchronous.** Resolving rates for 10,000 works is roughly 200 upstream
        batch calls under undocumented limits, so the response comes back `quote_state: pending`
        with a snapshot the Buyer can already read, and pricing runs behind it. Poll
        `GET /v1/acquisitions/{id}` until `quote_state` is `ready`.


        Two limits are enforced before any upstream call, and they refuse differently because
        they want different remedies: too many works means "trim the file", while too much value
        means "split this into two acquisitions".


        **Authorization:** buyer JWT.
      tags:
        - bulk-licensing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >
                    The works to license, in the order they should be recorded, one URL per
                    element — taken whole, so a comma in a query string is part of the URL.
                    Every element gets a disposition, refused ones included — a row that vanished
                    silently between upload and quote is the failure the acknowledgement step
                    exists to prevent. So a blank element, or one containing a line break, is a
                    400 rather than a row.
      responses:
        '201':
          description: The acquisition, with its quote not yet priced
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '400':
          description: >
            No `urls`, an empty list, a `urls` that is not an array of strings, or an element
            that is blank or contains a line break (the message gives its index).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Refused whole, before any upstream call. `error.type` distinguishes the two and they
            want different remedies: `selection_too_large` carries `maximum` and `submitted` and
            means trim the file, where `selection_value_too_large` carries `maximum_cents` and
            `submitted` and means split this into two acquisitions. Both fields sit at the top
            level, beside `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No broker store is configured, so there is nothing bulk may run against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    get:
      summary: Poll a Bulk acquisition
      description: >
        The one resource the whole flow hangs off — the quote arriving and the run progressing
        are both read here, because the Buyer holds one id and neither question is answerable
        from the other.


        Cheap enough to poll for hours: it carries counts and an exclusion tally rather than
        rows. Per-work detail is `GET /v1/acquisitions/{id}/works`.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: The acquisition
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No such acquisition for this Buyer — deliberately the same answer as "not yours".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/quote:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Re-price a quote by identity
      description: >
        Re-prices the snapshot at today's rates **without re-resolving it**. The Buyer returns to
        the id they already hold and gets the same works at current prices without uploading
        anything again, which is what makes the 24-hour quote expiry cheap rather than punitive.


        What is re-asked is what the rate surface decides — an unrated property may start
        publishing, a repriced one may come back under the ceiling. What is not re-asked is what
        the uploaded file decided: a malformed row is still malformed and a duplicate is still
        the second spelling of a work already in the list.


        Asynchronous, like the first quote. The acknowledgement is withdrawn, because the list
        the Buyer acknowledged is not this list.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '202':
          description: Re-pricing started. Poll the acquisition until `quote_state` is `ready`.
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Refused. `error.type` is `quote_in_progress` (with `quote_state`) when a re-pricing
            is already running —
            pricing is expensive upstream, so a client polling and re-quoting in one loop is not
            allowed to queue one per iteration. Otherwise it is `invalid_acquisition_state`, with
            `status` and `expected_status`: the hold is already placed, and a re-quote
            moves the total the funds are reserved against, so it is refused once the money is
            committed. A `failed` quote is re-quotable, and asking again is the remedy for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/acknowledgement:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Acknowledge what cannot be sold
      description: >
        The Buyer registers the exclusions. Its own step rather than a flag on authorize, and the
        reason is the product being sold: a large upload will contain rows we cannot honour,
        rejecting the whole file is hostile at that size, and quoting the remainder silently is
        worse. The failure that matters most for an audit-trail product is a Buyer authorizing
        without registering that works they asked for are not coming.


        Withdrawn again by any re-quote, so it always refers to the current exclusions.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: Acknowledged. The acquisition can now be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Nothing to acknowledge yet, or a quote too old to stand behind. `error.type` names
            which: `quote_not_ready` carries `quote_state` (`pending` — keep polling; `failed` —
            re-quote), and `quote_expired` carries `quoted_at` and `valid_for_seconds`, with a
            re-quote as the remedy. `invalid_acquisition_state` (with `status` and
            `expected_status`) means the acquisition is no longer `quoted` — cancelled, or past
            its hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/authorization:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Place the hold and start the run
      description: >
        The one moment a Bulk acquisition's money is committed. Funds move from the wallet to
        held funds for the stated maximum chargeable total, and retrieval begins off the request
        thread — 10,000 works is 10,000 round trips against a broker with no bulk primitive, so
        this returns immediately and the Buyer polls the acquisition.


        Two constraints are checked and they are not the same constraint. **Wallet balance** asks
        whether the Buyer has the money; **cap headroom** asks whether they are allowed to spend
        it today. The cap is read first and answered in its own terms, because sending a
        capped-out Buyer to add funds would send them to do something that cannot work.


        The spend cap is read once, here. Captures drawing on this hold are never re-checked: a
        refusal now is actionable, where a refusal at capture 31,000 is a half-delivered
        acquisition with money held and licences already paid for upstream.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '202':
          description: Hold placed, run started. Poll the acquisition.
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: >
            The daily spend cap refuses this acquisition. Carries `cap_cents`, `spent_cents`,
            `remaining_cents`, `resets_at` and `bulk_exempt` — and deliberately **no funding
            URL**, because adding money cannot clear a cap. Distinct from insufficient funds for
            that reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySpendCapReachedError'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The hold was refused and the quote survives, so it can be acknowledged or re-priced
            and authorized again. `error.type` names the condition:
            `exclusions_unacknowledged` (post the acknowledgement first), `quote_not_ready` (with
            `quote_state`), `quote_expired` (with `quoted_at` and `valid_for_seconds`; re-quote),
            `invalid_acquisition_state` (with `status` and `expected_status` — already
            authorized, cancelled, failed or settled), `nothing_to_hold` (every work was
            excluded), or `insufficient_funds`. Insufficient funds answers here rather than at
            402 — the existing contract for this API — which is what keeps it distinct from a
            cap refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            `run_not_started`: the run could not be queued. The hold is placed and the run
            queued together or not at all, so nothing was held, the acquisition is still
            `quoted`, and the same authorization is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/cancellation:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: >
          Bulk acquisition UUID. Must belong to the authenticated Buyer, or have been paid for by a
          Company the caller is an open admin of.
    post:
      summary: Withdraw a quote, or stop a held acquisition the Company pays for
      description: >
        Moves a `quoted` acquisition to `cancelled`. Quoting is how a Buyer learns what a
        Selection costs, and the usual next step is to trim it and submit the remainder as a new
        acquisition; this withdraws the first so it does not sit as an expired quote.


        Allowed whatever the quote's state — still `pending`, `ready` or `failed`, expired or
        not, acknowledged or not. No hold exists yet, so **no money moves**: the wallet's
        balance, held and spendable amounts are unchanged. Pricing still running stops without
        writing to it, and a cancelled acquisition can be neither acknowledged nor authorized.


        **A held acquisition** (`authorized` or `acquiring`) paid for by a Company can be
        cancelled by an open admin of that Company, whether or not the membership that paid is
        still open. What was already captured is charged; the rest of the hold is released to
        the Company wallet. That is a release, not a refund: delivered works stay bought. A run in
        progress starts no further work, and assembles the corpus for what it delivered. The
        cancel is recorded as `company.acquisition.cancelled` in the audit trail. A Buyer who is
        not an admin of that Company cannot cancel a held acquisition, their own included.


        Idempotent: an acquisition already `cancelled` answers 200 with its current body and is
        not changed.


        **Authorization:** buyer JWT. A quote must be the caller's own; a held acquisition must
        be Company-paid, and the caller an open admin of that Company.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: Cancelled, or already was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No such acquisition for this caller — the same answer for one that exists and is
            neither the caller's nor paid for by a Company they are an open admin of.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The acquisition is not in a state this caller can cancel: the Buyer's own acquisition
            once it is past its quote, or, for an open admin of the Company that paid, one that is
            not held (still quoted by another member, settled or failed). `error.type` is `invalid_acquisition_state`, with
            `status` and `expected_status` alongside; `expected_status` is `quoted` for a Buyer and
            `holding` (meaning `authorized` or `acquiring`) for a Company admin. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/works:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: >
          Page number (1-based). A value below 1, or one that is not a number, reads as 1; a page
          past the end returns an empty `data`.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: >
          Number of items per page. A value above 100 is capped at 100, not refused; a negative
          one is refused with 400. When it is absent, 0 or not a number, `limit` is read instead,
          and failing that the default applies.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: >
          An alias for `per_page`, under the same rules, read only when `per_page` is absent, 0 or
          not a number.
      - name: delivery_state
        in: query
        required: false
        description: >
          Only works the run left in this state. `undelivered` is what was attempted and failed;
          an excluded work is never attempted and stays `pending`.
        schema:
          type: string
          enum: [pending, delivered, undelivered]
      - name: line_state
        in: query
        required: false
        description: Only works the quote left in this state.
        schema:
          type: string
          enum: [pending, firm, estimated, excluded]
      - name: exclusion_reason
        in: query
        required: false
        description: >
          Only works excluded for this reason, so only `excluded` lines.
        schema:
          type: string
          enum:
            - excluded_malformed
            - excluded_duplicate
            - excluded_no_rate
            - excluded_free_not_supported
            - excluded_not_deliverable
            - excluded_insufficient_rights
            - excluded_above_price_ceiling
            - excluded_rate_unavailable
            - excluded_not_sold_in_bulk
    get:
      summary: Per-work dispositions
      description: >
        Every work in the Selection with what happened to it, in submission order, refused rows
        included.


        **Partial failure is read from here, not caught.** An acquisition where 300 of 10,000
        works failed is ordinary — it does not fail the request and it is not an exception — so
        each outcome is a line item carrying its typed reason.


        **Filters** answer "what didn't I get, and why?" without reading every page.
        `delivery_state`, `line_state` and `exclusion_reason` are optional and combine with AND;
        results stay in submission order, and `pagination` counts the filtered set. An unknown
        value is a 400, not an empty page.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: A page of works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcquisitionWorkList'
        '400':
          description: Invalid pagination parameters, or a filter value outside its enum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/corpus:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer, or have been paid from the
          Company wallet of a Company the caller is an admin of.
    get:
      summary: Where the corpus is
      description: >
        Answers with a **state**, never with an error — every case is a 200. A corpus is a
        rendering of Purchases the Buyer already holds rather than an entitlement of its own, so
        a blob past its 30-day retention answers `rebuild_required`: a 404 or a 410 would say
        something was lost, and nothing was.


        Reading the state never starts work. It does not need to: assembly is queued when the
        acquisition settles with something delivered, so a settled acquisition's corpus reads
        `pending`, `assembling` or `ready` without being asked for. Use `POST` to ask for a
        rebuild once it has expired, or to retry a failure. Before the acquisition finishes the
        state is `not_ready`; once it has finished without buying a single work (a withdrawn
        quote included), `nothing_purchased`.


        **Authorization:** buyer JWT. The acquisition must be the caller's own, or paid from the
        Company wallet of a Company the caller is an open admin of.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: The corpus state, whatever it is
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer or Company admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Build the corpus, if there is nothing to serve
      description: >
        Starts an assembly when the state is `rebuild_required`, or when it is `failed` for a
        transient reason such as object storage being unavailable — the request is the retry,
        and is answered as `pending` with 202. Does nothing when a corpus is already
        downloadable — re-assembling one that is sitting there spends minutes of a worker for a
        file the Buyer can already have — nor while a run is `assembling`, nor for a failure a
        rebuild would only repeat.


        Not needed for a first build: settlement queues one, and a `POST` that arrives before it
        starts is answered `pending` with 200 rather than queuing a second.


        A separate verb from `GET` rather than a flag on it, because a Buyer polling every few
        seconds while a run finishes would otherwise queue one assembly per poll.


        **Authorization:** buyer JWT. The acquisition must be the caller's own, or paid from the
        Company wallet of a Company the caller is an open admin of — who may ask for a rebuild too.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: >
            Nothing started — a corpus is already downloadable, a run is queued (`pending`) or in
            flight, the failure is not one a rebuild can fix, the acquisition has not finished
            (`not_ready`), or it bought nothing (`nothing_purchased`). The state says which.
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '202':
          description: Assembly started, and answered `pending`. Poll the GET until `ready`.
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer or Company admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/corpus/download:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer, or have been paid from the
          Company wallet of a Company the caller is an admin of.
    get:
      summary: Download the corpus
      description: >
        The archive itself, behind the same authentication as everything else here — deliberately
        not a presigned object-store link, which would be a bearer capability anyone holding it
        could spend. The bytes are streamed from this route in every environment; it never
        redirects, so one authenticated request is the whole download:


        `curl -o corpus.tar.gz -H "Authorization: Bearer $TOKEN" https://api.ledewire.com/v1/acquisitions/$ID/corpus/download`


        The archive is sent with chunked transfer encoding and carries no `Content-Length`. To
        verify a download is complete, compare its size with the `byte_size` the state endpoint
        reports.


        A corpus that is not `ready` answers with its state at 200, exactly as the state endpoint
        would: asking for the file of an expired corpus is the same situation as asking where it
        is.


        **Authorization:** buyer JWT. The acquisition must be the caller's own, or paid from the
        Company wallet of a Company the caller is an open admin of.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: >
            The archive, or — when there is nothing to serve — the corpus state as JSON.
          headers:
            Retry-After:
              $ref: '#/components/headers/PollRetryAfter'
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            `Invalid Role`: the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer or Company admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/manifest:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer, or have been paid from the
          Company wallet of a Company the caller is an admin of.
    get:
      summary: The signed manifest of a Bulk acquisition
      description: >
        Returns the audit record standalone, so it can be obtained long after the corpus blob has
        expired. Its own resource rather than a field on the corpus download, because a field on a
        download that no longer exists is not a record anyone can obtain.


        To verify a corpus against it, resolve `signing_kid` through
        `/.well-known/ledewire-signing-keys.json`, match the key on all 32 raw public-key bytes,
        check it was valid at `signed_at`, verify the detached signature over the manifest's exact
        bytes, recompute every delivered entry's content hash against its file, and check the
        archive holds no file the manifest does not list. See docs/bulk-corpus-and-manifest.md.


        **Authorization:** buyer JWT. The acquisition must be the caller's own, or paid from the
        Company wallet of a Company the caller is an admin of.
      tags:
        - audit-export
      responses:
        '200':
          description: The signed manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusManifestResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No such acquisition for this Buyer or Company admin. Deliberately the same answer as "not yours": a 403
            distinguishing them would confirm to a stranger that a named Buyer ran a bulk
            acquisition, which is the one fact this product's customers care about keeping quiet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            The acquisition exists and has no manifest yet. The manifest is written once, at first
            assembly, which starts by itself when the acquisition settles with at least one work
            delivered. So this answers while the run or that first assembly is still under way —
            "not yet", rather than "there is nothing here". An acquisition that finished without
            buying a single work never gets a manifest, and the message says it purchased nothing.
            An older one may still have a manifest from before that rule, recording no works
            delivered; it is served like any other.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/ledewire-signing-keys.json:
    get:
      summary: The audit-export signing key history
      description: >
        Publishes the append-only, hash-chained log of every Ed25519 key that has signed an
        audit-export manifest. A verifier holding a corpus resolves the manifest's `kid` through
        this document — never through the `jwk` inline in the manifest's own JWS header, which an
        attacker controls end to end. The match is on all 32 raw public-key bytes.

        Public and unauthenticated by necessity: a third party verifying a decade-old corpus holds
        no credentials of ours, and an anchor you need our permission to reach is not an anchor.

        Note the limit, stated in full in docs/audit-export-key-history.md: the root entry is
        signed by nothing and this document is served from a domain we control, so content and
        licence terms verify without us while our attestation does not, until #989 lands.
      tags:
        - audit-export
      security: []
      responses:
        '200':
          description: The key history, in chain order
          headers:
            Cache-Control:
              schema:
                type: string
              description: >
                `max-age=300, public`. Five minutes, not a day, so a revocation reaches verifiers
                quickly.
            ETag:
              schema:
                type: string
              description: Changes whenever an entry is appended. Send it back as `If-None-Match` to revalidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyHistoryResponse'
        '304':
          description: >
            The history is unchanged since the `If-None-Match` ETag. No body; carries the same
            `Cache-Control`.
        '503':
          description: >
            No signing key has been activated, or the history could not be read. Deliberately not
            an empty list — a verifier reading `[]` would conclude its signature came from a key we
            never had, which is the answer it should get for a forgery, and the two must not look
            alike. Sent with `Cache-Control: no-store`, so no cache keeps it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/pricing_rules:
