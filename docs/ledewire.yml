openapi: 3.1.0
info:
  title: LedeWire API
  version: 1.1.0
  description: |
    LedeWire API for buyer/seller authentication, wallet funding, content purchases, and seller content management.

    ## Errors

    Every error under `/v1` is JSON in the `ErrorResponse` shape, `{"error": {"code": <HTTP status>, "message": "..."}}`, whatever the request's `Accept` header. That includes errors an operation does not list: an unexpected `500`, a `404` for a path no operation matches, and a `400` for a request body that is not valid JSON. Those carry the status phrase (`Internal Server Error`, `Not Found`, `Bad Request`) as the message and nothing more.

    Two exceptions:

    - `/v1/mcp` answers errors as JSON-RPC error responses, per the MCP Streamable HTTP transport. When no request id could be read the `id` member is left out; an unexpected failure is `-32603` (`Internal error`) and a body that is not JSON is `-32700` (`Parse error`); a `429` is `-31429`. Its `401` and `403` authorization challenges are the exceptions: they carry the MCP authorization spec's `WWW-Authenticate` header and the bodies documented on `POST /v1/mcp`.
    - The payment webhooks (`POST /v1/webhooks/payment`, `POST /v1/wallet/payment-webhook`) answer the payment processor with `{"error": "<message>"}`.

    Paths outside `/v1` (the OAuth endpoints, `/ahoy`, `/.well-known`) document their own error shapes.

servers:
  - url: https://api.ledewire.com
    description: Production server
  - url: https://api-staging.ledewire.com
    description: Staging server
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT Bearer token obtained from authentication endpoints.


        A buyer token, or a merchant token on a `/v1/merchant` route, whose user no longer exists
        is answered `401` `User not found`.


        **Seller Permission Levels:**

        - **`view` permission** - Read-only access. Obtained by authenticating with API key only (without secret).

        - **`full` permission** - Full read/write access. Obtained by authenticating with both API key and API secret.


        Use the appropriate authentication method based on your use case:

        - For read-only operations (listing, viewing, searching content), authenticate with API key only to receive `view` permission

        - For write operations (creating, updating, deleting content), authenticate with API key + secret to receive `full` permission

    McpKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: key:secret
      description: >
        MCP API key authentication. Format: `Authorization: Bearer <key>:<secret>`.


        Every key belongs to a user; a key may also be scoped to one store. Keys carry four
        independent permission flags:

        - **`can_search`** — the buyer tier: `get_wallet_balance`, `get_content_details`,
          `get_content` (read-only), `list_purchases`, `list_my_stores` and `fund_wallet`.

        - **`can_purchase`** — required to submit payment via `_meta["x402/payment"]` in `get_content`.

        - **`can_manage_content`** — the seller content tier (`mcp:manage_content`); store-scoped keys only.

        - **`can_read_analytics`** — the seller analytics tier (`mcp:analytics`); store-scoped keys only.


        Keys from `POST /v1/mcp/keys` (requires buyer JWT) or the `register` MCP tool (no prior
        auth needed) never expire. OAuth access tokens from `POST /oauth/token` are keys of the
        same kind, sent the same way, and expire after one hour. Any key can be revoked at any
        time via `DELETE /v1/mcp/keys/{id}`.

  headers:
    SellerContentDeprecation:
      description: Always `true`. The `/v1/seller/content` routes are deprecated.
      schema:
        type: string
        enum: ['true']
    SellerContentSunset:
      description: The announced sunset date, `2026-09-01`. The routes still serve past it.
      schema:
        type: string
        enum: ['2026-09-01']
    SellerContentSuccessor:
      description: >
        `</v1/merchant/{store_id}/content>; rel="successor-version"` — the literal template, with
        `{store_id}` unfilled.
      schema:
        type: string
    AuthRetryAfter:
      description: >
        Seconds to wait before retrying, as an integer. 60 when a per-IP budget tripped (each is
        counted over a one-minute window). When a per-account backoff refused the request it is
        what remains of that account's block, which grows with repeated failures, up to 900.
      schema:
        type: integer
        minimum: 1
    PollRetryAfter:
      description: >
        Seconds to wait before polling again, sent only while a bulk step is still in progress —
        a quote being priced, a run in flight, a corpus queued or assembling — and equal to the
        body's `poll_after_seconds`. Absent once there is nothing left to wait for. Sized from the
        selection: at least 2 and at most 60.
      schema:
        type: integer
        minimum: 2
  schemas:
    PublicConfigResponse:
      type: object
      description: Platform-level public configuration. No authentication required.
      required: [google_client_id]
      properties:
        google_client_id:
          type: [string, 'null']
          description: >
            Google OAuth client ID for initialising the Google Identity Services library. null when
            the server has none configured.

    ContentAccessInfo:
      type: object
      description: >
        The caller's own checkout state for one work. `GET /v1/content/{id}/with-access` takes a
        Buyer token or none, so this is only ever about the Buyer asking, never about another
        Buyer. Without a token, every Buyer field is `null` or `false` and `next_required_action`
        is `authenticate`.
      required: [user_id, has_purchased, has_sufficient_funds, wallet_balance_cents, next_required_action, remaining_cents, company_name]
      properties:
        user_id:
          type: [string, 'null']
          description: The caller's own id. `null` without a token.
        has_purchased:
          type: boolean
          description: >
            Whether the caller has ever bought this work. History, not access: a past purchase is
            a spent receipt, and the work is delivered again only by buying it again.
        has_sufficient_funds:
          type: boolean
          description: >
            Whether the caller can afford the price. For a Company member, whether their Remaining
            covers it — the Company balance is never consulted, and a shortfall there surfaces
            only as the refusal at purchase.
        wallet_balance_cents:
          type: [integer, 'null']
          description: >
            The caller's personal wallet balance. `null` for a Company member, who is shown their
            Remaining and never the Company balance, and `null` without a token.
        next_required_action:
          type: string
          enum: [authenticate, fund_wallet, purchase]
          description: Never fund_wallet for a Company member, who cannot fund the Company wallet.
        remaining_cents:
          type: [integer, 'null']
          description: >
            What the caller's daily spend cap leaves today: a member's cap from their Company, or
            a non-member's own cap. `null` when uncapped, and without a token.
        company_name:
          type: [string, 'null']
          description: The caller's Company, for a Company member. `null` otherwise.

    AuthenticationResponse:
      type: object
      required: [token_type, access_token, refresh_token, expires_at]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9..VSFsm5ysjtZLheVfhv6DWwH1A9zn_WA6rnGOlPR1R3U
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: When the access token expires, about 30 minutes after it was issued. Equal to the token's `exp` claim. Refresh before then.
        invitations:
          type: object
          description: >
            Present only on `POST /v1/auth/login/google` for an account that already existed, when
            the call carried `invitation_token` or `company_invitation_token`. One entry per token
            sent. A refused invitation does not refuse the sign-in; it is reported here instead.
          properties:
            store:
              $ref: '#/components/schemas/InvitationOutcome'
            company:
              $ref: '#/components/schemas/InvitationOutcome'

    InvitationOutcome:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        reason:
          $ref: '#/components/schemas/InvitationRefusalReason'
        message:
          type: string
          description: The refusal in words, for display. Present when `accepted` is false.

    InvitationRefusalReason:
      type: string
      description: >
        Why an invitation was not accepted. `not_found` also covers a Company invitation addressed
        to another email, deliberately indistinguishable; `expired` covers a withdrawn one;
        `wrong_email` is a store invitation sent to another address; `already_in_company` means
        the account belongs to another Company and must leave it first; `already_member` means
        it already belongs to the store; `invalid` is an invitation that could not be saved,
        or a Machine user refused.
      enum: [not_found, already_accepted, expired, wrong_email, already_in_company, already_member, invalid]

    InvitationNotAcceptedError:
      type: object
      description: >
        An invitation refused. Signup and Google sign-in return it with HTTP 422 and name the
        `invitation`; `POST /v1/company/invitations/accept` (403, 404, 409 or 410) and
        `POST /v1/auth/merchant/accept-invitation` (403, 404, 409, 410 or 422) return it with
        their own status and no `invitation`.
      required: [error, reason]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code:
              type: integer
            message:
              type: string
            type:
              type: string
              enum: [invitation_not_accepted]
        reason:
          $ref: '#/components/schemas/InvitationRefusalReason'
        invitation:
          type: string
          enum: [store, company]

    MerchantAuthenticationResponse:
      type: object
      description: Token response for merchant authentication. Includes stores the user has access to so the client can prompt for store selection.
      required: [token_type, access_token, refresh_token, expires_at, stores]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: When the access token expires, about 30 minutes after it was issued. Equal to the token's `exp` claim. Refresh before then.
        stores:
          type: array
          description: Stores the authenticated user can manage, for store-selection on the client.
          items:
            $ref: '#/components/schemas/MerchantLoginStore'

    MerchantLoginStore:
      type: object
      description: A store the authenticated merchant user has access to.
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, author]
          description: Derived role. `owner` if the user owns this store; `author` if they have author permissions only.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
            type:
              type: string
              description: >
                Machine-readable reason, present on refusals that carry one. Branch on
                this rather than on `message`, which is prose and may be reworded.
                `retrieval_failed` is transient and worth retrying; `not_licensable`
                means report it undelivered; `not_found` means the publisher no longer
                has the work, so report it undelivered and do not retry; `price_drifted`
                means re-quote;
                `client_error` is ours to fix and must never be retried unchanged;
                `insufficient_funds` is cleared by funding the wallet and
                `daily_spend_cap_reached` deliberately is not; `not_subscribed` means the work
                is sold only to Buyers whose Company subscribes to it (SEC filings), so do not
                retry it until the Company subscribes. Each code means the same whichever kind
                of work was being bought, though only a work sold by subscription returns
                `not_subscribed`.


                On the Bulk acquisition steps: `exclusions_unacknowledged` means post the
                acknowledgement first; `quote_not_ready` means keep polling a `pending`
                quote or re-quote a `failed` one (`quote_state` says which);
                `quote_expired` and `quote_in_progress` mean re-quote, and wait for the
                re-quote already running; `invalid_acquisition_state` means re-read the
                acquisition (`status` and `expected_status` are alongside);
                `nothing_to_hold` means every work was excluded and a different selection
                is needed; `run_not_started` means the run could not be queued, so nothing
                was held and the same authorization is safe to retry.
                `selection_too_large` (with `maximum` and `submitted`) means trim the
                Selection; `selection_value_too_large` (with `maximum_cents` and
                `submitted`) means split it into two acquisitions.


                `invitation_not_accepted` means a store or Company invitation was refused;
                `reason` alongside says why (see `InvitationNotAcceptedError`).


                `email_not_verified` is a Google sign-in refused because Google has not
                verified the account's email address; signing in again will not help until
                the address is verified with Google.
              enum:
                - retrieval_failed
                - not_licensable
                - not_found
                - price_drifted
                - client_error
                - not_subscribed
                - insufficient_funds
                - daily_spend_cap_reached
                - exclusions_unacknowledged
                - invalid_acquisition_state
                - quote_not_ready
                - nothing_to_hold
                - quote_expired
                - quote_in_progress
                - run_not_started
                - selection_too_large
                - selection_value_too_large
                - invitation_not_accepted
                - email_not_verified

    AuthSignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
          maxLength: 72
        name:
          type: string
          minLength: 1
          description: Optional, but must not be empty when sent.
        invitation_token:
          type: string
          description: >
            The token from a store invitation email. Signup also accepts it and the new account
            joins the store. If the invitation can't be accepted, nothing is created and the
            signup is refused with a 422 (`InvitationNotAcceptedError`).
        company_invitation_token:
          type: string
          description: >
            The token from a Company invitation email. Signup also accepts it and the new buyer
            joins the Company. If the invitation can't be accepted (unknown, addressed to another
            email, expired, withdrawn or already accepted), nothing is created and the signup is
            refused with a 422. A signup carrying both tokens joins both or neither.

    AuthLoginEmailRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthLoginOAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: A Google ID token, a three-segment JWT.
        invitation_token:
          type: string
          description: >
            The token from a store invitation email. The account joins the store. When this call
            creates the account and the invitation can't be accepted, nothing is created and the
            call is refused with a 422. See `company_invitation_token` for an existing account.
        company_invitation_token:
          type: string
          description: >
            The token from a Company invitation email. When this call creates the account, it
            also accepts the invitation and the new buyer joins the Company. If the invitation
            can't be accepted (unknown, addressed to another email, expired, withdrawn or already
            accepted), nothing is created and the call is refused with a 422. A call creating an
            account with both tokens joins both or neither. For an account that already exists,
            each token is accepted if it can be, the sign-in succeeds either way, and the
            response's `invitations` says what happened to each.

    MerchantEmailLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    MerchantGoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: A Google ID token, a three-segment JWT.

    AuthLoginApiKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        secret:
          type: string
          description: Optional. Without it the token has `view` permission; with it, `full`.

    AuthLoginBuyerApiKeyRequest:
      type: object
      required: [key, secret]
      properties:
        key:
          type: string
          description: Structured buyer API key (e.g. bktst_abc123)
        secret:
          type: string
          description: 64-char hex secret, shown once at creation

    UserApiKey:
      type: object
      required: [id, name, key, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Structured public identifier (e.g. bktst_abc123)
        last_used_at:
          type: [string, 'null']
          format: date-time
        spending_limit_cents:
          type: [integer, 'null']
          description: Maximum cumulative spend in cents. null = no limit.
        created_at:
          type: string
          format: date-time

    UserApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: >
            Human-readable label for the key. Must not be blank, and must be unique among the
            caller's own keys (a duplicate is refused with 422).
        spending_limit_cents:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
          description: Optional spend ceiling in cents, greater than zero. Omitted or null means no limit.

    UserApiKeyCreateResponse:
      type: object
      required: [id, key, secret]
      description: Returned once only at creation. The secret is not stored and cannot be retrieved again.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Structured public identifier (e.g. bktst_abc123)
        secret:
          type: string
          description: 64-char hex authentication secret. Store immediately — shown once only.

    UserSpendCap:
      type: object
      description: >
        The authenticated buyer's daily spend cap, read against the current spend window.
        The cap governs every wallet debit the buyer makes — MCP, REST, or the web payment
        gate — and spend is derived from completed purchases, so a refund returns allowance.
        cap_cents, spent_cents, remaining_cents and resets_at are spelled exactly as they are
        in DailySpendCapReachedError, so a refusal and this resource describe the same numbers.
        For a Company member it is the membership's cap, read-only, in the Company's timezone,
        counting only spend paid through the membership; company_name names the Company. The
        Company balance never appears here.
      required: [cap_cents, spend_window_timezone, spent_cents, remaining_cents, resets_at, bulk_exempt, company_name]
      properties:
        cap_cents:
          type: [integer, 'null']
          description: The daily spend cap in cents. null means uncapped.
        spend_window_timezone:
          type: string
          description: >
            IANA timezone whose calendar day bounds the spend window. Defaults to UTC.
            Reports the zone actually used, so an unrecognised stored value reads back as UTC.
        spent_cents:
          type: integer
          description: Total spent so far in the current spend window, summed over completed purchases by any path.
        remaining_cents:
          type: [integer, 'null']
          description: >
            Cap minus spend so far, floored at zero. null when the buyer is uncapped — there is
            no ceiling to subtract from. Zero after the cap is lowered below spend already made.
        resets_at:
          type: string
          format: date-time
          description: The instant the current spend window rolls, in UTC.
        bulk_exempt:
          type: boolean
          description: >
            Whether this buyer's bulk acquisitions are exempt from the cap. When true,
            spent_cents and remaining_cents describe ordinary spend only — an authorized
            bulk acquisition does not consume them — so a client presenting remaining_cents
            must say which number it is.
            Always false for a Company member, whose cap binds bulk acquisitions too.
        company_name:
          type: [string, 'null']
          description: >
            The Company whose cap this is, for a buyer with an open Company membership; null
            otherwise. A member sees the Company's name, never its balance.

    CompanyInvitation:
      type: object
      description: >
        A pending invitation to join a Company. Joining always waits for the invitee to accept,
        because it moves their Agents' spending onto the Company wallet. Never carries the signup
        token, which reaches only the invited address.
      required: [id, company_id, company_name, email, role, invited_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        company_name:
          type: string
        email:
          type: string
          description: The invited address, lowercased.
        role:
          type: string
          enum: [admin, member]
        invited_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Seven days after it was sent. An expired invitation cannot be accepted.

    CompanyInvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyInvitation'

    CompanyInvitationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
          default: member

    CompanyMember:
      type: object
      description: An open membership as a Company admin sees it.
      required: [id, user_id, name, email, kind, role, joined_at, daily_spend_limit_cents]
      properties:
        id:
          type: string
          format: uuid
          description: The membership id, used by the members/{id} routes.
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
          description: Null for a Machine user, which has no email address.
        kind:
          type: string
          enum: [human, machine]
          description: >
            A machine member is a Machine user: it cannot be made an admin, and removing it
            deactivates it permanently.
        role:
          type: string
          enum: [admin, member]
        joined_at:
          type: string
          format: date-time
        daily_spend_limit_cents:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >
            The member's daily Spend cap, read in the Company's timezone. Never null: a member is
            never uncapped. Defaults to 1000 ($10) on joining, and again on rejoining.

    CompanyPurchase:
      type: object
      description: >
        One thing the Company paid for, as a Company admin sees it: a purchase or a Bulk
        acquisition drawn on the Company wallet, attributed to the member who bought it.
      required: [kind, id, member, status, amount_cents, occurred_at]
      properties:
        kind:
          type: string
          enum: [purchase, bulk_acquisition]
        id:
          type: string
          format: uuid
          description: The purchase id, or the acquisition id for a Bulk acquisition.
        member:
          $ref: '#/components/schemas/CompanyPurchaseMember'
        status:
          type: string
          description: The purchase's or the acquisition's own status.
        amount_cents:
          type: integer
          description: >
            A purchase's price. A Bulk acquisition's captured amount once it has settled, failed or
            been cancelled, and the amount still held while it is authorized or acquiring — so while a
            Hold is live this is more than the member's `spend_cents`, which counts only what was
            captured.
        occurred_at:
          type: string
          format: date-time
          description: >
            When the purchase was made, or when the Bulk acquisition was authorized — the moment it
            counts against the member's Spend window.

    CompanyPurchaseMember:
      type: object
      description: >
        The membership that paid. Recorded when it was paid, so it still names the member after
        they leave; a person who left and rejoined appears under each membership.
      required: [id, user_id, name, kind, left_at]
      properties:
        id:
          type: string
          format: uuid
          description: The membership id, which the `member` filter takes.
        user_id:
          type: string
          format: uuid
        name:
          type: string
          description: >
            The member's current name, read when the response is built. Renaming a Machine user
            (PATCH /v1/company/machine-users/{id}) relabels its earlier rows too; the audit trail
            keeps the old name.
        kind:
          type: string
          enum: [human, machine]
        left_at:
          type: [string, 'null']
          format: date-time
          description: When the membership closed, or null while it is open.

    CompanyPurchaseList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyPurchase'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    CompanySpendList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Every membership the Company has had, open or closed, oldest first.
          items:
            type: object
            required: [member, spend_cents]
            properties:
              member:
                $ref: '#/components/schemas/CompanyPurchaseMember'
              spend_cents:
                type: integer
                description: >
                  What the member has spent of the Company's money in the range, net of refunds, read
                  from the member's own ledger account. A Bulk acquisition counts what it captured; a
                  live Hold does not count until it captures.

    CompanyMachineUser:
      type: object
      description: >
        A Machine user as a Company admin sees it: a Buyer with a name and no email, password or
        login, created as an active non-admin member. Deactivation is permanent.
      required: [id, user_id, name, description, created_by_user_id, created_at, deactivated_at]
      properties:
        id:
          type: string
          format: uuid
          description: The Machine user id, used by the machine-users/{id} routes.
        user_id:
          type: string
          format: uuid
          description: Its Buyer id, which attribution and history name it by.
        name:
          type: string
          description: >
            Unique among the Company's active Machine users, compared case-sensitively (`Bot` and
            `bot` may both be active); a deactivated one's may be reused.
        description:
          type: [string, 'null']
        created_by_user_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        deactivated_at:
          type: [string, 'null']
          format: date-time

    CompanyMachineUserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMachineUser'

    CompanyMachineUserRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: >
            Trimmed of surrounding whitespace before it is checked; over 100 characters after
            trimming is refused with 422.
        description:
          type: [string, 'null']

    CompanyMachineUserUpdateRequest:
      type: object
      description: >
        At least one of `name` and `description`. A null or blank `description` clears it; `name`
        cannot be null.
      anyOf:
        - required: [name]
        - required: [description]
      properties:
        name:
          type: string
          maxLength: 100
          description: >
            Trimmed of surrounding whitespace before it is checked; over 100 characters after
            trimming is refused with 422.
        description:
          type: [string, 'null']

    CompanyMachineUserBuyerKey:
      type: object
      description: >
        A Machine user's Buyer key as a Company admin sees it. It logs in through
        POST /v1/auth/login/buyer-api-key. Its limit is the Machine user's membership Spend cap.
      required: [id, name, key, created_by_user_id, last_used_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Structured public identifier (e.g. bktst_abc123)
        created_by_user_id:
          type: [string, 'null']
          format: uuid
          description: The Company admin who created it.
        last_used_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CompanyMachineUserBuyerKeyCreateResponse:
      description: Returned once only at creation. The secret is not stored and cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/CompanyMachineUserBuyerKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 64-char hex authentication secret. Store immediately — shown once only.

    CompanyMachineUserBuyerKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMachineUserBuyerKey'

    CompanyMachineUserBuyerKeyRequest:
      type: object
      required: [name]
      description: >
        spending_limit_cents is refused with 400: the Machine user's membership Spend cap is its limit.
      properties:
        name:
          type: string
          description: Unique among this Machine user's Buyer keys.

    CompanyMachineUserMcpKey:
      type: object
      description: >
        A Machine user's active MCP API Key as a Company admin sees it. Presented as a
        `key:secret` Bearer token. It carries buyer Scopes only, never a Store, and does not
        expire; revoke it instead.
      required: [id, label, key, scopes, created_by_user_id, expires_at, last_used_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        key:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [mcp:search, mcp:purchase]
        created_by_user_id:
          type: [string, 'null']
          format: uuid
          description: The Company admin who created it.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Always null for a key an admin created.
        last_used_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CompanyMachineUserMcpKeyCreateResponse:
      description: Returned once only at creation. The secret cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/CompanyMachineUserMcpKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Authentication secret. Store immediately — shown once only.

    CompanyMachineUserMcpKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMachineUserMcpKey'

    CompanyMachineUserMcpKeyRequest:
      type: object
      required: [label, scopes]
      description: >
        Any Scope other than mcp:search and mcp:purchase, or a store_id, is refused with 400.
      properties:
        label:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [mcp:search, mcp:purchase]

    CompanyMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMember'

    CompanyWallet:
      type: object
      description: >
        The Company wallet, as a Company admin sees it. No member-facing response carries these
        figures; only this one does.
      required: [balance_cents, held_cents, pending_top_up_cents, currency, company_name]
      properties:
        balance_cents:
          type: integer
          description: >
            Spendable now. Money held by in-flight Bulk acquisitions is already out of it. Negative
            when a reversed top-up has taken the wallet below zero; a purchase is refused whenever the
            balance does not cover its price.
        held_cents:
          type: integer
          description: >
            Committed to Company-paid Bulk acquisitions still in progress, including those started by
            members who have since left the Company. When an acquisition settles or is cancelled,
            what it captured is charged and the rest is released back to the balance.
        pending_top_up_cents:
          type: integer
          description: >
            The sum of top-ups not yet spendable: the same top-ups GET
            /v1/company/wallet/pending-top-ups lists. Not part of the balance until each settles.
        currency:
          type: string
          example: usd
        company_name:
          type: string

    CompanyPendingTopUp:
      type: object
      description: A Company wallet top-up that has not yet settled, as a Company admin sees it.
      required: [id, session_id, amount_cents, status, initiated_by_user_id, created_at, expected_debit_date]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: [string, 'null']
          description: The payment session id returned when the top-up was started.
        amount_cents:
          type: integer
        status:
          type: string
          enum: [pending, awaiting_verification, processing]
        initiated_by_user_id:
          type: string
          format: uuid
          description: The admin who started the top-up.
        created_at:
          type: string
          format: date-time
        expected_debit_date:
          type: [string, 'null']
          format: date
          description: >
            The payment provider's estimate of when an ACH debit lands. Not guaranteed, and null
            until the provider can determine it, and always for a card.

    CompanyPendingTopUpList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyPendingTopUp'

    CompanyInvitationAcceptRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the invitation email.

    CompanyMemberRoleRequest:
      type: object
      description: At least one of role and daily_spend_limit_cents.
      anyOf:
        - required: [role]
        - required: [daily_spend_limit_cents]
      properties:
        role:
          type: string
          enum: [admin, member]
        daily_spend_limit_cents:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: >
            The member's daily Spend cap in cents. Any admin may set any member's, their own
            included. null is refused — a member is never uncapped. Writes an AuditEvent.

    CompanyMembership:
      type: object
      description: >
        The authenticated buyer's own open Company membership. Names the Company but never its
        balance.
      required: [id, company_id, company_name, role, joined_at]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        company_name:
          type: string
        role:
          type: string
          enum: [admin, member]
        joined_at:
          type: string
          format: date-time

    UserSpendCapUpdateRequest:
      type: object
      description: >
        Sets the buyer's cap. The field is required and nullable: null is how a buyer becomes
        uncapped, and an omitted field is treated as a client error rather than as a request to
        be uncapped. A cap below spend already made in the current window is accepted — it simply
        leaves remaining_cents at zero until the window rolls. Zero is a valid cap and refuses
        every priced purchase.
      required: [daily_spend_limit_cents]
      properties:
        daily_spend_limit_cents:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
          description: >
            New cap in whole cents, or null to remove the cap. Negative, fractional and out-of-range
            values are rejected with 422.

    McpApiKeyCreateRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Human-readable name for the key
        can_search:
          type: boolean
          description: Grants access to search and read-only MCP tools. Defaults to true.
        can_purchase:
          type: boolean
          description: Grants access to payment submission via MCP. Defaults to false.
        store_id:
          type: [string, 'null']
          format: uuid
          description: Scopes the key to a specific store. User must be an owner or author of that store.
        can_manage_content:
          type: boolean
          description: >
            Grants access to seller content management tools. Defaults to false. Requires a
            `store_id` for which the user is an owner or author; otherwise the request is refused
            with 403. Re-checked on every use, so a key stops working if the holder loses the role.
        can_read_analytics:
          type: boolean
          description: >
            Grants access to seller analytics tools. Defaults to false. Requires a `store_id` for
            which the user is an owner or author; an author's analytics cover only their own
            content. Otherwise refused with 403, and re-checked on every use.

    McpApiKeyCreateResponse:
      type: object
      required: [id, key, secret, label, can_search, can_purchase, can_manage_content, can_read_analytics]
      description: Returned once only at creation. The secret cannot be retrieved again.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Public identifier used to look up the key
        secret:
          type: string
          description: Authentication secret. Store immediately — shown once only.
        label:
          type: string
        can_search:
          type: boolean
        can_purchase:
          type: boolean
        store_id:
          type: [string, 'null']
          format: uuid
        can_manage_content:
          type: boolean
        can_read_analytics:
          type: boolean

    McpApiKey:
      type: object
      required: [id, label, key, can_search, can_purchase, can_manage_content, can_read_analytics, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        key:
          type: string
        can_search:
          type: boolean
        can_purchase:
          type: boolean
        store_id:
          type: [string, 'null']
          format: uuid
        can_manage_content:
          type: boolean
        can_read_analytics:
          type: boolean
        last_used_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    ContentSearchResult:
      description: >
        One work in a Buyer's LedeWire search: a Store's work, or a brokered work LedeWire sells
        on behalf of the Publication it comes from (`content_type: brokered`). The same shape
        whether it came from `POST /v1/content/search` or MCP `search_content`, since both run
        the same search.
      type: object
      required: [id, title, teaser, price_cents, content_type, store_id, store_name, tags, authors, abstract, doi, publication_date, last_modified_date, citation_count, filing]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The work's title. Never null. On get_content and get_content_details, a brokered work stored without one is named from its publication and URL (`Inc. — inc.com/path`); search_content results may carry an empty string.
        teaser:
          type: string
          description: Plain UTF-8 text preview. Never base64.
        price_cents:
          type: integer
        content_type:
          type: string
          enum: [markdown, html, pdf, image, video, external_ref, brokered]
        store_id:
          type: string
          format: uuid
          description: >-
            The Store selling the work. For a brokered work, the same fixed id on every one
            (`f67c246e-206c-5d62-b113-c526c54fac76`), which stands for LedeWire and is not a Store
            that can be looked up. A work is bought by its `id`.
        store_name:
          type: string
          description: >-
            The Store selling the work: `LedeWire` for a brokered work, whose Publication names
            who originated it.
        tags:
          type: array
          items:
            type: string
        url:
          type: [string, 'null']
          description: Canonical article URL. Populated for brokered works; null for a Store's work unless it has a resource URL.
        authors:
          type: [array, 'null']
          description: Academic author display names. Null for non-academic content or unknown values.
          items:
            type: string
        abstract:
          type: [string, 'null']
          description: Academic abstract text. Null for non-academic content or when unavailable.
        doi:
          type: [string, 'null']
          description: DOI URL for academic works. Null for non-academic content or unknown values.
        publication_date:
          type: [string, 'null']
          description: >-
            When the work was published. For an SEC filing, the filing date: the day it was filed,
            as `YYYY-MM-DD`. For any other work from a Publication, the date the work's own page
            reports, as `YYYY-MM-DDTHH:MM:SS` with no zone, because the page gives none. For
            academic works, the source's publication date. Null when it isn't known. Never filled
            from `last_modified_date`.
        last_modified_date:
          type: [string, 'null']
          description: >-
            Null for an SEC filing. For any other work from a Publication, when the work's own
            page says it last changed, as `YYYY-MM-DDTHH:MM:SS` in UTC. Null when it isn't known.
        citation_count:
          type: [integer, 'null']
          description: Academic citation count from source metadata. Null for non-academic content or unknown values.
        filing:
          oneOf:
            - $ref: '#/components/schemas/ContentSearchFiling'
            - type: 'null'
          description: >-
            For an SEC filing, who filed it and what it is; null for every other work. Always
            sent. Only Buyers whose Company subscribes to SEC filings are shown filings.

    ContentSearchFiling:
      description: >
        An SEC filing's primary document, as a search result describes it. Its price is 0: the
        filing is public domain, and access comes with the Company's Subscription.
      type: object
      required: [filer_name, ticker, cik, form_type, filing_date, period_of_report, accession_number]
      additionalProperties: false
      properties:
        filer_name:
          type: string
          description: The filer's name as the SEC records it.
          example: Apple Inc.
        ticker:
          type: [string, 'null']
          description: The filer's first listed ticker. Null when the SEC lists none.
          example: AAPL
        cik:
          type: string
          description: The filer's SEC Central Index Key, zero-padded to ten digits.
          example: "0000320193"
        form_type:
          type: string
          description: The form. An amendment ends in `/A`, as in `10-K/A`; a revised proxy statement is `DEFR14A`.
          enum: [10-K, 10-Q, 8-K, 20-F, S-1, DEF 14A, 10-K/A, 10-Q/A, 8-K/A, 20-F/A, S-1/A, DEFR14A]
        filing_date:
          type: string
          format: date
          example: "2024-11-01"
        period_of_report:
          type: [string, 'null']
          format: date
          description: The period the filing reports on. Null when the form has none, as an 8-K or S-1 usually doesn't.
          example: "2024-09-28"
        accession_number:
          type: string
          description: The SEC's identifier for the filing.
          example: 0000320193-24-000123

    # The former name of `ContentSearchResult`, kept as an alias so MCP output schemas and
    # clients generated against it keep working. A bare `$ref` on purpose, with no description:
    # Mcp::OpenapiSchemaComponents publishes an alias as its target's shape under this name, so
    # the MCP tools' output schemas stay exactly what they were before the rename (#1226).
    McpContentSearchResult:
      $ref: '#/components/schemas/ContentSearchResult'

    McpContentSearchResultWithTopics:
      description: >
        A `ContentSearchResult` as MCP `search_content` returns it, with the Topics of the
        Publication a brokered work comes from. `POST /v1/content/search` carries the same Topics
        as `publication.topics` instead.
      allOf:
        - $ref: '#/components/schemas/ContentSearchResult'
        - type: object
          required: [publication_topics]
          properties:
            publication_topics:
              type: array
              description: >
                The Topics of the Publication this work comes from, when it is brokered and its
                URL's host is one of a listed Publication's domains (`www.` and letter case
                ignored). Empty when that Publication is not classified yet, when the host is on
                no listed Publication's domain, and for a work from a Ledewire store, which comes
                from no Publication. They describe the result and never decide whether it appears.
              maxItems: 5
              items:
                $ref: '#/components/schemas/TopicSlug'
              example: [business-and-finance, personal-finance]

    ContentSearchResultWithPublication:
      description: >
        A `ContentSearchResult` as `POST /v1/content/search` returns it, naming the Publication a
        brokered work belongs to. MCP `search_content` results do not carry `publication`.
      allOf:
        - $ref: '#/components/schemas/ContentSearchResult'
        - type: object
          required: [publication]
          properties:
            publication:
              oneOf:
                - $ref: '#/components/schemas/ContentSearchPublication'
                - type: 'null'
              description: >
                The Publication this work was published by, when it is brokered and its URL's host
                is one of a listed Publication's domains (`www.` and letter case ignored). Null for
                Store works and for brokered works on no listed Publication's domain. An SEC filing
                always names the Publication of SEC filings, which is not listed. A work whose
                Publication is `bulk_licensable` can be added to a Selection for a Bulk acquisition.

    ContentSearchPublication:
      description: >
        The Publication a search result belongs to. `id` is the same id `GET /v1/publications`
        lists.
      type: object
      required: [id, name, bulk_licensable, topics]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The publication's display name.
        bulk_licensable:
          type: boolean
          description: >
            Whether works from this publication can come back in a Bulk acquisition's corpus — the
            same flag as on `Publication`.
        topics:
          type: array
          description: >
            The Topics this publication covers, as on `Publication`, less any slug that is no
            longer a Topic. Empty where it has not been classified yet. They describe the result and never decide whether it
            appears: a search returns the same works whatever their publications' Topics are.
          maxItems: 5
          items:
            $ref: '#/components/schemas/TopicSlug'
          example: [business-and-finance, personal-finance]

    ContentSearchRequest:
      description: >
        A Buyer's LedeWire search, across every Store's works and the brokered works of every
        Publication. Every field is optional. Without a `query` only Store works are searched,
        filtered by the rest, unless `form_type`, `ticker` or `cik` is given: then the SEC filings
        they name are listed, newest first.
      type: object
      additionalProperties: false
      properties:
        query:
          type: [string, 'null']
          description: >
            Full-text query. Brokered works are searched only when this is given, except SEC
            filings: `query` may be omitted when `form_type`, `ticker` or `cik` is given, to list
            the filings they name, newest first.
        tags:
          type: [array, 'null']
          description: Only works carrying every one of these tags.
          items:
            type: string
        max_price_cents:
          type: [integer, 'null']
          minimum: 0
          description: Only works priced at or below this.
        metadata:
          type: [object, 'null']
          description: Only works whose metadata holds every one of these key/value pairs.
          additionalProperties: true
        publication:
          type: [string, 'null']
          maxLength: 200
          description: >
            Only works from this Publication: its `id`, as `GET /v1/publications` and each
            result's `publication` give it, or its exact `name` in any letter case. A value that
            names no Publication returns no results, not an error.
        form_type:
          type: [string, 'null']
          enum: ['10-K', '10-Q', '8-K', '20-F', 'S-1', 'DEF 14A', null]
          description: >
            Only SEC filings of this form, its amendments included: `10-K` also returns `10-K/A`,
            and `DEF 14A` also returns revised proxy statements (`DEFR14A`).
            Only an SEC filing matches it, so no other work is returned.
        ticker:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9.-]{1,10}$'
          example: AAPL
          description: >
            Only SEC filings by the company listed under this ticker. A ticker that is not listed
            matches nothing. Only an SEC filing matches it, so no other work is returned.
        cik:
          type: [string, 'null']
          pattern: '^[0-9]{1,10}$'
          example: '320193'
          description: >
            Only SEC filings by the filer with this SEC Central Index Key, zero-padded or not.
            Only an SEC filing matches it, so no other work is returned.
        cursor:
          type: [string, 'null']
          description: >
            The previous page's `next_cursor`, sent with the same `query`, `tags`,
            `max_price_cents`, `metadata`, `publication`, `form_type`, `ticker`, `cik` and
            `limit`. A cursor sent with any of those changed, one more than 24 hours old, or one in
            an older format is refused with 422. Omit for the first page.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: >
            The most rows a page holds, shared between Store works and brokered works. Room one
            leaves unused is filled from the Store works where it can be.

    ContentSearchResponse:
      type: object
      required: [data, next_cursor, partial_results, unavailable_providers]
      additionalProperties: false
      properties:
        data:
          type: array
          description: >
            At most `limit` works, Store works and brokered works taken in turn, each in its own
            order of relevance. A page can be shorter than `limit`, or even empty, while
            `next_cursor` is not null: keep paging.
          items:
            $ref: '#/components/schemas/ContentSearchResultWithPublication'
        next_cursor:
          type: [string, 'null']
          description: >
            Send as `cursor` for the next page, within 24 hours. Null only when the search has
            been read to the end. When `partial_results` is true this still points at what could
            not be read, so sending it asks for those results again.
        partial_results:
          type: boolean
          description: >
            True when part of the search could not be run for this page, so the page may be
            missing works that match — it does not mean nothing more matched. Keep paging with
            `next_cursor`, which asks for the missing part again.
        unavailable_providers:
          type: array
          deprecated: true
          maxItems: 0
          items:
            type: string
          description: >
            Deprecated: always empty. Kept so existing integrations keep parsing the response;
            read `partial_results` instead.

    McpSellerContent:
      description: Content returned without a purchase to a store team member reading their own store's content — any of it for an owner, only what they wrote for an author.
      allOf:
        - $ref: '#/components/schemas/McpContentSearchResult'
        - type: object
          properties:
            content_body:
              type: [string, 'null']
              description: Article body. Present when content_type is `markdown` or inline `html`.
            content_uri:
              type: [string, 'null']
              description: External content URI. Present when content_type is `external_ref`, `pdf`, `image`, `video`, or remote `html`.

    McpFullContent:
      allOf:
        - $ref: '#/components/schemas/McpContentSearchResult'
        - type: object
          required: [purchased_at, _meta]
          properties:
            content_body:
              type: [string, 'null']
              description: Article body. Present when content_type is `markdown` or inline `html`.
            content_uri:
              type: [string, 'null']
              description: External content URI. Present when content_type is `external_ref`, `pdf`, `image`, `video`, or remote `html`.
            purchased_at:
              type: string
              format: date-time
            license:
              oneOf:
                - $ref: '#/components/schemas/PurchaseLicense'
                - type: 'null'
              description: >-
                The licence this work was delivered under, as granted on delivery — not the one
                asked for. Null when no licence was recorded: every purchase of a Store's work,
                and brokered purchases made before licences were recorded. Null means "not
                recorded", never "no rights granted".
            _meta:
              type: object
              required: ["x402/payment-response"]
              properties:
                "x402/payment-response":
                  type: object
                  required: [success, transaction, network, payer, accessToken]
                  properties:
                    success:
                      type: boolean
                    transaction:
                      type: string
                    network:
                      type: string
                    payer:
                      type: string
                    accessToken:
                      type: [string, 'null']
                      description: Signed receipt for this purchase, verifiable against `/.well-known/x402-jwks.json`. Null when the receipt could not be signed — no signing key configured (development and test only; elsewhere a missing key is an error), or a configured key that will not load or sign. The work is still delivered.

    McpPurchaseReceipt:
      type: object
      description: >-
        A record that a purchase happened: what was bought, when, at what price, and under
        which licence. Deliberately **not** a content schema. `list_purchases` used to return
        `McpFullContent`, which carries the article body, so a Buyer could re-read the full
        text of every work they had ever bought, free, 20 per call. Under single use (#939)
        a purchase is one licensed delivery, so purchase history is a receipt and the body is
        not part of it. Use `get_content` to buy a work — including one bought before.
      required: [purchase_id, content_id, title, store_id, store_name, price_cents, purchased_at, publication, license]
      properties:
        purchase_id:
          type: string
          description: The purchase this receipt records. Distinct per purchase, so repeat buys of one work are distinguishable.
        content_id:
          type: string
        title:
          type: string
          description: The work's title. For a brokered work stored without one, a name made from its publication and URL (`Inc. — inc.com/path`). Never null; empty only when there is nothing to name it by.
        url:
          type: [string, 'null']
          description: Where the work lives. Not a way to read it — a brokered URL serves a paywall to an unlicensed caller.
        store_id:
          type: string
          description: >-
            The Store that sold the work. For a brokered work, the same fixed id on every one
            (`f67c246e-206c-5d62-b113-c526c54fac76`), which stands for LedeWire and is not a Store
            that can be looked up.
        store_name:
          type: string
          description: >-
            The Store that sold the work: `LedeWire` for a brokered work, whose Publication names
            who originated it.
        publication:
          oneOf:
            - $ref: '#/components/schemas/PurchasePublication'
            - type: 'null'
          description: >-
            The Publication a brokered work was published under, as `content.publication` on
            `GET /v1/purchases` names it. Null for a Store's work, and for a brokered work on no
            listed Publication.
        price_cents:
          type: integer
          description: What this purchase was charged, at the price in force when it was made.
        purchased_at:
          type: string
          format: date-time
        license:
          oneOf:
            - $ref: '#/components/schemas/PurchaseLicense'
            - type: 'null'
          description: >-
            The licence this purchase was delivered under, as granted on delivery. Null when no
            licence was recorded: every purchase of a Store's work, and brokered purchases made
            before licences were recorded. Null means "not recorded", never "no rights granted".

    PurchaseLicense:
      type: object
      description: >-
        The licence one purchase was delivered under, exactly as the work's source granted it.
        Ledewire buys each brokered work on the Buyer's behalf, and passes the source's licence
        through unchanged rather than restating it. The same on every purchase surface:
        `get_content`, `list_purchases`, x402 and `/v1/purchases`.
      required: [type, permissions, document_url]
      properties:
        type:
          type: string
          description: >-
            The licence type the work's source granted, in the source's own words. The known
            values are `ON_DEMAND_LICENSE` (partial use of the work), `ON_DEMAND_FULL_USE_LICENSE`
            (full use) and `public-domain` (an SEC filing: the work is not under copyright, so no
            use of it needs a licence). Which one a brokered work comes with depends on what its
            Publication licenses. A source may add others; read an unknown one as its licence
            document states it.
          example: ON_DEMAND_LICENSE
        permissions:
          type: array
          description: >-
            The permissions the source granted, in its own words, such as `PARTIAL_USE` and
            `FULL_USE`. Empty for a `public-domain` work, where nothing is granted because nothing
            needs to be.
          items:
            type: string
          example: [PARTIAL_USE]
        document_url:
          type: [string, 'null']
          description: >-
            The terms this work was delivered under, or null where none are recorded. A Ledewire
            URL, `/v1/purchases/{id}/license_document`, readable with the credential that made the
            purchase. For a work its source licenses, the licence document the source granted, as
            Ledewire captured it when the work was bought, and null until it has been captured.
            For an SEC filing (`public-domain`), Ledewire's terms for SEC filings as Markdown, in
            the version the filing was delivered under: a later version of the terms does not
            change what an earlier purchase reports.

    PurchasePublication:
      type: object
      description: The Publication a purchased work was published under.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    McpGetWalletBalanceResult:
      type: object
      required: [wallet_balance_cents, remaining_cents, company_name]
      properties:
        wallet_balance_cents:
          type: [integer, 'null']
          description: >
            Current wallet balance in cents for the authenticated MCP key owner. null for a
            Company member, who never sees the Company balance; read remaining_cents instead.
        remaining_cents:
          type: [integer, 'null']
          description: >
            Spend cap minus spend so far today — for a Company member, their membership's cap,
            never reduced by the Company balance. null when uncapped.
        company_name:
          type: [string, 'null']
          description: The Company whose wallet pays, for a member; null otherwise.

    McpRegisterResult:
      type: object
      required: [key, secret, label, can_search, can_purchase]
      properties:
        key:
          type: string
          description: The API key identifier (not secret).
        secret:
          type: string
          description: The API key secret — returned once, never retrievable again.
        label:
          type: string
        can_search:
          type: boolean
        can_purchase:
          type: boolean

    McpGetContentDetailsResult:
      type: object
      required: [content, has_purchased, wallet_balance_cents, remaining_cents, company_name]
      properties:
        content:
          $ref: '#/components/schemas/McpContentSearchResult'
        has_purchased:
          type: boolean
          description: Whether the authenticated user has a completed purchase for this content.
        wallet_balance_cents:
          type: [integer, 'null']
          description: >
            Current wallet balance in cents for the authenticated MCP key owner. null for a
            Company member, who never sees the Company balance.
        remaining_cents:
          type: [integer, 'null']
          description: Spend cap minus spend so far today; a member's membership cap. null when uncapped.
        company_name:
          type: [string, 'null']
          description: The Company whose wallet pays, for a member; null otherwise.

    McpListPurchasesResult:
      type: object
      required: [purchases, total_count, offset, limit]
      properties:
        purchases:
          type: array
          description: >-
            Receipts, newest first, one per purchase and never collapsed — a Buyer may hold
            several purchases of one work, each at the price in force when it was made. These
            were `McpFullContent` until #939, which meant this endpoint returned the body of
            every article the Buyer had ever bought.
          items:
            $ref: '#/components/schemas/McpPurchaseReceipt'
        total_count:
          type: integer
          description: Total number of completed purchases.
        offset:
          type: integer
        limit:
          type: integer

    McpInsufficientFundsError:
      type: object
      description: >
        Returned as the JSON text in `content[0].text` when a get_content payment attempt
        fails due to insufficient wallet balance. Always accompanied by isError: true, and
        never in structuredContent. A Company member instead receives
        McpCompanyInsufficientFundsError, with the same error code.
      required: [error, wallet_balance_cents, required_cents, shortfall_cents, funding_url]
      properties:
        error:
          type: string
          enum: [insufficient_funds]
        wallet_balance_cents:
          type: integer
          description: Current wallet balance in cents.
        required_cents:
          type: integer
          description: Price of the content in cents.
        shortfall_cents:
          type: integer
          description: Amount needed to top up the wallet to cover this purchase (required_cents - wallet_balance_cents).
        funding_url:
          type: string
          format: uri
          description: Direct link to the Ledewire wallet funding page, pre-filled with the shortfall amount.
        funded_by:
          type: string
          enum: [buyer]
          description: Who must add money to clear this refusal. Always `buyer` here.

    McpCompanyInsufficientFundsError:
      type: object
      description: >
        A Company member's get_content payment the Company wallet cannot cover. Returned as
        the JSON text in `content[0].text`, always with isError: true and never in
        structuredContent. Same error code as McpInsufficientFundsError, but no
        balance, shortfall or funding_url: a member never sees the Company balance and cannot
        fund the Company wallet. The remedy is to ask a Company admin.
      required: [error, required_cents, message]
      properties:
        error:
          type: string
          enum: [insufficient_funds]
        required_cents:
          type: integer
          description: Price of the content in cents.
        message:
          type: string
        funded_by:
          type: string
          enum: [company]
          description: Who must add money to clear this refusal. Always `company` here.

    McpDailySpendCapReachedError:
      type: object
      description: >
        Returned as the JSON text in `content[0].text` when a get_content call is refused
        because the buyer's daily spend cap would be exceeded. Always accompanied by
        isError: true, and never in structuredContent.
        Deliberately carries no funding_url — adding money to the wallet cannot raise a cap,
        and a payload resembling McpInsufficientFundsError would send agents to the wrong
        remedy. The cap resets at resets_at; until then the only remedies are raising the cap
        or waiting.
      required: [error, cap_cents, spent_cents, remaining_cents, resets_at, bulk_exempt]
      properties:
        error:
          type: string
          enum: [daily_spend_cap_reached]
        cap_cents:
          type: integer
          description: The buyer's daily spend cap in cents.
        spent_cents:
          type: integer
          description: >
            Total spent so far in the current spend window. Ordinary completed purchases are
            summed per row; a bulk acquisition contributes its total, never its per-work
            purchases.
        remaining_cents:
          type: integer
          description: Cap minus spend so far, floored at zero — what the buyer may still spend in this window.
        resets_at:
          type: string
          format: date-time
          description: The instant the current spend window rolls, in UTC. One calendar day boundary in the buyer's own timezone.
        bulk_exempt:
          type: boolean
          description: >
            Whether this buyer's bulk acquisitions are exempt from the cap. When true,
            spent_cents and remaining_cents describe ordinary spend only — an authorized
            bulk acquisition does not consume them — so a client presenting remaining_cents
            must say which number it is.
            Always false for a Company member, whose cap binds bulk acquisitions too.
        message:
          type: string
          description: >
            The remedy in words. A Company member is told to ask a Company admin, who sets
            their cap; anyone else, that the daily cap is reached.

    DailySpendCapReachedError:
      type: object
      description: >
        The REST and x402 web-gate form of the same refusal, returned with HTTP 402 Payment
        Required by POST /v1/purchases, GET /v1/x402/contents/{id} and
        POST /v1/acquisitions/{acquisition_id}/authorization. Carries the same
        fields as McpDailySpendCapReachedError alongside the standard error envelope, and the
        same absence of a funding URL. `error.type` is the machine-readable discriminator.
      required: [error, cap_cents, spent_cents, remaining_cents, resets_at, bulk_exempt]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code:
              type: integer
              enum: [402]
            message:
              type: string
            type:
              type: string
              enum: [daily_spend_cap_reached]
        cap_cents:
          type: integer
          description: The buyer's daily spend cap in cents.
        spent_cents:
          type: integer
          description: Total spent so far in the current spend window, summed over completed purchases by any path.
        remaining_cents:
          type: integer
          description: Cap minus spend so far, floored at zero — what the buyer may still spend in this window.
        resets_at:
          type: string
          format: date-time
          description: The instant the current spend window rolls, in UTC.
        bulk_exempt:
          type: boolean
          description: >
            Whether this buyer's bulk acquisitions are exempt from the cap. When true,
            spent_cents and remaining_cents describe ordinary spend only.
        message:
          type: string
          description: >
            The remedy in words. A Company member is told to ask a Company admin, who sets
            their cap; anyone else, that the daily cap is reached.

    InsufficientFundsError:
      type: object
      description: >
        The REST and x402 form of an insufficient-funds refusal, returned with HTTP 422 by
        POST /v1/purchases and GET /v1/x402/contents/{id}. `error.type` is
        `insufficient_funds`; the remedy sits alongside the envelope. `funded_by` says whose
        money must be added. A personal Buyer gets their balance and shortfall; a Company
        member gets neither, since a member never sees the Company balance, and a `message`
        sending them to a Company admin instead. No `funding_url` on either: that is given
        only to an Agent, over MCP.
      required: [error, required_cents, funded_by]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code:
              type: integer
              enum: [422]
            message:
              type: string
            type:
              type: string
              enum: [insufficient_funds]
        required_cents:
          type: integer
          description: Price of the content in cents.
        funded_by:
          type: string
          enum: [buyer, company]
          description: >
            Who must add money. `buyer` — the Buyer's own wallet; `company` — the Company
            wallet, which only a Company admin can fund.
        wallet_balance_cents:
          type: integer
          description: The Buyer's wallet balance in cents. Only when `funded_by` is `buyer`.
        shortfall_cents:
          type: integer
          description: How much more the Buyer needs, in cents. Only when `funded_by` is `buyer`.
        message:
          type: string
          description: The remedy in words. Only when `funded_by` is `company`.

    McpFundWalletResult:
      type: object
      description: >
        Returned by the fund_wallet tool. Contains the buyer portal wallet URL.
        Open this link in a browser to add funds using the Ledewire wallet funding page.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Buyer portal wallet URL. Includes an `amount` query param when amount_cents was provided.

    McpJsonRpcResponse:
      type: object
      description: >
        One JSON-RPC 2.0 response envelope: `result` on success, `error` on failure.
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: >
            Echoed from the request. Absent when the request's id could not be read: a parse
            error (`-32700`), an invalid envelope or a `null` id (`-32600`), or a refusal made
            before the body was read (`405`, `406`, `413`, `415`, `429`).
          type: [integer, string]
        result:
          type: object
          description: Present on success.
          properties:
            _meta:
              type: object
              description: >
                On every 2026-07-28 result, `io.modelcontextprotocol/serverInfo` carries the
                server's identity (`name`, `version`), as `server/discover` does. Absent from
                legacy (`initialize`-era) results, which learn it from `initialize`.
              properties:
                io.modelcontextprotocol/serverInfo:
                  type: object
                  required: [name, version]
                  properties:
                    name:
                      type: string
                    version:
                      type: string
        error:
          type: object
          description: Present on failure.
          required: [code, message]
          properties:
            code:
              type: integer
              description: >
                JSON-RPC error codes: `-32700` malformed JSON, `-32600` invalid request
                envelope, `-32601` method not found, `-32602` invalid params (also an unknown
                `resources/read` URI, a missing required `prompts/get` argument, and a missing
                or malformed 2026-07-28 `_meta` envelope), `-32020` a 2026-07-28 header that
                does not match the body, `-32022` an unsupported protocol version, `-31429`
                rate limited (sent with HTTP 429; application-defined, since MCP defines no
                rate-limit code). Authentication and authorization failures are not JSON-RPC
                errors: they are a `401` or `403` with a `WWW-Authenticate` challenge.
            message:
              type: string
            data:
              description: Optional detail, e.g. `{ uri }` for an unknown resource.

    McpJsonRpcRequest:
      type: object
      description: >
        One JSON-RPC 2.0 request envelope. `id` is omitted for notifications
        (`notifications/initialized`), which are acknowledged with HTTP 202 and no body.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
          enum:
            - initialize
            - notifications/initialized
            - ping
            - server/discover
            - tools/list
            - tools/call
            - resources/list
            - resources/read
            - prompts/list
            - prompts/get
        id:
          description: >
            Client-supplied request identifier: any string, or an integer. Echoed back in the
            response. Omitted for notifications; a body without one is never run. `null` is
            refused with `-32600`.
          type: [integer, string]
        params:
          type: object
          description: >
            Shape depends on `method`.
            `initialize`: `{ protocolVersion, capabilities, clientInfo }` — all three required.
            `tools/call`: `{ name: "<tool_name>", arguments: { ... } }`; call `tools/list` for
            each tool's full `inputSchema`.
            `resources/read`: `{ uri: "ledewire://..." }`.
            `prompts/get`: `{ name: "<prompt_name>", arguments: { ... } }`.
            `tools/list`, `resources/list`, `prompts/list` and `ping` take no parameters.
          properties:
            name:
              type: string
              description: Tool name for `tools/call`, prompt name for `prompts/get`.
              enum:
                - search_content
                - list_publications
                - list_publication_works
                - list_topics
                - register
                - get_wallet_balance
                - get_content_details
                - get_content
                - list_purchases
                - list_my_stores
                - fund_wallet
                - list_my_content
                - search_my_content
                - register_content
                - update_content
                - check_content_status
                - get_sales_summary
                - get_content_sales
                - get_buyer_insights
                - onboarding_checklist
                - troubleshoot_integration
                - optimize_pricing
            arguments:
              type: object
              additionalProperties: true
            uri:
              type: string
              description: Resource URI for `resources/read`.
              enum:
                - ledewire://docs/overview
                - ledewire://docs/pricing-guidelines
                - ledewire://seller/context
            protocolVersion:
              type: string
              description: Requested revision for `initialize`. See the negotiation note on the endpoint.
            capabilities:
              type: object
            clientInfo:
              type: object

    McpListMyStoresResult:
      type: object
      description: >
        Returned by the list_my_stores tool. Every store the authenticated key's owner holds
        owner or author access to, with that store's non-archived content count.
      required: [stores]
      properties:
        stores:
          type: array
          items:
            type: object
            required: [store_id, store_name, role, content_count]
            properties:
              store_id:
                type: string
                format: uuid
              store_name:
                type: string
              role:
                type: string
                enum: [owner, author]
                description: Highest access the key owner holds on this store.
              content_count:
                type: integer
                description: Non-archived content items in the store.

    McpListMyContentResult:
      type: object
      description: >
        Returned by the list_my_content tool. A page of the connected store's catalog,
        including items no buyer can see. Pagination follows the standard `offset`/`limit`
        contract shared with list_purchases; the `total`, `page` and
        `per_page` fields are retained for clients written against the tool's original
        contract and describe the same window.
      required: [contents, total_count, offset, limit, total, page, per_page]
      properties:
        contents:
          type: array
          items:
            type: object
            required: [id, title, price_cents, visibility, content_type, tags, created_at]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              teaser:
                type: [string, 'null']
              price_cents:
                type: integer
              visibility:
                type: string
                description: '`public`, `unlisted`, or `archived`.'
              content_type:
                type: string
                enum: [markdown, html, pdf, image, video, external_ref, brokered]
              tags:
                type: array
                items:
                  type: string
              created_at:
                type: string
                format: date-time
        total_count:
          type: integer
          description: Total matching items across all pages, before pagination.
        offset:
          type: integer
          description: Number of records skipped to produce this page.
        limit:
          type: integer
          description: Maximum records this page could contain.
        total:
          type: integer
          description: >
            Legacy, superseded by `total_count`. Identical value, retained for existing
            clients.
        page:
          type: integer
          description: >
            Legacy, superseded by `offset`. One-based page number of the page *containing* the
            first record returned, derived from the window actually applied. When `offset` is
            not a multiple of `limit` there is no exact page number and this page's own span
            only overlaps the records returned — `offset: 25, limit: 10` returns records 25-34
            and reports page 3, which spans 20-29. Paginate by `offset`, not by incrementing
            this field.
        per_page:
          type: integer
          description: 'Legacy, superseded by `limit`. Identical value, retained for existing clients.'

    McpSearchMyContentResult:
      type: object
      description: >
        Returned by the search_my_content tool. Deliberately narrower than
        McpListMyContentResult — it is a lookup aid for finding a content_id, not a catalog view.
      required: [contents]
      properties:
        contents:
          type: array
          items:
            type: object
            required: [id, title, content_type, tags]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              teaser:
                type: [string, 'null']
              content_type:
                type: string
                enum: [markdown, html, pdf, image, video, external_ref, brokered]
              tags:
                type: array
                items:
                  type: string

    McpContentMutationResult:
      type: object
      description: >
        Returned by both register_content and update_content on success. The two tools share
        one shape: the identifying fields of the content item as it now stands. Neither
        returns the body — read it back with get_content if you need it.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content_type:
          type: string
          enum: [markdown, html, pdf, image, video, external_ref, brokered]
        visibility:
          type: string
          description: '`public`, `unlisted`, or `archived`.'
        price_cents:
          type: integer

    McpCheckContentStatusResult:
      type: object
      description: >
        Returned by the check_content_status tool. Read-only diagnosis of one content item —
        `issues` is empty exactly when `is_healthy` is true.
      required: [content_id, title, issues, recommendations, is_healthy]
      properties:
        content_id:
          type: string
          format: uuid
        title:
          type: string
        issues:
          type: array
          description: Problems found, in plain English. Empty when the item is healthy.
          items:
            type: string
        recommendations:
          type: array
          description: Suggested next steps, one per issue where a fix is known.
          items:
            type: string
        is_healthy:
          type: boolean

    McpContentSalesRow:
      type: object
      description: One row of the get_content_sales tool's result — a single content item's sales performance.
      required: [content_id, title, purchase_count, revenue_cents]
      properties:
        content_id:
          type: string
          format: uuid
        title:
          type: string
        purchase_count:
          type: integer
        revenue_cents:
          type: integer

    McpGetContentSalesResult:
      type: object
      description: >
        Result of the get_content_sales tool — one page of the store's per-content sales
        ranking. Carried identically in structuredContent and in the double-encoded text block.
      required: [content_sales, total_count, offset, limit]
      properties:
        content_sales:
          type: array
          items:
            $ref: '#/components/schemas/McpContentSalesRow'
        total_count:
          type: integer
          description: >
            Number of content items in the whole ranking, not in the returned page. Scoped the
            same way the rows are — an author key counts only their attributed content.
        offset:
          type: integer
        limit:
          type: integer

    McpGetBuyerInsightsResult:
      type: object
      description: >
        Result of the get_buyer_insights tool — one page of the store's buyers, ranked by total
        spend descending. Carried identically in structuredContent and in the text block.
      required: [buyer_insights, total_count, offset, limit]
      properties:
        buyer_insights:
          type: array
          items:
            $ref: '#/components/schemas/BuyerStatisticsItem'
        total_count:
          type: integer
          description: >
            Number of buyers in the whole ranking, not in the returned page. Scoped the same way
            the rows are — an author key counts only buyers of their attributed content.
        offset:
          type: integer
        limit:
          type: integer

    AuthTokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ManageableStore:
      type: object
      required: [id, name, store_key, role, is_author, logo]
      properties:
        id:
          type: string
        name:
          type: string
        store_key:
          type: string
        role:
          type: string
          enum: [owner, author]
          description: Derived role. `owner` if the user owns this store; `author` if they have author permissions only.
        is_author:
          type: boolean
          description: Whether the authenticated user has author permissions for this store.
        logo:
          type: [string, 'null']

    MerchantUser:
      type: object
      required: [id, user_id, store_id, role, is_author, author_fee_bps, invited_at, accepted_at, email]
      properties:
        id:
          type: string
        user_id:
          type: [string, 'null']
        store_id:
          type: string
        role:
          type: [string, 'null']
          enum: [owner, null]
          description: Ownership flag expressed as a string. `owner` when `is_owner` is true; `null` for non-owner members (authors or uninvited users).
        is_author:
          type: boolean
          description: Whether this user can create and manage their own content.
        author_fee_bps:
          type: [integer, 'null']
          description: Per-author fee override in basis points (1/100th of a percent). Overrides the store's `default_author_fee_bps` when set. `null` means the store default applies.
        invited_at:
          type: [string, 'null']
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
        email:
          type: [string, 'null']

    MerchantInviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email address of the user to invite to the store.
        is_author:
          type: boolean
          default: true
          description: Whether to grant author permissions. Defaults to `true`.
        author_fee_bps:
          type: [integer, 'null']
          description: Per-author fee override in basis points (0–10000). Overrides the store's `default_author_fee_bps`. `null` or omitted means the store default applies.

    MerchantInviteResponse:
      type: object
      required: [invitation_token, email, role, is_author, expires_at]
      properties:
        invitation_token:
          type: string
        email:
          type: string
        role:
          type: [string, 'null']
          enum: [owner, null]
        is_author:
          type: boolean
        author_fee_bps:
          type: [integer, 'null']
          description: Per-author fee override set at invitation time.
        expires_at:
          type: string
          format: date-time

    WalletPaymentSessionRequest:
      type: object
      required: [amount_cents]
      properties:
        amount_cents:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >
            Amount to fund the wallet in cents. Must be greater than 0. An amount within this range
            can still be declined by the payment provider, which answers 402.
        currency:
          type: string
          pattern: '^[uU][sS][dD]$'
          default: usd
          description: >
            Currency code. Only `usd` is accepted, compared case-insensitively. Defaults to `usd`.
        metadata:
          type: object
          description: >
            Additional metadata to attach to the payment intent. At most 20 entries; each key at
            most 40 bytes; each value a string, number, boolean or null, at most 500 bytes in its
            string form (lengths here are bytes, not characters). Null values are dropped and the
            rest are sent as strings. The keys `user_id`, `funding_wallet` and
            `funding_transfer_id` are reserved and overwritten, as is `company_id` on
            `POST /v1/company/wallet/payment-session`. When sent, it must be an object:
            an explicit `null` is refused with 400.
          maxProperties: 20
          propertyNames:
            maxLength: 40
          additionalProperties:
            type: [string, number, boolean, 'null']
            maxLength: 500

    WalletPaymentSessionResponse:
      type: object
      required: [client_secret, session_id, public_key]
      properties:
        client_secret:
          type: string
          description: The client secret used by the payment widget to confirm the payment
        session_id:
          type: string
          description: The ID of the created payment session
        public_key:
          type: string
          description: The payment public key to be used during the payment processing

    PaymentWebhookEvent:
      type: object
      description: A payment provider webhook event object
      properties:
        id:
          type: string
          description: Unique identifier for the event
        type:
          type: string
          description: Type of event (e.g., payment_intent.succeeded, payment_intent.payment_failed)
        data:
          type: object
          description: Event data containing the object that triggered the event
          additionalProperties: true

    WalletBalanceResponse:
      type: object
      description: >
        The buyer's wallet. balance_cents and spendable_cents are the same number and always
        will be — balance_cents has always meant "what you can spend", and money committed to
        a bulk acquisition is a hold, which moves it out of the wallet rather than annotating
        it. held_cents and holds exist so a buyer mid-acquisition can see why their balance is
        lower than their purchase history explains. For a Company member the balances are
        null — a member never sees the Company balance — and remaining_cents and company_name
        say what they may still spend and whose wallet pays.
      required: [balance_cents, spendable_cents, held_cents, holds, remaining_cents, company_name]
      properties:
        balance_cents:
          type: [integer, 'null']
          description: >-
            Spendable balance in cents. Excludes held funds — those held against a bulk acquisition,
            and a brokered purchase's price while its content is being retrieved.
        spendable_cents:
          type: [integer, 'null']
          description: The same figure as balance_cents, named in the vocabulary holds require. null for a Company member.
        held_cents:
          type: integer
          description: >-
            Total held and not yet spent or released. Includes, for the few seconds its content is
            being retrieved, the price of a brokered purchase in progress, which has no entry in
            holds.
        holds:
          type: array
          description: One entry per bulk acquisition currently holding funds. Empty when none is.
          items:
            type: object
            required: [acquisition_id, held_cents, authorized_at]
            properties:
              acquisition_id:
                type: string
                format: uuid
              held_cents:
                type: integer
                description: What this acquisition is currently holding.
              authorized_at:
                type: string
                format: date-time
                description: When the hold was placed.
        remaining_cents:
          type: [integer, 'null']
          description: >
            Spend cap minus spend so far today — for a Company member, their membership's cap,
            never reduced by the Company balance. null when uncapped.
        company_name:
          type: [string, 'null']
          description: The Company whose wallet pays, for a member; null otherwise.

    WalletTransactionItem:
      type: object
      required: [id, type, reason, amount_cents, balance_after_cents, status, reference_id, description, occurred_at]
      properties:
        id:
          type: string
          description: ID of the transaction entry (matches the source record)
        type:
          type: string
          enum: [credit, debit]
          description: Direction relative to the user's wallet
        reason:
          type: string
          enum: [wallet_funding, purchase, refund, bulk_acquisition, bulk_hold]
          description: >
            What caused this wallet movement. bulk_acquisition and bulk_hold are each one entry
            for a whole bulk acquisition — its per-work purchases are deliberately not listed
            here, because one acquisition can hold tens of thousands of them and they describe
            one decision. bulk_hold is an acquisition still holding funds: the money has left the
            wallet but has not been spent, and it becomes a bulk_acquisition entry for the amount
            actually captured once the acquisition ends. An acquisition never produces both.
        amount_cents:
          type: integer
          description: >
            Always positive; direction expressed by `type`. For a bulk_hold entry this is what is
            currently held; for a bulk_acquisition entry it is what was captured, not what was
            held — the uncaptured remainder was released, never charged. Note that a bulk
            acquisition's per-work purchases each carry a price_cents that is a rounded display
            value and is NOT summable: bulk prices at micro precision and rounds to cents once,
            on the acquisition total, so this aggregate is the figure to read.
        balance_after_cents:
          type: integer
          description: Running wallet balance immediately after this event
        status:
          type: string
          enum: [completed, pending, failed, cancelled, settled, reverted, refunded,
                 authorized, acquiring]
          description: >
            Status of the source record. authorized/acquiring/settled/cancelled/failed are bulk
            acquisition states; the rest are purchase and funding transfer states.
        reference_id:
          type: string
          description: ID of the source record (Purchase, FundingTransfer or Acquisition)
        description:
          type: string
          description: Human-readable label suitable for display
        occurred_at:
          type: string
          format: date-time
          description: created_at of the source record

    PurchaseCreateRequest:
      type: object
      required: [content_id, price_cents]
      properties:
        content_id:
          type: string
        price_cents:
          type: integer
          description: >
            The price the Buyer was quoted, in cents. Must equal the work's current price, or the
            purchase is refused with 422. A numeric string is coerced to an integer.

    PurchaseVerifyResponse:
      type: object
      required: [has_purchased]
      properties:
        has_purchased:
          type: boolean
        purchase_details:
          type: object
          properties:
            purchase_id:
              type: string
            purchase_date:
              type: string
              format: date-time
        checkout_readiness:
          type: object
          properties:
            is_authenticated:
              type: boolean
            has_sufficient_funds:
              type: boolean

    ContentUpdateRequest:
      type: object
      additionalProperties: false
      description: >
        Update request for content. `content_body` applies to `markdown` and inline `html` content;
        `content_uri` applies to `external_ref` and remote `html` content. For `html`, submitting
        both `content_body` and `content_uri` in the same request is rejected with `400`.
      properties:
        title:
          type: string
          description: Content title
        content_body:
          type: string
          format: byte
          description: Full article body, base64 encoded. For `markdown` and inline `html` content. Must be base64-encoded before sending (e.g. `btoa(bodyText)`).
        content_uri:
          type: string
          description: URI of the resource. For `external_ref` and remote `html` content.
          example: https://vimeo.com/123456789
        external_identifier:
          type: [string, 'null']
          description: >
            Namespaced platform ID, e.g. `vimeo:123456789`. Accepted for `external_ref` and `video`
            content; ignored for other types.
          example: vimeo:123456789
        teaser:
          type: string
          format: byte
          description: Content teaser, base64 encoded. Must be base64-encoded before sending (e.g. `btoa(teaserText)`)
        price_cents:
          type: integer
          minimum: 1
          description: Price in cents (must be greater than 0)
        visibility:
          type: string
          enum: [public, unlisted]
        metadata:
          type: object
          additionalProperties: true
        store_user_id:
          type: [string, 'null']
          description: >
            Assign or clear content authorship. Provide the `id` of a `StoreUser` from
            `GET /v1/merchant/{store_id}/users` to assign an author, or `null` to clear attribution.
            Only available to `owner` role and API key auth.
            Users with `is_author: true` (non-owner) cannot reassign their own content.

    SalesStatisticsItem:
      type: object
      required: [content_id, title, total_sales, total_revenue_cents]
      properties:
        content_id:
          type: string
        title:
          type: string
        total_sales:
          type: integer
        total_revenue_cents:
          type: integer
          description: >
            Store net revenue from this content's completed sales, in cents: the sale price less the
            platform fee and any author share.

    BuyerStatisticsItem:
      type: object
      description: >
        Seller-scoped buyer aggregate statistics for reporting.


        Prefer `buyer_ref` over any global buyer identifier.
      required: [buyer_ref, purchases_count, total_spent_cents, first_purchase_at, last_purchase_at, buyer_status]
      properties:
        buyer_ref:
          type: string
          description: Opaque, seller-scoped identifier for a buyer (not the global user id).
        purchases_count:
          type: integer
          description: Number of completed purchases by this buyer for this seller.
        total_spent_cents:
          type: integer
          description: >
            Store net revenue from this buyer's completed purchases, in cents: what the store kept
            after the platform fee and any author share, not the amount the buyer paid.
        first_purchase_at:
          type: string
          format: date-time
          description: Timestamp of the buyer's first completed purchase for this seller.
        last_purchase_at:
          type: string
          format: date-time
          description: Timestamp of the buyer's most recent completed purchase for this seller.
        buyer_status:
          type: string
          description: Coarse segmentation label derived by the platform.
          enum: [new, repeat, inactive]

    AhoyEvent:
      type: object
      description: One event as `POST /ahoy/events` reads it. Any other key is ignored.
      properties:
        name:
          type: string
          description: >
            The event name. Required for a single event sent at the top level; inside a batch it is
            not checked, and an event without one is stored with an empty name.
        properties:
          type: object
          description: Free-form properties, stored as given.
          additionalProperties: true
        time:
          type: string
          format: date-time
          description: >
            When the event happened. Honoured only if it falls within the last minute by the
            server's clock; any other value, or none, is replaced with the time of receipt.

    AhoyEventRequest:
      description: >
        A single event at the top level (it must carry `name`), a batch under `events`, or a
        batch as a bare JSON array. Of a batch, only the first 10 are recorded and the rest are
        dropped without error.
      anyOf:
        - allOf:
            - $ref: '#/components/schemas/AhoyEvent'
            - required: [name]
        - type: array
          items:
            $ref: '#/components/schemas/AhoyEvent'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/AhoyEvent'

    AhoyVisitRequest:
      type: object
      description: >
        What `POST /ahoy/visits` reads from the client. The server derives `ip`, `user_agent`,
        `browser`, `os`, `device_type`, `referring_domain` and `started_at` from the request itself,
        and ignores any value the client sends for them, or for a user or location.
      properties:
        visit_token:
          type: string
          description: The visit's token. The `Ahoy-Visit` header takes precedence.
        visitor_token:
          type: string
          description: The visitor's token. The `Ahoy-Visitor` header takes precedence.
        referrer:
          type: string
          description: Referrer URL. Its host is stored as `referring_domain`.
        landing_page:
          type: string
          description: Landing page URL. Any `utm_*` parameters in its query string fill in the `utm_*` fields not sent directly.
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        utm_campaign:
          type: string
        platform:
          type: string
          description: Platform (for native apps)
        app_version:
          type: string
          description: App version (for native apps)
        os_version:
          type: string
          description: OS version (for native apps)

    Content:
      type: object
      description: >
        Create request body for content. Required fields vary by `content_type`:
        `markdown` requires `content_body`; `html` requires exactly one of `content_body` (inline)
        or `content_uri` (remote); `external_ref`, `pdf`, `image`, and `video` require `content_uri` (`content_body` is not accepted).
      required: [content_type, title, price_cents]
      properties:
        content_type:
          type: string
          enum:
            - markdown
            - html
            - pdf
            - image
            - video
            - external_ref
          description: The type of content being created. `pdf`, `image`, and `video` require `content_uri`; `content_body` is not accepted for these types.
        title:
          type: string
          description: Content title
        content_body:
          type: string
          format: byte
          description: >
            Full article body, base64 encoded. Required when `content_type` is `markdown`.
            For `html` content, provide either `content_body` (inline) or `content_uri` (remote) — not both.
            Must be base64-encoded before sending (e.g. `btoa(htmlText)`).
            Note: HTML special characters (`<`, `>`, `&`) should be unicode-escaped when embedding
            the JSON response in a `<script>` tag.
        content_uri:
          type: string
          description: URI of the resource. Required when `content_type` is `external_ref`, `pdf`, `image`, `video`, or remote `html`.
          example: https://vimeo.com/123456789
        external_identifier:
          type: string
          description: >
            Optional namespaced platform ID, e.g. `vimeo:123456789` or `youtube:dQw4w9WgXcQ`.
            Accepted for `external_ref` and `video` content; silently dropped for other types.
          example: vimeo:123456789
        teaser:
          type: string
          format: byte
          description: (Optional) Article teaser, written in markdown and base64 encoded. Must be base64-encoded before sending (e.g. `btoa(teaserText)`).
        price_cents:
          type: integer
          minimum: 1
          description: Price for the content in cents.
        visibility:
          type: string
          enum: [public, unlisted]
          default: public
        metadata:
          type: object
          description: Flexible metadata for additional context
          additionalProperties: true
          properties:
            author:
              type: string
            publication_date:
              type: string
              format: date-time
            reading_time:
              type: string
    ContentResponse:
      type: object
      description: >
        Response shape for a single content item. The presence of `content_body` vs
        `content_uri` depends on `content_type` and storage mode: `markdown`, `brokered`, and inline `html`
        include `content_body`; `external_ref`, `pdf`, `image`, `video`, and remote `html` include `content_uri`.
      required: [id, content_type, title, price_cents, teaser, visibility]
      properties:
        id:
          type: string
        content_type:
          type: string
          enum:
            - markdown
            - html
            - pdf
            - image
            - video
            - external_ref
            - brokered
          description: The type of content. `pdf`, `image`, and `video` are remote-only types — buyers receive `content_uri` only after purchase, while the store's own content endpoints always return it. `brokered` is system-managed (a work LedeWire sells for the Publication it comes from) and cannot be created directly via this API.
        title:
          type: string
          description: Content title
        content_body:
          type: [string, 'null']
          format: byte
          description: >-
            Full article body, base64 encoded. Present when `content_type` is `markdown` or inline `html`.
            Must be base64-decoded before rendering (e.g. `atob(content.content_body ?? '')`).
            Note: HTML special characters (`<`, `>`, `&`) must be unicode-escaped when embedding the JSON in a `<script>` tag.
        content_uri:
          type: [string, 'null']
          description: URI of the external resource. Present when `content_type` is `external_ref`, `pdf`, `image`, `video`, or remote `html`.
          example: https://vimeo.com/123456789
        external_identifier:
          type: [string, 'null']
          description: Namespaced platform ID, e.g. `vimeo:123456789`. Present on `external_ref` and `video` content.
          example: vimeo:123456789
        resource_url:
          type: [string, 'null']
          description: Canonical URL of this content on its origin site. Used by the x402 verify-origin endpoint to bind a third-party page to a Ledewire content record.
        teaser:
          type: string
          format: byte
          description: Article teaser, base64 encoded. Must be base64-decoded before rendering (e.g. `atob(content.teaser ?? '')`).
        price_cents:
          type: integer
          description: Price for the content in cents.
        visibility:
          type: string
          enum: [public, unlisted, private]
          default: public
        metadata:
          type: object
          description: Flexible metadata for additional context
          additionalProperties: true
          properties:
            author:
              type: string
            # source:
            #   type: string
            publication_date:
              type: string
              format: date-time
            reading_time:
              type: string
            tags:
              type: array
              format: string
            paywall:
              type: object
              description: flexible data for managing paywall location
              properties:
                position:
                  type: integer
                  description: Character position of the paywall
                positioning_type:
                  type: string
                  enum:
                    - character
                    - paragraph
                  description: The mechanism for determining how positioning is calculated
                anchor:
                  type: string
                  description: Hash anchor of nearby text

    PaginationMeta:
      type: object
      description: Pagination metadata returned on all paginated list endpoints.
      required: [total, per_page, current_page, total_pages]
      properties:
        total:
          type: integer
          description: Total number of records matching the query.
          example: 84
        per_page:
          type: integer
          description: Maximum number of records returned per page.
          example: 25
        current_page:
          type: integer
          description: The current page number (1-based).
          example: 2
        total_pages:
          type: integer
          description: Total number of pages.
          example: 4
        next_page:
          type: [integer, 'null']
          description: Next page number, or null if on the last page.
          example: 3
        prev_page:
          type: [integer, 'null']
          description: Previous page number, or null if on the first page.
          example: 1

    PaginatedContentList:
      type: object
      description: Paginated list of content items.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentListItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedSalesList:
      type: object
      description: Paginated list of content sales statistics.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesStatisticsItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedBuyersList:
      type: object
      description: Paginated list of anonymised buyer statistics.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BuyerStatisticsItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedUsersList:
      type: object
      description: Paginated list of store members.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MerchantUser'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ContentListItem:
      type: object
      description: >
        Lightweight content representation returned by list and search endpoints.
        Omits `content_body` to keep list payloads small. Use the detail endpoint
        (`GET /v1/merchant/:store_id/content/:id`) to retrieve the full body.
      required: [id, content_type, title, price_cents, teaser, visibility, created_at, content_uri]
      properties:
        id:
          type: string
        content_type:
          type: string
          enum: [markdown, html, pdf, image, video, external_ref, brokered]
        title:
          type: string
        price_cents:
          type: integer
        teaser:
          type: [string, 'null']
          format: byte
          description: Article teaser, base64 encoded. Null when not set. Must be base64-decoded before rendering (e.g. `atob(item.teaser ?? '')`).
        visibility:
          type: string
          enum: [public, unlisted, private]
        created_at:
          type: string
          format: date-time
        content_uri:
          type: [string, 'null']
          description: External URI for `external_ref` content; optional supplementary link for `markdown` content. Null when not set.
        external_identifier:
          type: [string, 'null']
          description: Namespaced platform ID for `external_ref` and `video` content. Null when not set.
        resource_url:
          type: [string, 'null']
          description: Canonical URL of this content on its origin site. Used by the x402 verify-origin endpoint.

    ContentWithAccessResponse:
      type: object
      description: >
        A Buyer's preview of one work, plus that Buyer's checkout state. Returned by
        `GET /v1/content/{id}/with-access`, which takes a Buyer token or none.


        **A preview, never a delivery.** There is no `content_body` and no `content_uri`, not
        even when `access_info.has_purchased` is `true`: the work is delivered through the
        purchase paths, which charge. Nor does it carry the work's `metadata` or
        `external_identifier`, which belong to the work's store.
      required: [id, content_type, title, teaser, price_cents, visibility, resource_url, access_info]
      additionalProperties: false
      properties:
        id:
          type: string
        content_type:
          type: string
          enum: [markdown, html, pdf, image, video, external_ref, brokered]
        title:
          type: [string, 'null']
          description: >
            The work's title or, for a work stored without one, its Publication and URL. `null`
            only when nothing names the work.
        teaser:
          type: string
          format: byte
          description: Teaser, base64 encoded. Must be base64-decoded before rendering.
        price_cents:
          type: integer
          description: What the work costs the caller, in cents.
        visibility:
          type: string
          enum: [public]
          description: Always `public`. An unlisted or archived work is not for sale, and gives 404.
        resource_url:
          type: [string, 'null']
          description: The work's URL on its origin site, where it has one.
        access_info:
          $ref: '#/components/schemas/ContentAccessInfo'

    PurchaseStatus:
      type: string
      enum: [completed, refunded, pending, reverted, failed]

    PurchaseResponse:
      type: object
      required: [id, content_id, content, buyer_id, buyer, seller_id, seller, amount_cents, license, timestamp, status]
      properties:
        id:
          type: string
        content_id:
          type: string
        content:
          type: object
          required: [id, content_type, title, resource_url, publication, filing]
          properties:
            id:
              type: string
            content_type:
              type: string
            title:
              type: [string, 'null']
              description: >
                The work's stored title. A brokered work is often stored without one, and then
                this is composed from what identifies it instead: `<publication name> — <host/path>`
                (for example `The Atlantic — theatlantic.com/ideas/archive/2026/10/foo`), the
                publication name alone when there is no URL, or the host and path alone when
                there is no publication. Null only when the work has none of the three.
            resource_url:
              type: [string, 'null']
              description: Where the work was published, as first recorded. Null for content with no URL.
            publication:
              oneOf:
                - $ref: '#/components/schemas/PurchasePublication'
                - type: 'null'
              description: The Publication a brokered work was published under. Null for non-brokered content.
            filing:
              oneOf:
                - $ref: '#/components/schemas/ContentSearchFiling'
                - type: 'null'
              description: >-
                For an SEC filing, who filed it and what it is, as search described it. Null for
                every other work, and for a filing bought before its filer was recorded.
        buyer_id:
          type: string
        buyer:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        seller_id:
          type: string
          description: >-
            The Store that sold the work. For a brokered work, the same fixed id on every one
            (`f67c246e-206c-5d62-b113-c526c54fac76`), which stands for LedeWire and is not a Store
            that can be looked up.
        seller:
          type: object
          description: >-
            The Store that sold the work: for a brokered work, LedeWire, which sells it for the
            Publication named in `content.publication`.
          required: [id, name]
          properties:
            id:
              type: string
              description: The same value as `seller_id`.
            name:
              type: string
              description: The Store's name. `LedeWire` for a brokered work.
        amount_cents:
          type: integer
        license:
          oneOf:
            - $ref: '#/components/schemas/PurchaseLicense'
            - type: 'null'
          description: >-
            The licence this purchase was delivered under, as granted on delivery. Null when no
            licence was recorded: every purchase of a Store's work, and brokered purchases made
            before licences were recorded. Null means "not recorded", never "no rights granted".
        timestamp:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        content_body:
          type: string
          description: >
            The delivered work, present **only** on the response to `POST /v1/purchases` and only
            when the deliverable is something we hold. It is the delivery, not a field of the
            purchase record: the same purchase read back from `GET /v1/purchases/{id}` or listed
            from `GET /v1/purchases` does not carry it, and there is no route that serves it
            again.


            That asymmetry is the rule rather than an omission. A Buyer keeps what they were
            given — single use is non-transferable, not read-once — but LedeWire does not hand
            the same bytes over a second time without a second grant, and every read from
            LedeWire is a purchase.
        content_uri:
          type: string
          format: uri
          description: >
            Where the work lives, in place of `content_body`, for a deliverable hosted elsewhere.
            Same rule: present only on the response to the purchase that paid for it.

    MerchantSaleResponse:
      type: object
      required: [id, content_id, content, buyer_ref, seller_id, seller, amount_cents, fees, status, timestamp]
      properties:
        id:
          type: string
        content_id:
          type: string
        content:
          type: object
          required: [id, content_type, title]
          properties:
            id:
              type: string
            content_type:
              type: string
            title:
              type: string
        buyer_ref:
          type: string
          pattern: '^bref_v1_[0-9a-f]{22}$'
          description: |
            Opaque, store-scoped reference to the buyer: the same value `GET /v1/merchant/{store_id}/buyers`
            returns as `buyer_ref`, so a sale can be matched to that ranking. The buyer's global user id
            and name are not disclosed.
          example: bref_v1_3f9a2c1d8e7b6a5f4e3d2c
        seller_id:
          type: string
        seller:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        amount_cents:
          type: integer
        fees:
          type: object
          required: [platform_fee_cents, store_net_cents, author_net_cents]
          description: |
            Platform fee split, snapshotted when the purchase completes. All three are `null` on a
            purchase that has not completed (pending, failed) and on purchases recorded before fee
            snapshots existed.
          properties:
            platform_fee_cents:
              type: [integer, 'null']
            store_net_cents:
              type: [integer, 'null']
            author_net_cents:
              type: [integer, 'null']
              description: 0 for completed content without an author
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        timestamp:
          type: string
          format: date-time

    InviteInfoResponse:
      type: object
      required: [invited_email, store_name, role, expires_at]
      properties:
        invited_email:
          type: [string, 'null']
        store_name:
          type: string
        role:
          type: [string, 'null']
          enum: [owner, null]
        expires_at:
          type: string
          format: date-time

    CheckoutStateResponse:
      type: object
      required: [content_id, content_title, price_cents, checkout_state]
      properties:
        content_id:
          type: string
        content_title:
          type: [string, 'null']
          description: >
            The work's title, composed the same way as `PurchaseResponse.content.title`: the stored
            title, or for a work stored without one `<publication name> — <host/path>`, the
            publication name alone, or the host and path alone. Null only when the work has none
            of the three.
        price_cents:
          type: integer
        checkout_state:
          type: object
          required: [is_authenticated, has_purchased, next_required_action]
          properties:
            is_authenticated:
              type: boolean
            has_sufficient_funds:
              type: [boolean, 'null']
              description: Null for an anonymous caller.
            has_purchased:
              type: boolean
            next_required_action:
              type: string
              enum: [authenticate, fund_wallet, purchase]

    WalletPaymentStatusResponse:
      type: object
      required: [status, updated_at, balance_cents]
      properties:
        status:
          type: string
          enum: [pending, completed, reverted, failed, cancelled, processing, awaiting_verification]
          description: >
            The funding transfer's status. `completed` means the funds are in the wallet.
            `processing` is a payment the provider accepted but has not settled (an ACH debit);
            `awaiting_verification` is an ACH payment waiting on microdeposit verification; neither
            is spendable yet. `cancelled` is usually a session superseded by a newer one (it
            returns to `pending` and then `completed` if the provider charges it anyway).
        updated_at:
          type: string
          format: date-time
        balance_cents:
          type: [integer, 'null']
          description: The wallet balance. null for a Company member, as on GET /v1/wallet/balance.

    SalesSummaryResponse:
      type: object
      required: [total_revenue_cents, total_sales, monthly_revenue_cents, monthly_sales]
      properties:
        total_revenue_cents:
          type: integer
          description: Store net revenue from completed sales, in cents (after the platform fee and any author share)
        total_sales:
          type: integer
          description: Total number of sales
        monthly_revenue_cents:
          type: object
          description: Monthly revenue data grouped by year and month. First level key is year (string), second level key is month number (string, 1-12)
          additionalProperties:
            type: object
            description: Monthly data for a specific year
            additionalProperties:
              type: integer
              description: Revenue data for a specific month
        monthly_sales:
          type: object
          description: Monthly sales count data grouped by year and month. First level key is year (string), second level key is month number (string, 1-12)
          additionalProperties:
            type: object
            description: Monthly data for a specific year
            additionalProperties:
              type: integer
              description: Number of sales for a specific month

    X402BazaarResource:
      type: object
      description: A single x402 v2 resource entry returned by the Bazaar discovery endpoint.
      required: [resource, type, x402Version, accepts, lastUpdated, metadata]
      properties:
        resource:
          type: string
          description: >
            Canonical URL for this content. Equal to `resource_url` when the content has one;
            otherwise constructed as `{base_url}/v1/x402/contents/{id}`.
        type:
          type: string
          enum: [http]
        x402Version:
          type: integer
          enum: [2]
        accepts:
          type: array
          items:
            type: object
            required: [scheme, network]
            properties:
              scheme:
                type: string
                example: ledewire-wallet
              network:
                type: string
                example: "ledewire:v1"
        lastUpdated:
          type: integer
          description: Unix timestamp (seconds) of the content's last update.
        metadata:
          type: object
          required: [title, teaser, store_name, category]
          properties:
            title:
              type: [string, 'null']
              description: The stored title; null for a work stored untitled (e.g. one registered from a pricing rule).
            teaser:
              type: string
              description: Plain UTF-8 preview text. Never base64.
            store_name:
              type: string
            category:
              type: string
              description: >
                `metadata["category"]` when present; otherwise falls back to `content_type`.
                Never null.

    X402BazaarDiscoveryResponse:
      type: object
      description: Response from the x402 Bazaar discovery endpoint.
      required: [total, resources]
      properties:
        total:
          type: integer
          description: Total number of public resources (ignores pagination).
        resources:
          type: array
          items:
            $ref: '#/components/schemas/X402BazaarResource'

    X402ContentResponse:
      type: object
      description: >
        Response body returned by the x402 content endpoint on a successful `200`.
        Delivers the purchased content directly in the settlement response.
        `content_body` is present when `content_type` is `markdown`, `brokered`, or inline `html`;
        `content_uri` is present when `content_type` is `external_ref`, `pdf`, `image`, `video`, or remote `html`.
        `purchase_id` is the UUID of the settled Purchase record (null for free content).
      required: [id, content_type, title, price_cents, teaser, visibility]
      properties:
        id:
          type: string
        content_type:
          type: string
          enum: [markdown, html, pdf, image, video, external_ref, brokered]
        title:
          type: string
        price_cents:
          type: integer
        teaser:
          type: string
          description: Plain UTF-8 text preview.
        visibility:
          type: string
          enum: [public, unlisted, private]
        metadata:
          type: object
          additionalProperties: true
          description: >-
            The work's descriptive metadata, as its Store recorded it. For a brokered work, only
            what describes the work itself: `publication_date`, `last_modified_date`, and the
            academic fields `authors`, `abstract`, `doi` and `cited_by_count` where known, and for an
            SEC filing `filing`: who filed it and what it is, shaped as `ContentSearchFiling`.
        external_identifier:
          type: [string, 'null']
          description: >-
            The Store's own identifier for the work, when it gave one. Always null for a brokered
            work.
        purchase_id:
          type: [string, 'null']
          description: UUID of the settled Purchase record. Null for free content.
        license:
          oneOf:
            - $ref: '#/components/schemas/PurchaseLicense'
            - type: 'null'
          description: >-
            The licence this purchase was delivered under, as on every purchase surface. Null for
            free content, and when no licence was recorded.
        resource_url:
          type: [string, 'null']
          description: Canonical URL of this content on its origin site. Set when content was registered via a pricing rule or manual resource_url assignment.
        content_body:
          type: [string, 'null']
          description: Full article body in plain UTF-8 markdown. Present when content_type is markdown.
        content_uri:
          type: [string, 'null']
          description: URI of the external resource. Present when content_type is `external_ref`, `pdf`, `image`, or `video`.

    VerifyOriginVerified:
      type: object
      description: Returned when the URL matches a registered Ledewire content item.
      required: [verified, content_id, store_id, amount, title]
      properties:
        verified:
          type: boolean
          enum: [true]
        content_id:
          type: string
          description: UUID of the matching Content record.
        store_id:
          type: string
          description: >-
            UUID of the Store that sells this content — the Store `payTo` names. For a brokered
            work, the same fixed id on every one (`f67c246e-206c-5d62-b113-c526c54fac76`), which
            stands for LedeWire and is not a Store that can be looked up.
        amount:
          type: string
          description: Price in cents as a string (e.g. "10" = $0.10).
        title:
          type: string
          description: Content title.

    VerifyOriginUnverified:
      type: object
      description: Returned when the URL is not registered or the URL is invalid.
      required: [verified]
      properties:
        verified:
          type: boolean
          enum: [false]

    JwksResponse:
      type: object
      description: JSON Web Key Set (RFC 7517) containing the RS256 public key for x402 accessToken verification.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty:
                type: string
                enum: [RSA]
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [RS256]
              kid:
                type: string
                description: Key ID. Matches the `kid` header claim in minted access tokens.
              n:
                type: string
                description: RSA modulus (Base64url-encoded).
              e:
                type: string
                description: RSA public exponent (Base64url-encoded).

    AcquisitionWork:
      type: object
      description: >
        One work in a Selection, and what happened to it. Every submitted row appears, including
        the ones we refused — a malformed line and a duplicate spelling are dispositions rather
        than omissions, and a row that vanished silently between upload and quote is the failure
        the acknowledgement step exists to prevent.


        `line_state`, `purchased` and `delivery_state` answer three different questions and
        none implies another. A work can be quoted and never reached, purchased and not
        delivered, or excluded and therefore never attempted.
      required: [position, submitted_url, line_state, purchased, delivery_state]
      properties:
        position:
          type: integer
          description: 1-based place in the submitted file, so a Buyer can find the row they wrote.
        submitted_url:
          type: string
          description: The address exactly as submitted.
        canonical_url:
          type: [string, 'null']
          description: >
            The address after canonicalization — the identity function for a brokered work. Two
            rows that differ only in `www.`, a query string or a fragment name one work, and the
            second is excluded as a duplicate rather than bought twice.
        line_state:
          type: string
          enum: [pending, firm, estimated, excluded]
          description: >
            What the quote said. `firm` was priced from a rate the broker answered with;
            `estimated` from a rate we already held because the broker could not be asked;
            `excluded` will not be bought.
        exclusion_reason:
          type: [string, 'null']
          enum:
            - excluded_malformed
            - excluded_duplicate
            - excluded_no_rate
            - excluded_free_not_supported
            - excluded_not_deliverable
            - excluded_insufficient_rights
            - excluded_above_price_ceiling
            - excluded_rate_unavailable
            - excluded_not_sold_in_bulk
            - null
          description: >
            Present only on an excluded line. `excluded_rate_unavailable` is the one transient reason.
            `excluded_free_not_supported` is retired — a work published at zero is now included at no
            cost — and appears only on lines quoted before that; a re-quote prices them back in.
            `excluded_not_sold_in_bulk` is an SEC filing, which is sold one at a time and never in a
            Bulk acquisition.
        price_micros:
          type: [integer, 'null']
          description: >
            What this work was quoted at, in micros. **Never published in cents.** Per-work cents
            are display-only and non-summable for a Bulk acquisition — the authoritative figure is
            micros and the acquisition total is what reconciles, so a client is given nothing here
            that invites adding up to the charge.
        purchased:
          type: boolean
          description: >
            Whether a Purchase was made for this work.


            **History, not access.** Under single use a completed Purchase is a receipt for a
            delivery that has already happened; it grants nothing further, and is never a reason
            to serve a body again. Reported so a Buyer can tell "we bought this and the bytes did
            not arrive" — a delivery we owe — from "we never bought it".
        delivery_state:
          type: string
          enum: [pending, delivered, undelivered]
          description: >
            What the run did. `pending` means not yet attempted — which is also what an excluded
            work reads, because it was never attempted and `undelivered` would claim we tried and
            failed. Those are different answers to a Buyer and only the second is worth a retry.
        failure_reason:
          type: [string, 'null']
          enum: [retrieval_failed, not_licensable, not_found, price_drifted, client_error, insufficient_funds, cap_refused, null]
          description: >
            Why an attempted work did not arrive, as a type rather than prose. Only
            `retrieval_failed` is transient; the rest fail identically on every attempt, so
            retrying one spends a run's budget on works that need re-pricing, a fix, or money.
        attempts:
          type: [integer, 'null']
          description: How many times retrieval was tried, the successful attempt included.

    Publication:
      type: object
      description: >
        A Publication a Buyer can license from — the title a Bulk acquisition is organised around.
        Listed from our own registry, which is reconciled daily against the Broker's directory,
        rather than from a live call.


        Licensability is a rights answer, not a quality one. A publication that publishes no
        `FULL_USE` rate is still listed, with `bulk_licensable: false`: its works can be bought
        one at a time but are excluded from a corpus as `excluded_insufficient_rights`.
      required: [id, name, domains, bulk_licensable, coverage_horizon, topics, homepage]
      properties:
        homepage:
          type: [object, 'null']
          description: >-
            How the publication's own homepage describes itself, as read from its metadata when we
            last fetched it. This is the publisher's self-description, unverified: we do not check
            or endorse it. Null where the homepage has not been fetched, or could not be. Within
            the object, a field the page does not give is null.
          required: [title, description, site_name, language]
          additionalProperties: false
          properties:
            title:
              type: [string, 'null']
              description: The page's `<title>`, or its `og:title` where it has no title.
              example: Fast Company | Business News, Innovation, Technology
            description:
              type: [string, 'null']
              description: The page's meta description, or its `og:description` where it has none.
            site_name:
              type: [string, 'null']
              description: The page's `og:site_name`.
              example: Fast Company
            language:
              type: [string, 'null']
              description: The language the page declares (`<html lang>`), as written, such as `en` or `en-US`.
              example: en
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The Broker's display name for the publication.
        topics:
          type: array
          description: >
            The Topics this publication covers, at most five. Empty where it has not been
            classified yet, which never removes it from the listing.
          maxItems: 5
          items:
            $ref: '#/components/schemas/TopicSlug'
          example: [business-and-finance, personal-finance]
        domains:
          type: array
          description: >
            The domains the publication is listed under, spelled as the Broker spells them —
            including a `www.` prefix where it has one.
          items:
            type: string
        bulk_licensable:
          type: boolean
          description: >
            Whether works from this publication can come back in a Bulk acquisition's corpus —
            true when it publishes a `FULL_USE` rate.
        coverage_horizon:
          type: [object, 'null']
          description: >-
            The oldest date we have swept this publication back to, when that was true as of, and
            where we looked. Coverage is stated this way and never as a
            percentage. Null means "no horizon established yet" — it is not a horizon of zero, and
            is never sent as an object of nulls.
          required: [horizon_at, as_of, sources]
          properties:
            horizon_at:
              type: string
              format: date-time
              description: The oldest date swept back to.
              example: '2019-03-01T00:00:00Z'
            as_of:
              type: string
              format: date-time
              description: >-
                When the sweep behind the horizon began. The Broker adds works behind a horizon
                after the fact, so the horizon holds only of the catalog as it stood at this time.
              example: '2026-09-27T04:30:00Z'
            sources:
              type: array
              description: Where the sweep looked — today always the Broker's catalog.
              items:
                type: string
              example: [catalog]

    PublicationListResponse:
      type: object
      description: Every Publication the Broker reports as ready to license, paginated.
      required: [data, pagination, unclassified_count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        unclassified_count:
          $ref: '#/components/schemas/PublicationUnclassifiedCount'

    PublicationUnclassifiedCount:
      type: integer
      minimum: 0
      description: >
        How many listed Publications have no Topics yet, counted over the whole listing and not
        narrowed by any filter. A Topic filter cannot return these, so a filtered result may be
        missing Publications that cover the Topic but are not classified.

    TopicSlug:
      type: string
      description: >
        A Topic: a subject from the IAB Content Taxonomy 3.1 tier 1 that a Publication covers.
        The slug is the stable API value for one IAB tier-1 entry. Two tier-1 entries are not
        Topics, Genres and Sensitive Topics, since neither is a subject area. There is no
        general-news Topic: a broad news Publication carries its main sections instead.
      enum:
          - attractions
          - automotive
          - books-and-literature
          - business-and-finance
          - careers
          - communication
          - crime
          - disasters
          - education
          - entertainment
          - events
          - family-and-relationships
          - fine-art
          - food-and-drink
          - healthy-living
          - hobbies-and-interests
          - holidays
          - home-and-garden
          - law
          - medical-health
          - personal-celebrations-and-life-events
          - personal-finance
          - pets
          - politics
          - pop-culture
          - real-estate
          - religion-and-spirituality
          - science
          - shopping
          - sports
          - style-and-fashion
          - technology-and-computing
          - travel
          - video-gaming
          - war-and-conflicts

    TopicDirectoryEntry:
      type: object
      description: >
        One Topic in the Topic directory, with how many listed Publications carry it.
      required: [slug, iab_id, name, publication_count]
      properties:
        slug:
          $ref: '#/components/schemas/TopicSlug'
        iab_id:
          type: string
          description: >
            The IAB Content Taxonomy unique ID of this tier-1 entry. A string, since some IAB IDs
            are alphanumeric.
          example: '483'
        name:
          type: string
          description: The IAB display name, verbatim.
          example: Sports
        publication_count:
          type: integer
          minimum: 0
          description: >
            How many listed Publications carry this Topic: exactly the `pagination.total` of
            `GET /v1/publications` filtered by it alone. Zero is listed, not omitted.

    TopicDirectoryResponse:
      type: object
      description: >
        Every Topic, in vocabulary order, with how many listed Publications carry each.
      required: [data, iab_version, unclassified_count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TopicDirectoryEntry'
        iab_version:
          $ref: '#/components/schemas/TopicIabVersion'
        unclassified_count:
          $ref: '#/components/schemas/PublicationUnclassifiedCount'

    TopicIabVersion:
      type: string
      description: The IAB Content Taxonomy version the Topics are taken from.
      example: '3.1'

    McpListTopicsResult:
      type: object
      description: >
        The MCP `list_topics` result: the Topic directory, as `GET /v1/topics` returns it, with
        the entries under `topics`.
      required: [topics, iab_version, unclassified_count]
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicDirectoryEntry'
        iab_version:
          $ref: '#/components/schemas/TopicIabVersion'
        unclassified_count:
          $ref: '#/components/schemas/PublicationUnclassifiedCount'

    McpListPublicationsResult:
      type: object
      description: >
        The MCP `list_publications` result: one page of the Publications a Buyer can license from,
        paged by offset and limit.
      required: [publications, total_count, unclassified_count, offset, limit]
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        total_count:
          type: integer
          description: How many publications match, after any `topics` filter.
        unclassified_count:
          $ref: '#/components/schemas/PublicationUnclassifiedCount'
        offset:
          type: integer
        limit:
          type: integer

    PublicationWork:
      type: object
      description: >
        A work a Publication has available to license, as the Broker's catalog lists it. `url` is
        exactly what a Selection takes.
      required: [url, last_mod]
      properties:
        url:
          type: string
          format: uri
        last_mod:
          type: [string, 'null']
          format: date-time
          description: >
            When the Broker says the work was last modified. Null where it supplies none, which on
            some publications is every work.

    PublicationWorkListResponse:
      type: object
      description: >
        One page of a Publication's works, read live from the Broker's catalog. Unpriced:
        pricing happens when a Selection of these URLs is quoted.
      required: [publication_id, domain, date_filter, works, next_cursor]
      properties:
        publication_id:
          type: string
          format: uuid
        domain:
          type: [string, 'null']
          description: >
            The Publication domain this page was read from, in the Broker's spelling. A publication
            with several domains is walked one domain after another. Null only when the publication
            has no live domain to read.
        date_filter:
          type: string
          enum: [not_requested, applied, unsupported]
          description: >
            How `from`/`to` applied to this page's domain. `applied` means the Broker filtered and
            every work is in range. `unsupported` means the filtered query returned nothing while
            the same domain unfiltered does not: the domain's catalog carries no modification
            dates, so the range cannot be answered. That is not the same as having no works in the
            range. The unfiltered works are deliberately not returned in their place, because they
            are not known to fall inside the range.
        works:
          type: array
          items:
            $ref: '#/components/schemas/PublicationWork'
        next_cursor:
          type: [string, 'null']
          description: >
            Opaque. Pass it back as `cursor` with the same `from`/`to` for the next page. Null means
            the walk is over; an empty page with a cursor is not the end.

    McpListPublicationWorksResult:
      description: >
        The MCP `list_publication_works` result. It is the same page as
        `GET /v1/publications/{id}/works` returns, by reference, so the two cannot drift.
      allOf:
        - $ref: '#/components/schemas/PublicationWorkListResponse'

    PaginatedAcquisitionWorkList:
      type: object
      description: >
        Per-work dispositions for a Bulk acquisition, paginated. Its own endpoint rather than a
        field on the acquisition because a Selection may name 10,000 works and the acquisition
        resource has to stay cheap enough to poll for hours.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AcquisitionWork'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    AcquisitionResponse:
      type: object
      description: >
        A Bulk acquisition — the one resource the whole flow hangs off. The Buyer holds this id
        from the moment they submit a Selection, and every later step reads or advances it: the
        quote arrives on it, the acknowledgement is a timestamp on it, the hold is sized from its
        total, and the run writes its outcome back to it.


        `status` and `quote_state` are two independent state machines and are not collapsible.
        `status` is the money — `quoted` holds nothing, `authorized` and `acquiring` hold funds,
        and every terminal state releases what is left. `quote_state` is whether the prices are
        in. A `quoted` acquisition whose quote is still `pending` has a snapshot and no prices,
        and a client that read one field would mis-read exactly that case.
      required: [id, status, quote_state, publication_count, submitted_work_count, work_count, quote, exclusions, delivery, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [quoted, authorized, acquiring, settled, cancelled, failed]
          description: >
            Where the money is. `quoted` reserves nothing; `authorized` and `acquiring` hold the
            stated maximum chargeable total; `settled`, `cancelled` and `failed` are terminal and
            have released whatever was not captured.
        quote_state:
          type: string
          enum: [pending, ready, failed]
          description: >
            Whether the Selection has been priced. Pricing is asynchronous — resolving rates for
            10,000 works is ~200 upstream batch calls under undocumented limits — so a submitted
            Selection comes back `pending` and the client polls this. Stop polling once `status`
            leaves `quoted`: a quote cancelled while still being priced stays `pending`.
        publication_count:
          type: integer
          description: >
            How many distinct publications the Selection spans. Nothing in a Bulk acquisition is
            keyed on a single publication.
        submitted_work_count:
          type: integer
          description: >
            How many rows the upload named and we accepted. Published alongside `work_count`
            because until pricing finishes the two differ and only this one is known: nothing
            carries a price while `quote_state` is `pending`, so a freshly submitted 10,000-row
            Selection reports `work_count: 0` and would otherwise read exactly like an empty one.
        work_count:
          type: integer
          description: >
            Works that carry a price — firm or estimated. Excluded rows are not counted here, and
            neither is anything still waiting to be priced.
        quote:
          $ref: '#/components/schemas/AcquisitionQuote'
        exclusions:
          type: array
          description: >
            What we cannot sell, grouped by reason and counted. Grouped rather than enumerated
            because a 10,000-work Selection can exclude thousands of rows and the acknowledgement
            step asks the Buyer to register what kinds of thing are not coming; the per-work
            detail is `GET /v1/acquisitions/{id}/works`, which paginates.
          items:
            type: object
            required: [reason, count]
            properties:
              reason:
                type: string
                enum:
                  - excluded_malformed
                  - excluded_duplicate
                  - excluded_no_rate
                  - excluded_free_not_supported
                  - excluded_not_deliverable
                  - excluded_insufficient_rights
                  - excluded_above_price_ceiling
                  - excluded_rate_unavailable
                  - excluded_not_sold_in_bulk
                description: >
                  Seven of these are the Buyer's to act on and one is ours. `excluded_rate_unavailable`
                  is the only transient one — it says we could not reach the broker to ask, and is
                  the only reason here worth asking us to retry. `excluded_not_deliverable` is a
                  broker failure we observed; `excluded_insufficient_rights` is a rights decision
                  we made; `excluded_above_price_ceiling` is a price we declined. Those three are
                  the ones most easily collapsed and must not be.
              count:
                type: integer
        delivery:
          type: object
          description: >
            What the run has done. `purchased` and `delivered` are separate facts and both are
            reported, because a Purchase can complete and its body fail to arrive — a delivery
            LedeWire owes, and not a reason to charge again. An acquisition with 10,000 purchases
            and 9,700 deliveries has 300 outstanding, which no single number says.
          required: [purchased, delivered, undelivered, outstanding]
          properties:
            purchased:
              type: integer
              description: Works a Purchase was made for. History, not an entitlement to re-read.
            delivered:
              type: integer
            undelivered:
              type: integer
              description: >
                Attempted and not delivered. An excluded work is not counted here — it was never
                attempted, and "not in your corpus because we refused to quote it" is a different
                answer from "not in your corpus because retrieval failed".
            outstanding:
              type: integer
              description: Quoted and not yet reached. What a resumed run will attempt.
        poll_after_seconds:
          type: integer
          minimum: 2
          description: >
            Seconds to wait before polling again, also sent as `Retry-After`. Present only while
            there is something to wait for — `quote_state` is `pending` on a `quoted`
            acquisition, or `status` is `authorized` or `acquiring` — and absent otherwise, so a
            client can poll for as long as the field is there. Grows with the size of the
            Selection, from 2 seconds to at most 60.
        created_at:
          type: string
          format: date-time

    AcquisitionQuote:
      type: object
      description: >
        The priced Selection, and the promise made about it.
      required: [state, firm_micros, estimated_micros, maximum_chargeable_total_cents]
      properties:
        state:
          type: string
          enum: [pending, ready, failed]
        firm_micros:
          type: integer
          description: >
            Subtotal of works priced from a rate the broker answered with, in micros (millionths
            of a dollar).
        estimated_micros:
          type: integer
          description: >
            Subtotal of works priced from a rate we already held, because the broker could not be
            asked. Estimated, never firm — the price may have moved, and observed broker prices
            move materially in both directions. What protects the Buyer is
            `maximum_chargeable_total_cents`.
        maximum_chargeable_total_cents:
          type: integer
          description: >
            The most this acquisition can charge. Settlement clamps captures to it and absorbs any
            drift above it from margin, so it is a ceiling rather than an estimate — an
            acquisition that cannot deliver every work charges less.


            Subtotals are published in micros and the ceiling in cents deliberately: rounding
            happens **once**, on the total. Two rounded cent subtotals would not reliably sum to
            the rounded total, and publishing them that way would invite a client to add them up
            and disagree with the figure we charge. Per-work prices never sum to this either.
        quoted_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >
            When the stated maximum chargeable total stops standing — 24 hours after pricing.
            Published rather than left to the client to compute, so the window is not hard-coded
            against a constant of ours. Re-pricing is cheap: it re-prices the snapshot without
            re-resolving it, so the Buyer gets the same works at today's prices without uploading
            anything again.
        exclusions_acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: >
            When the Buyer registered what we cannot sell them. Withdrawn on every re-quote, so it
            always refers to the current set of exclusions and never to a previous one — an
            acknowledgement carried forward would be a Buyer authorizing a list they never saw.

    CorpusResponse:
      type: object
      description: >
        Where a Bulk acquisition's Corpus is — a **state**, never an error.


        A corpus is a rendering of Purchases the Buyer already holds, not an entitlement of its
        own, which is what makes everything about it cheap: it can be discarded and rebuilt, and
        rebuilding grants nothing that was not already granted. So a blob past its 30-day
        retention answers `rebuild_required` at 200 rather than 404 or 410 — those would tell the
        Buyer something was lost, and nothing was.


        `rebuild_required` covers "never assembled" as well as "expired", on purpose: from the
        Buyer's side they are one situation — there is no file, ask for one — and splitting them
        would put our bookkeeping into their contract.


        Asking cannot change two states. `not_ready`: the acquisition is still quoted or running,
        and nothing can be built until it finishes, so poll the acquisition, not this.
        `nothing_purchased` (below) is final.


        **Assembly starts by itself when the acquisition settles** with at least one work
        delivered, so a client polls the acquisition until `settled` and then polls this until
        `ready` — there is nothing to ask for in between. `POST` is for a corpus that has expired
        or failed.


        `nothing_purchased` is final: the acquisition finished without buying a single work, so
        there is no corpus to build and no manifest is signed. That includes a quote withdrawn
        before any funds were held. A work is bought exactly when it is delivered, so this is
        also every finished acquisition that delivered nothing.
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, assembling, ready, rebuild_required, failed, not_ready, nothing_purchased]
          description: >
            `not_ready` means the acquisition is still quoted or running, so there is nothing to
            build yet and a `POST` starts nothing. `nothing_purchased` means it finished without
            buying any work, so there never will be. `ready` is downloadable now. `assembling`
            means a run is in flight and `pending` that
            one is queued — poll either. `rebuild_required` means ask for it again, with
            `POST /v1/acquisitions/{id}/corpus`, and is also what a run abandoned mid-assembly
            (a worker that died) reads as once it has gone two hours without progress. `failed`
            carries a reason; a POST retries one that failed transiently, and leaves one that
            failed because our records disagree with the signed manifest as it is.
        format:
          type: [string, 'null']
          enum: [tar_gz, jsonl_gz, null]
          description: >
            The archive rendering. There is no size-conditional switching — a client never
            branches on how big its corpus is.
        byte_size:
          type: [integer, 'null']
          description: Size of the assembled archive. Null unless `ready`.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >
            When the blob is retired, 30 days after assembly. The signed Manifest has no expiry
            and is served separately from `/v1/acquisitions/{id}/manifest`, because an auditor
            years later must be able to obtain the record without the corpus.
        failure_reason:
          type: [string, 'null']
          description: Why assembly broke. Present only when `state` is `failed`.
        poll_after_seconds:
          type: integer
          minimum: 2
          description: >
            Seconds to wait before polling again, also sent as `Retry-After`. Present only while
            `state` is `pending` or `assembling`; `ready`, `failed` and `rebuild_required` carry
            neither, since nothing changes until the Buyer acts, and nor do `nothing_purchased`,
            which is final, or `not_ready`, which waits on the acquisition. Grows with the number of works
            the corpus renders, from 2 seconds to at most 60.
        download_url:
          type: [string, 'null']
          description: >
            Where to fetch the archive, relative to this API, and null in every state but `ready`.


            An authenticated route of ours rather than a presigned store URL. Fetch it with the
            same bearer token as this request and the response is the archive itself — there is
            no redirect to follow and no second URL to capture. A link to the object store
            handed out here would stand whether or not its reader could authenticate, and a
            client may log, cache or forward a poll response. The corpus is the most sensitive
            thing this API serves, so the authorization decision belongs on every request for it.

    CorpusManifestResponse:
      type: object
      description: >
        The signed Manifest of a Bulk acquisition — the audit record itself, not a summary of one.
        There is no separate receipt: two representations of the same facts eventually disagree,
        and a manifest that disagrees with the signed record is worse than no manifest.


        Served verbatim from the bytes stored at first assembly. It is **not** re-derived from the
        rows it was generated from, because the signature covers bytes rather than meaning — a
        re-derived document would read the same, hash differently, and fail its own signature. A
        row edited in 2029 therefore cannot change a document written in 2026.


        Permanent. The corpus blob expires 30 days after assembly; this does not, because an
        auditor years later must be able to obtain the record without the corpus.
      required: [manifest, signature, digest, signing_kid, key_history_head_digest, signed_at]
      properties:
        manifest:
          type: object
          description: >
            The manifest document. Every work in the Selection appears with a disposition —
            `delivered`, `undelivered`, or the name of its exclusion reason — because silent
            omission is a defect. A delivered entry additionally carries a content hash computed
            at capture, the licence asked for and the licence granted with its permission set, the
            captured licence document's path and hash, and what the Buyer was charged in micros.
            Cost columns are never in here.
          additionalProperties: true
        signature:
          type: string
          description: >
            A detached JWS (RFC 7515 with RFC 7797 `b64:false`) over the manifest's exact canonical
            bytes — a protected header, two dots and a signature. Detached so the manifest stays a
            plain readable file that a compliance tool can ingest without a crypto library.
        digest:
          type: string
          description: SHA-256 of the canonical manifest bytes, hex-encoded.
        signing_kid:
          type: string
          description: >
            Which key history entry to resolve. An index, never a credential — it is a 96-bit
            truncation, so a verifier matches on all 32 raw public-key bytes.
        key_history_head_digest:
          type: string
          description: >
            The head of the key history at signing time. A verifier checks that this digest appears
            somewhere in the chain being served — not that it equals the present head, since the
            history grows. What it catches is truncation or a fork since this manifest was issued,
            which needs no key at all, only control of the document.
        signed_at:
          type: string
          format: date-time
          description: >
            When the manifest was signed. Our own assertion until #989's RFC 3161 token lands, and
            the compromise rule is only as trustworthy as this field.
        key_history_url:
          type: string
          description: Where a verifier resolves `signing_kid`.
    SigningKeyHistoryResponse:
      type: object
      description: >
        The append-only, hash-chained log of every Ed25519 key that has signed an audit-export
        manifest. This is the trust anchor a verifier resolves a manifest's `kid` through.

        It is a log of *events*, not a table of keys: there is no `valid_until` or
        `retired_reason` field. A key's window closes at the `valid_from` of the next `activate`
        entry, and it is compromised if a `revoke` entry names it. Those are derived by the
        reader, because an entry that could be edited after a later one chained to it would
        break the chain. See docs/audit-export-key-history.md.
      required: [schema_version, entries]
      properties:
        schema_version:
          type: integer
          description: Bumped when the document's shape changes in a way a reader must notice.
        entries:
          type: array
          description: Every entry, in chain order, starting at sequence 0.
          items:
            type: object
            required: [kind, kid, sequence]
            properties:
              kind:
                type: string
                enum: [activate, revoke]
                description: >
                  `activate` brings a key into service and carries `public_key` and `valid_from`.
                  `revoke` records that the key named by `kid` was stolen and carries
                  `compromised_at`.
              kid:
                type: string
                description: >
                  base64url(SHA-256(raw public key))[0, 16]. An index into this document, never a
                  credential — it is a 96-bit truncation, so a verifier matches on all 32 raw
                  public-key bytes instead.
              sequence:
                type: integer
                description: Monotonic and gapless, starting at 0.
              public_key:
                type: string
                description: >
                  The raw 32-byte Ed25519 public key, base64url-encoded without padding.
                  Present on `activate` entries only.
              valid_from:
                type: string
                format: date-time
                description: When this key entered service. Present on `activate` entries only.
              compromised_at:
                type: string
                format: date-time
                description: >
                  When the key named by `kid` is believed to have been stolen — ordinarily
                  earlier than when it was discovered. Signatures dated before it stand; those at
                  or after it are void. Present on `revoke` entries only.
              previous_entry_digest:
                type: string
                description: >
                  SHA-256 (hex) of the previous entry's RFC 8785 canonical JSON, including its
                  signature. Absent on the root entry alone.
              signature:
                type: string
                description: >
                  base64url Ed25519 signature over this entry's canonical JSON excluding this
                  field, made by the key in service before it — which, for a `revoke`, is not the
                  key it names. Absent on the root entry alone.

    SettlementResponse:
      type: object
      description: >
        x402 v2 settlement result. Base64-encoded JSON returned in the `PAYMENT-RESPONSE` header
        on a successful `200`. `accessToken` is present when an RS256 signing key is configured;
        omitted in environments without credentials.
      required: [success, transaction, network, payer]
      properties:
        success:
          type: boolean
          enum: [true]
        transaction:
          type: string
          description: UUID of the settled Purchase record.
        network:
          type: string
          enum: ["ledewire:v1"]
        payer:
          type: string
          description: UUID of the buying user.
        accessToken:
          type: string
          description: >
            RS256-signed JWT for offline entitlement verification (default 24h TTL), verifiable
            via `/.well-known/x402-jwks.json`. Omitted, never null, if no signing key is configured.

    MerchantPricingRule:
      type: object
      required: [id, store_id, url_pattern, price_cents, active, created_at, updated_at]
      properties:
        id:
          type: string
          description: UUID of the pricing rule.
        store_id:
          type: string
          description: UUID of the owning store.
        url_pattern:
          type: string
          description: Glob URL pattern (supports * and ** wildcards). Must start with http:// or https://.
        price_cents:
          type: integer
          description: Price in cents applied to content matching this pattern.
        active:
          type: boolean
          description: Whether the rule is currently active. Inactive rules are ignored during URL matching.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MerchantDomainVerification:
      type: object
      required: [id, store_id, domain, status, txt_record_name, txt_record_value, created_at]
      properties:
        id:
          type: string
          description: UUID of the domain verification record.
        store_id:
          type: string
          description: UUID of the owning store.
        domain:
          type: string
          description: The verified domain (www. prefix is stripped on creation).
        status:
          type: string
          enum: [pending, verified, failed]
          description: Verification status updated by DomainVerifyJob.
        txt_record_name:
          type: string
          description: DNS TXT record name the merchant must add (e.g. _ledewire-verify.example.com).
        txt_record_value:
          type: string
          description: DNS TXT record value the merchant must set.
        verified_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp of successful verification. Null until verified.
        checked_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the most recent verification check (success or failure).
        created_at:
          type: string
          format: date-time

    OauthAuthorizationServerMetadata:
      type: object
      description: >
        RFC 8414 Authorization Server Metadata. MCP clients fetch this to discover the
        authorization flow. `registration_endpoint` is what tells a client that Dynamic
        Client Registration is available at all — without it, clients that do not speak
        CIMD fall back to asking a human for a client id.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - registration_endpoint
        - scopes_supported
        - response_types_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        revocation_endpoint:
          type: string
        registration_endpoint:
          type: string
          description: RFC 7591 Dynamic Client Registration endpoint.
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        authorization_response_iss_parameter_supported:
          type: boolean
          description: >
            RFC 9207. Always `true`: the authorization redirect carries `iss`, equal to
            `issuer`, alongside `code` and `state`.

    OauthClientRegistrationRequest:
      type: object
      description: >
        RFC 7591 client metadata. Only `redirect_uris` is required; unrecognised members
        are ignored rather than rejected, so clients sending extensions this server does
        not implement still register successfully.
      required: [redirect_uris]
      properties:
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 2000
          description: >
            Must be https, or http on a loopback host (`localhost`, `127.0.0.1`, `[::1]`).
            Fragments are not permitted. These become the allowlist for the issued client_id.
            More than 10 is refused as `invalid_client_metadata`, not `invalid_redirect_uri`.
        client_name:
          type: string
          maxLength: 255
        client_uri:
          type: string
          maxLength: 500
        logo_uri:
          type: string
          maxLength: 500
        tos_uri:
          type: string
          maxLength: 500
        policy_uri:
          type: string
          maxLength: 500
        contacts:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
        software_id:
          type: string
          maxLength: 500
        software_version:
          type: string
          maxLength: 500
        scope:
          type: string
          description: >
            Space-delimited. Scopes this server does not support are filtered out, and the
            response omits `scope` entirely when none was requested — registration decides
            nothing about what a token later grants.
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          items:
            type: string
            enum: [code]
        token_endpoint_auth_method:
          type: string
          enum: [none]
          description: >
            Optional, and may only be `none`. Registered clients are public — no
            client_secret is issued, and PKCE protects the code exchange.

    OauthClientRegistrationResponse:
      type: object
      description: >
        RFC 7591 §3.2.1 client information response. Carries no `client_secret`: a
        registered client is public and authenticates at the token endpoint with PKCE alone.
      required: [client_id, client_id_issued_at, redirect_uris, token_endpoint_auth_method]
      properties:
        client_id:
          type: string
          description: >
            Server-assigned, opaque, `lwc_`-prefixed. Deliberately not a URL, so it is never
            mistaken for a Client ID Metadata Document.
        client_id_issued_at:
          type: integer
          description: Seconds since the Unix epoch.
        redirect_uris:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          enum: [none]
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        contacts:
          type: array
          items:
            type: string
        software_id:
          type: string
        software_version:
          type: string

    OauthClientRegistrationErrorResponse:
      type: object
      description: RFC 7591 §3.2.2 client registration error response.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_redirect_uri, invalid_client_metadata]
        error_description:
          type: string

    MerchantInvitationAcceptedResponse:
      type: object
      description: The store membership an accepted invitation created.
      required: [id, store_id, store_name, role, accepted_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The membership (store user) id.
        store_id:
          type: string
          format: uuid
        store_name:
          type: [string, 'null']
        role:
          type: [string, 'null']
          enum: [owner, author, null]
          description: >
            `owner` if the invitation makes the user an owner (owners are authors too); `author`
            if it grants authorship only; null for a membership that is neither.
        accepted_at:
          type: string
          format: date-time

    OauthProtectedResourceMetadata:
      type: object
      description: RFC 9728 Protected Resource Metadata.
      required: [resource, authorization_servers, bearer_methods_supported]
      additionalProperties: false
      properties:
        resource:
          type: string
          description: The MCP endpoint, `<base URL>/v1/mcp`.
          example: 'https://api.ledewire.com/v1/mcp'
        authorization_servers:
          type: array
          minItems: 1
          items:
            type: string
          example: ['https://api.ledewire.com']
        scopes_supported:
          type: array
          description: The scopes the MCP endpoint accepts.
          items:
            type: string
          example: ['mcp:search', 'mcp:purchase', 'mcp:manage_content', 'mcp:analytics']
        bearer_methods_supported:
          type: array
          items:
            type: string
            enum: [header]

    OauthTokenRequest:
      type: object
      description: >
        RFC 6749 token request. Which fields are needed depends on `grant_type`: `code`,
        `code_verifier` and `redirect_uri` for `authorization_code`; `refresh_token` for
        `refresh_token`.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          description: The authorization code from the consent redirect. Single use, valid 10 minutes.
        code_verifier:
          type: string
          description: The PKCE verifier whose S256 challenge was sent to `/oauth/authorize`.
        redirect_uri:
          type: string
          description: Must equal the `redirect_uri` the authorization used.
        client_id:
          type: string
          description: Optional; recorded, not checked.
        refresh_token:
          type: string
          description: '`<key>:<secret>`, from a previous token response.'

    OauthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, scope]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: '`<key>:<secret>` — an MCP API key. Send as `Authorization: Bearer <access_token>`.'
        refresh_token:
          type: string
          description: '`<key>:<secret>`. Works once; each refresh returns a new one.'
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires (3600).
          example: 3600
        scope:
          type: string
          description: Space-delimited scopes actually granted.
          example: 'mcp:search mcp:purchase'

    OauthTokenErrorResponse:
      type: object
      description: RFC 6749 §5.2 token error response.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [invalid_grant, unsupported_grant_type]
        error_description:
          type: string
          enum: ['PKCE verification failed', 'redirect_uri mismatch']

    OauthRevokeRequest:
      type: object
      description: RFC 7009 revocation request.
      properties:
        token:
          type: string
          description: An access token or refresh token, `<key>:<secret>`.
        token_type_hint:
          type: string
          description: Accepted and ignored.

    OauthAuthorizeErrorResponse:
      type: object
      description: A refused authorization, in a flat shape rather than the `ErrorResponse` envelope.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string

    OauthTooManyRequestsResponse:
      type: object
      description: A throttled OAuth endpoint, in RFC 6749's flat error shape.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [too_many_requests]

security:
  - BearerAuth: []

paths:
  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server Metadata
      description: >
        RFC 8414 discovery document. MCP clients fetch this after the `WWW-Authenticate`
        challenge to learn where to authorize, exchange codes, and register.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthAuthorizationServerMetadata'

  /.well-known/oauth-protected-resource/v1/mcp:
    get:
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      description: >
        Names the MCP endpoint as the protected resource and this server as its authorization
        server. This is the RFC 9728 path-suffixed URL the `/v1/mcp` 401 challenge names in
        `resource_metadata`. There is no root `/.well-known/oauth-protected-resource`: §3.3 makes a
        client discard a document whose `resource` differs from the URL it was fetched for.
      tags:
        - OAuth
      security: []
      responses:
        '200':
          description: Protected resource metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthProtectedResourceMetadata'

  /oauth/register:
    post:
      summary: Register an OAuth client (RFC 7591)
      description: >
        Dynamic Client Registration. A client POSTs its metadata and receives an opaque
        `client_id` it can immediately use to start the authorization code + PKCE flow.


        **No authentication is required.** RFC 7591 initial access tokens are not used,
        because the clients this serves (VS Code and similar) have no way to obtain one.
        What constrains the endpoint instead: registered clients are always public (no
        `client_secret` is ever issued), redirect URIs are limited to https or loopback,
        and the endpoint is rate limited to 5 registrations per minute per IP.


        Nothing about registration affects what a token later grants — scopes, tiers, and
        store binding are decided at consent, unchanged.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthClientRegistrationRequest'
            examples:
              vscode:
                summary: A client registering an https and a loopback redirect URI
                value:
                  client_name: Visual Studio Code
                  redirect_uris:
                    - 'https://vscode.dev/redirect'
                    - 'http://127.0.0.1:33418/callback'
      responses:
        '201':
          description: Client registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthClientRegistrationResponse'
        '400':
          description: >
            `invalid_redirect_uri` when a redirect URI is missing, malformed, longer than 2000
            characters, carries a fragment, or is http on a non-loopback host.
            `invalid_client_metadata` for any other unusable metadata, including more than 10
            `redirect_uris`, a `token_endpoint_auth_method` other than `none`, a `client_name`
            over 255 characters, or a descriptive field over its bounds (500 characters per
            string, 10 entries per array).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthClientRegistrationErrorResponse'
        '429':
          description: Rate limit exceeded (5 registrations per minute per IP).
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTooManyRequestsResponse'

  /oauth/authorize:
    get:
      summary: OAuth authorization (consent page)
      description: >
        A browser flow, not an API call: a person's browser is sent here by the MCP client and
        answered with an HTML consent page.


        `redirect_uri` is checked by who the client is. A registered client (an `lwc_` id from
        `POST /oauth/register`) must have registered it. A `client_id` that is an https URL is
        treated as a Client ID Metadata Document: the document is fetched (3-second timeout,
        private and loopback hosts refused) and must list the URI in its `redirect_uris`. Any
        other client, including none, may only redirect to `localhost` or `127.0.0.1`.
      tags:
        - OAuth
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: Where the code is sent. See the description for which URIs a client may use.
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          description: PKCE code challenge, `BASE64URL(SHA256(code_verifier))`.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          description: Must be `S256` (compared case-insensitively).
          schema:
            type: string
            enum: [S256, s256]
        - name: client_id
          in: query
          required: false
          description: A registered `lwc_` client id, an https Client ID Metadata Document URL, or omitted.
          schema:
            type: string
        - name: response_type
          in: query
          required: false
          description: Conventionally `code`; not validated.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Space-delimited. Of `mcp:search mcp:purchase mcp:manage_content mcp:analytics`; anything else is dropped.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Echoed back on the redirect.
          schema:
            type: string
      responses:
        '200':
          description: The consent page. The parameters are kept in the browser session for the steps that follow.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: >
            The authorization parameters are unusable. Answered as JSON, not HTML: `redirect_uri is
            required`, `code_challenge is required`, `code_challenge_method must be S256`,
            `redirect_uri not registered for this client_id`, `client_id metadata fetch failed`,
            `redirect_uri not permitted by client_id metadata` or `redirect_uri must be localhost`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthAuthorizeErrorResponse'
              examples:
                not_localhost:
                  summary: Unregistered client with a non-loopback redirect URI
                  value:
                    error: 'redirect_uri must be localhost'

    post:
      summary: OAuth consent submission
      description: >
        The consent page's form post — a browser flow, not an API call, and it requires the page's
        CSRF token. Carries the same authorization parameters as `GET /oauth/authorize`, validated
        the same way, plus the person's credentials: `email` and `password`, or nothing when
        `POST /oauth/authorize/google` has already verified them in this session. A person who
        holds more than one store must also choose one with `store_id`. On success the browser is
        redirected to `redirect_uri` with `code` (valid 10 minutes, single use) and `state`.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [redirect_uri, code_challenge, code_challenge_method, authenticity_token]
              properties:
                redirect_uri:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256, s256]
                client_id:
                  type: string
                response_type:
                  type: string
                scope:
                  type: string
                state:
                  type: string
                email:
                  type: string
                password:
                  type: string
                store_id:
                  type: string
                  description: Required when the person holds more than one store they own or author.
                authenticity_token:
                  type: string
                  description: The CSRF token from the consent page.
      responses:
        '302':
          description: Consent given; redirected to `redirect_uri?code=<code>&state=<state>`.
          headers:
            Location:
              schema:
                type: string
        '200':
          description: >
            The consent page again: with an error (`Invalid email or password`, or `Session expired.
            Please sign in again.` when the Google-verified session no longer names a user), or with
            a store picker for a person holding several stores.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: >
            The authorization parameters are unusable. Answered as JSON, not HTML: `redirect_uri is
            required`, `code_challenge is required`, `code_challenge_method must be S256`,
            `redirect_uri not registered for this client_id`, `client_id metadata fetch failed`,
            `redirect_uri not permitted by client_id metadata` or `redirect_uri must be localhost`;
            or `store not accessible` for a `store_id` the person cannot use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthAuthorizeErrorResponse'
              examples:
                store_not_accessible:
                  summary: A store_id the person does not own or author
                  value:
                    error: 'store not accessible'
        '429':
          description: >
            Too many requests. The source IP is limited to 5 submissions per minute, answered with
            JSON. Repeated failed passwords against one email address also earn that address a
            growing backoff (up to 15 minutes), shared with the email login routes, answered by
            re-rendering the consent page with a 429 status.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTooManyRequestsResponse'
            text/html:
              schema:
                type: string

  /oauth/authorize/google:
    post:
      summary: OAuth consent — sign in with Google
      description: >
        The consent page's Google sign-in post — a browser flow, not an API call, and it requires
        the page's CSRF token. Verifies a Google ID token and, on success, records the person in
        the session so `POST /oauth/authorize` needs no password. The authorization parameters
        come from the session `GET /oauth/authorize` started, not from this request.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id_token, authenticity_token]
              properties:
                id_token:
                  type: string
                  description: Google ID token from Google Identity Services.
                authenticity_token:
                  type: string
      responses:
        '200':
          description: >
            The consent page, ready to approve; or with `Google sign-in failed. Please try again.`
            when the token does not verify, Google has not verified the address, or it belongs to a
            machine user.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: No authorization in progress in this session.
          content:
            text/plain:
              schema:
                type: string
                example: 'Session expired. Please start the authorization flow again.'
        '429':
          description: >
            Too many requests. The source IP is limited to 5 Google sign-ins per minute.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTooManyRequestsResponse'

  /oauth/token:
    post:
      summary: OAuth token endpoint
      description: >
        Exchanges an authorization code for a token pair, or rotates a refresh token. Both answer
        in RFC 6749's flat error shape, never the API's `ErrorResponse` envelope.


        **`authorization_code`** needs `code`, the PKCE `code_verifier` (S256) and the same
        `redirect_uri` the authorization used. `client_id` may be sent and is only recorded. The
        granted scopes may be narrower than those consented to: store scopes are limited to what
        the person's role in the store permits at the moment of exchange, and `scope` in the
        response says what was granted.


        **`refresh_token`** needs `refresh_token`. Each refresh token works once, and rotating it
        also replaces the access token's secret, so the previous access token stops working.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponse'
        '400':
          description: >
            `unsupported_grant_type` for any other `grant_type`. `invalid_grant` for a code that is
            unknown, already used or expired; with `error_description` `PKCE verification failed`
            or `redirect_uri mismatch`; and for a refresh token that is unknown, malformed, expired,
            already used, revoked, or past its 90-day age limit. Never 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenErrorResponse'
              examples:
                invalid_grant:
                  summary: Unknown, used or expired code or refresh token
                  value:
                    error: invalid_grant
                pkce:
                  summary: Wrong code_verifier
                  value:
                    error: invalid_grant
                    error_description: 'PKCE verification failed'
                redirect_mismatch:
                  summary: redirect_uri differs from the authorization's
                  value:
                    error: invalid_grant
                    error_description: 'redirect_uri mismatch'
                unsupported:
                  summary: Unknown grant_type
                  value:
                    error: unsupported_grant_type
        '429':
          description: >
            Too many requests. The source IP is limited to 10 requests per minute, shared by both grants.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTooManyRequestsResponse'

  /oauth/revoke:
    post:
      summary: Revoke an OAuth token (RFC 7009)
      description: >
        Revokes the MCP key behind an access token or refresh token. The token itself is the
        credential, so no other authentication is needed; it is not throttled. Always answers
        200 with an empty object — including for an unknown, malformed or missing token — so the
        answer says nothing about whether a token existed.
      tags:
        - OAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthRevokeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OauthRevokeRequest'
      responses:
        '200':
          description: Revoked, or nothing to revoke
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0

  /v1/config/public:
    get:
      summary: Get public platform configuration
      description: >
        Returns platform-level configuration values that are safe to expose publicly.
        No authentication is required. Use this endpoint to retrieve the Google OAuth
        client ID before the user has signed in.
      tags:
        - Config
      security: []
      responses:
        '200':
          description: Public platform configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'

  /v1/auth/signup:
    post:
      summary: Register a new user with email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 10 signups per minute. There is no
            per-account backoff on this route.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '201':
          description: Account created; token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                success:
                  summary: Successful registration
                  value:
                    token_type: Bearer
                    access_token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwOTM1N2MyMi0zODlhLTRmYWItYjE2Ni04MjJlNTJhNWJmNWUiLCJyb2xlIjoiYnV5ZXIiLCJidXllcl9jbGFpbXMiOnsidXNlcl9pZCI6IjA5MzU3YzIyLTM4OWEtNGZhYi1iMTY2LTgyMmU1MmE1YmY1ZSIsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSJ9LCJpc3MiOiJMZWRlV2lyZSBBUEkiLCJhdWQiOiJ3ZWIiLCJleHAiOjE3NDc0OTk5NzMsImlhdCI6MTc0NzQ5ODE3M30'
                    refresh_token: 'c2a0e1f8a7e53c9d63b1d2f8e4z5x6c7v8b9n0m1a2s3d4f5g6h7j8k9l0'
                    expires_at: '2025-05-17T16:39:33Z'
        '400':
          description: >
            A required field is missing or empty, or the new account fails validation (for example
            a password shorter than 6 characters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_email:
                  summary: Email not sent
                  value:
                    error:
                      code: 400
                      message: 'email is missing'
                empty_name:
                  summary: Name sent but empty
                  value:
                    error:
                      code: 400
                      message: 'name must be filled'
        '409':
          description: An account with this email address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_taken:
                  summary: Email already registered
                  value:
                    error:
                      code: 409
                      message: 'Email address has already been taken'
        '422':
          description: >
            An invitation token was sent and can't be accepted. No account is created. `error.type` is
            `invitation_not_accepted`; `reason` says why (`not_found`, `expired`, `wrong_email`,
            `already_accepted`, `already_member`, `already_in_company` or `invalid`) and `invitation`
            says which. Every invitation refusal is a 422, so a `409` from this route still means only
            that the email is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                invitation_not_found:
                  summary: Unknown token, or a Company invitation addressed to another email
                  value:
                    error:
                      code: 422
                      message: 'Invitation not found'
                      type: invitation_not_accepted
                    reason: not_found
                    invitation: company
                expired:
                  summary: Invitation expired or withdrawn
                  value:
                    error:
                      code: 422
                      message: 'Invitation has expired or was withdrawn'
                      type: invitation_not_accepted
                    reason: expired
                    invitation: company
                wrong_email:
                  summary: Store invitation sent to a different address
                  value:
                    error:
                      code: 422
                      message: 'This invitation was sent to a different email address'
                      type: invitation_not_accepted
                    reason: wrong_email
                    invitation: store

  /v1/auth/login/email:
    post:
      summary: Log in using email and password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginEmailRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/login/email`, `/login/google`, `/login/api-key` and `/login/buyer-api-key`.
            Repeated failures against one email address also earn that address a growing backoff
            (up to 15 minutes), shared with the merchant email login and the OAuth consent screen.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                success:
                  summary: Successful login
                  value:
                    token_type: Bearer
                    access_token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwOTM1N2MyMi0zODlhLTRmYWItYjE2Ni04MjJlNTJhNWJmNWUiLCJyb2xlIjoiYnV5ZXIiLCJpc3MiOiJMZWRlV2lyZSBBUEkiLCJhdWQiOiJ3ZWIiLCJleHAiOjE3NDc0OTk5NzMsImlhdCI6MTc0NzQ5ODE3M30'
                    refresh_token: '45a67890cd1ef2gh3ij4kl5mn6op7qr8st9uvwxyz123456789abcdef01'
                    expires_at: '2025-05-17T16:39:33Z'
        '400':
          description: A required field is missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_password:
                  summary: Password not sent
                  value:
                    error:
                      code: 400
                      message: 'password is missing'
        '401':
          description: >
            Unknown email or wrong password; the two are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    error:
                      code: 401
                      message: 'Invalid email or password'

  /v1/auth/login/google:
    post:
      summary: Log in using Google OAuth
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginOAuthRequest'
            examples:
              google_login:
                summary: Google OAuth login
                value:
                  id_token: 'eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1Njc4OTAiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJhY2NvdW50cy5nb29nbGUuY29tIiwiYXVkIjoiY2xpZW50LWlkIiwiZXhwIjoxNzQ3NDk5OTczLCJpYXQiOjE3NDc0OTgxNzMsInN1YiI6IjEyMzQ1Njc4OTAiLCJlbWFpbCI6InRlc3RAZXhhbXBsZS5jb20iLCJuYW1lIjoiVGVzdCBVc2VyIiwicGljdHVyZSI6Imh0dHBzOi8vZXhhbXBsZS5jb20vYXZhdGFyLmpwZyJ9.signature'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/login/email`, `/login/google`, `/login/api-key` and `/login/buyer-api-key`.
            There is no per-account backoff on this route.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                success:
                  summary: Successful Google OAuth login
                  value:
                    token_type: Bearer
                    access_token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwOTM1N2MyMi0zODlhLTRmYWItYjE2Ni04MjJlNTJhNWJmNWUiLCJyb2xlIjoiYnV5ZXIiLCJidXllcl9jbGFpbXMiOnsidXNlcl9pZCI6IjA5MzU3YzIyLTM4OWEtNGZhYi1iMTY2LTgyMmU1MmE1YmY1ZSIsImVtYWlsIjoidGVzdEBleGFtcGxlLmNvbSJ9LCJpc3MiOiJMZWRlV2lyZSBBUEkiLCJhdWQiOiJ3ZWIiLCJleHAiOjE3NDc0OTk5NzMsImlhdCI6MTc0NzQ5ODE3M30'
                    refresh_token: 'google_oauth_refresh_token_123'
                    expires_at: '2025-05-17T16:39:33Z'
        '400':
          description: >
            Every problem with the token, and only those: `id_token` missing or not a three-segment
            JWT; a signature that does not verify, an expired token, a token minted for another
            OAuth client, or Google's key set unreachable (all `Invalid token signature`); a token
            that cannot be read (`Invalid token`); a verified token naming no usable address
            (`Failed to create user`, `Invalid user data`); or an unexpected failure while verifying
            (`Authentication failed`). This route never answers 401 or 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing ID token
                  value:
                    error:
                      code: 400
                      message: 'id_token is missing'
                malformed_token:
                  summary: Not a three-segment JWT
                  value:
                    error:
                      code: 400
                      message: 'id_token must be a valid JWT token'
                unverifiable_token:
                  summary: Bad signature, expired, wrong audience, or key set unreachable
                  value:
                    error:
                      code: 400
                      message: 'Invalid token signature'
        '403':
          description: >
            Google signed the token but has not verified the account's email address
            (`email_verified` is false or absent). Refused before any account is looked up, so
            no account is created, linked or signed in. `error.type` is `email_not_verified`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_not_verified:
                  summary: Google has not verified the address
                  value:
                    error:
                      code: 403
                      message: "This Google account's email address is not verified"
                      type: email_not_verified
        '422':
          description: >
            An invitation token was sent and can't be accepted. Returned only when this call
            would create the account, and no account is created. `error.type` is
            `invitation_not_accepted`; `reason` says why and `invitation` says which. An account
            that already exists signs in anyway, and `invitations` in the 200 says what happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                invitation_not_found:
                  summary: Unknown token, or a Company invitation addressed to another email
                  value:
                    error:
                      code: 422
                      message: 'Invitation not found'
                      type: invitation_not_accepted
                    reason: not_found
                    invitation: company
                expired:
                  summary: Invitation expired or withdrawn
                  value:
                    error:
                      code: 422
                      message: 'Invitation has expired or was withdrawn'
                      type: invitation_not_accepted
                    reason: expired
                    invitation: company

  /v1/auth/login/buyer-api-key:
    post:
      summary: Exchange a buyer API key + secret for a JWT
      tags:
        - Authentication
      description: >
        Authenticate as a buyer using a named API key and secret.
        Returns the same token shape as `POST /v1/auth/login/email`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginBuyerApiKeyRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/login/email`, `/login/google`, `/login/api-key` and `/login/buyer-api-key`.
            Repeated failures against one `key` also earn that key a growing backoff (up to 15 minutes),
            shared with `POST /v1/auth/login/api-key`.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: '`key` or `secret` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_secret:
                  summary: Secret not sent
                  value:
                    error:
                      code: 400
                      message: 'secret is missing'
        '401':
          description: Invalid key or secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Unknown key or wrong secret
                  value:
                    error:
                      code: 401
                      message: 'Invalid key or secret'

  /v1/user/api-keys:
    get:
      summary: List buyer API keys for the authenticated user
      description: >
        Every key the caller holds, newest first (`created_at` descending). Not paginated: the
        full list is returned. Requires a buyer token; seller and merchant tokens get 403
        `Invalid Role`.
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys (secret never included), newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserApiKey'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      code: 401
                      message: 'Invalid token'
        '403':
          description: The token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_role:
                  summary: Non-buyer token
                  value:
                    error:
                      code: 403
                      message: 'Invalid Role'
    post:
      summary: Create a new buyer API key
      description: >
        Requires a buyer token; seller and merchant tokens get 403 `Invalid Role`. A Machine
        user cannot create its own keys — its Company's admins manage them.
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserApiKeyCreateRequest'
      responses:
        '201':
          description: Key and secret (secret shown once only — store immediately)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiKeyCreateResponse'
        '400':
          description: >
            The body failed validation: `name` missing or blank, or `spending_limit_cents` not an
            integer from 1 to 2147483647.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                blank_name:
                  summary: Blank name
                  value:
                    error:
                      code: 400
                      message: 'name must be filled'
                zero_limit:
                  summary: Non-positive spending limit
                  value:
                    error:
                      code: 400
                      message: 'spending_limit_cents must be greater than 0'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is a Machine user, whose keys its Company's admins manage
            (`Machine users cannot manage their own keys`), or the token is not a buyer token
            (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machine_user:
                  summary: Machine user
                  value:
                    error:
                      code: 403
                      message: 'Machine users cannot manage their own keys'
                invalid_role:
                  summary: Non-buyer token
                  value:
                    error:
                      code: 403
                      message: 'Invalid Role'
        '422':
          description: The key could not be saved — most often, the caller already has a key with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate_name:
                  summary: Duplicate name
                  value:
                    error:
                      code: 422
                      message: 'Name has already been taken'

  /v1/user/api-keys/{id}:
    delete:
      summary: Revoke a buyer API key
      description: >
        Requires a buyer token; seller and merchant tokens get 403 `Invalid Role`. Only the
        caller's own keys can be revoked; another user's key id answers 404.
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key revoked
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is a Machine user, whose keys its Company's admins manage
            (`Machine users cannot manage their own keys`), or the token is not a buyer token
            (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller has no key with this id (including another user's key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Key not found
                  value:
                    error:
                      code: 404
                      message: 'Not found'

  /v1/user/spend-cap:
    get:
      summary: Read the authenticated buyer's daily spend cap
      description: >
        Returns the cap, the timezone bounding the spend window, spend so far in the current
        window, what remains, and when the window rolls. The session token names the buyer;
        there is no id in the path, so no buyer can read another's cap.
      tags:
        - Buyer Spend Cap
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The buyer's spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSpendCap'
        '401':
          description: >
            Missing or invalid buyer token (`Request must include a valid Bearer Token`,
            `Invalid token`), or the caller is a deactivated Machine user
            (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Set or clear the authenticated buyer's daily spend cap
      description: >
        Writes daily_spend_limit_cents for the buyer the session token names — null clears the
        cap, leaving the buyer uncapped. This is the supported way to become uncapped: buyer
        creation always applies the default cap, even when an explicit null is supplied.
        Returns the updated cap in the same shape GET returns.
      tags:
        - Buyer Spend Cap
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSpendCapUpdateRequest'
      responses:
        '200':
          description: The updated spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSpendCap'
        '401':
          description: >
            Missing or invalid buyer token (`Request must include a valid Bearer Token`,
            `Invalid token`), or the caller is a deactivated Machine user
            (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The buyer holds an open Company membership. A member's cap is set by a Company admin
            through PATCH /v1/company/members/{id}, admins' own included. Also returned, as
            `Invalid Role`, when the token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Cap is negative, above 2147483647, fractional, non-integer, or the field was omitted. Every validation
            failure on this operation is a 422, never a 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/company/invitations:
    get:
      summary: List the Company's pending invitations
      description: >
        Company admins only. Pending means not accepted, withdrawn or expired.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInvitationList'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Invite someone to the Company
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read.
        Every invitation emails a token that accepting requires: an existing user accepts with it, a
        new address signs up with it. Nobody joins until they accept. Inviting someone who belongs
        to another Company succeeds; their accept is refused.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInvitationRequest'
      responses:
        '201':
          description: The invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInvitation'
        '400':
          description: No `email`, or an `email` or `role` that is empty or not a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already a member, or an invitation to this address is already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Unknown role, or an `email` that is blank once surrounding whitespace is trimmed (`Email
            is required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/invitations/{id}:
    delete:
      summary: Revoke a pending invitation
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read.
        Withdraws an invitation that has not been accepted, revoked or expired, so the address can
        be invited again at once rather than when this one expires. The emailed token can no longer
        be accepted.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company, or the invitation is not one of its own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The invitation is no longer pending (accepted, already revoked or expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/invitations/accept:
    post:
      summary: Accept an invitation
      description: >
        Opens a membership with the invited role. Requires the token from the invitation email,
        for existing users as well as new ones: an account's address is not verified, so being
        signed in as the invited address is not enough. The token must belong to an invitation
        addressed to one of the buyer's addresses. Refused while the buyer holds an open
        membership of another Company; they must leave it first.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInvitationAcceptRequest'
      responses:
        '201':
          description: The new membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '400':
          description: No token given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is a Machine user, which is created into its Company and never invited
            (`Machine users cannot accept an invitation`, reason `invalid`), or the token is not a
            buyer token (`Invalid Role`), which carries no `reason`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/InvitationNotAcceptedError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No invitation with this token addressed to this buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
        '409':
          description: Already accepted, or the buyer already belongs to a Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
        '410':
          description: Expired or withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
  /v1/company/machine-users:
    get:
      summary: List the Company's Machine users
      description: >
        Company admins only. Active and deactivated, oldest first.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Machine users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMachineUserList'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a Machine user
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read.
        Creates a Buyer with a name and no email, password or login, joined at once as an active
        non-admin member with the default daily Spend cap. Every human-only flow (login, Google
        sign-in, OAuth consent, password reset, accepting or leaving a membership) refuses it.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMachineUserRequest'
      responses:
        '201':
          description: The Machine user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMachineUser'
        '400':
          description: >
            No `name`, or a `name` or `description` that is not a string, or an empty `name`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            An active Machine user in the Company already has this name (compared case-sensitively)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The name is blank once surrounding whitespace is trimmed, or longer than 100 characters
            after trimming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/machine-users/{id}:
    patch:
      summary: Rename a Machine user or change its description
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read.
        Changes `name`, `description`, or both, under the same name rules as creating one; keeping
        its own current name is not a conflict. Its keys and sessions are untouched, so the agent
        keeps working without being re-issued anything. Attribution reads the name live: GET
        /v1/company/members, /v1/company/purchases and /v1/company/spend show the new name, on
        earlier purchases as well as later ones.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMachineUserUpdateRequest'
      responses:
        '200':
          description: The updated Machine user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMachineUser'
        '400':
          description: Neither name nor description given, or a null name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company, or the Machine user is not in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Another active Machine user in the Company has this name (compared case-sensitively), or
            this one is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The name is blank once surrounding whitespace is trimmed, or longer than 100 characters
            after trimming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Deactivate a Machine user, permanently
      description: >
        Company admins only. A non-admin is refused with 403 before the body or any id is read. In
        one transaction closes its membership, revokes every key it holds and ends its sessions. It
        cannot be reactivated; create a new one, which may reuse the name.
      tags:
