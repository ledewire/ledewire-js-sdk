    post:
      summary: Complete a content purchase
      description: >
        Buys one work and delivers its body on this response. `content_id` and `price_cents` are
        taken from wherever the Buyer found the work, including a result from
        `POST /v1/content/search` — a Store's work and a Publication's work alike, whether or not
        anybody has bought that work before. Buying a work already bought is allowed and is a
        new purchase. Requires a buyer token; seller and merchant tokens get 403 `Invalid Role`.
      tags:
        - Purchases
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreateRequest'
      responses:
        '200':
          description: Purchase completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
              examples:
                purchase_completed:
                  summary: Successfully purchased content
                  value:
                    id: '3f7b9a8c-1d2e-3f4a-5b6c-7d8e9f0a1b2c'
                    content_id: 'b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e'
                    content:
                      id: 'b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e'
                      content_type: 'markdown'
                      title: 'Sample Blog Post'
                      resource_url: null
                      publication: null
                    buyer_id: '09357c22-389a-4fab-b166-822e52a5bf5e'
                    buyer:
                      id: '09357c22-389a-4fab-b166-822e52a5bf5e'
                      name: 'Buyer Name'
                    seller_id: '87654321-dcba-4fed-ba98-76543210fedc'
                    seller:
                      id: '87654321-dcba-4fed-ba98-76543210fedc'
                      name: 'Seller Name'
                    amount_cents: 1200
                    timestamp: '2025-05-18T13:27:45Z'
                    status: 'completed'
                    content_body: 'IyBTYW1wbGUgQmxvZyBQb3N0Cg=='
        '402':
          description: >
            Payment Required — the buyer's daily spend cap would be exceeded. No money moved
            and no purchase was completed. Note the absence of a funding URL: adding wallet
            funds cannot clear a cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySpendCapReachedError'
              examples:
                daily_spend_cap_reached:
                  summary: Daily spend cap reached
                  value:
                    error:
                      code: 402
                      message: 'Daily spend cap reached'
                      type: 'daily_spend_cap_reached'
                    cap_cents: 1000
                    spent_cents: 999
                    remaining_cents: 1
                    resets_at: '2026-08-21T00:00:00Z'
                    bulk_exempt: false
        '400':
          description: >
            The body failed validation: `content_id` or `price_cents` missing, or of the wrong
            type. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_field:
                  summary: Missing field
                  value:
                    error:
                      code: 400
                      message: 'content_id is missing'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Content not found — no work carries this id (and no licensable catalogue entry
            does), **or** the work it names is not `public`. Visibility is access control rather
            than discoverability: a work a Seller has set to `unlisted` is withheld from sale on
            every buyer-facing path, and this endpoint answers for it exactly as it does for an id
            that names nothing. The refusal is free — it precedes the wallet debit, so no funds
            move and no purchase record is written. A Seller's own access to their unlisted
            work through the seller-scoped paths is unaffected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Content not found or not public
                  value:
                    error:
                      code: 404
                      message: 'Content (b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e) was not found'
        '422':
          description: >
            Unprocessable Content. Either `price_cents` does not match the work's current price
            (a plain message, no `error.type`), or the purchase was refused with an `error.type`:
            `insufficient_funds` (the wallet cannot cover the price; the body is an
            `InsufficientFundsError`), or one of the brokered-delivery refusals
            `retrieval_failed`, `not_licensable`, `not_found`, `price_drifted` and `client_error`
            (see `ErrorResponse.error.type` for what each means). `client_error` also covers a
            purchase that could not be recorded. `not_subscribed` refuses a work sold only to
            Buyers whose Company subscribes to it, before anything is charged or fetched.
          content:
            application/json:
              schema:
                # anyOf, not oneOf: an insufficient-funds body also satisfies the looser
                # ErrorResponse, so oneOf would reject it.
                anyOf:
                  - $ref: '#/components/schemas/InsufficientFundsError'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient_funds:
                  summary: Insufficient funds
                  value:
                    error:
                      code: 422
                      message: 'Insufficient Funds'
                      type: insufficient_funds
                    required_cents: 250
                    wallet_balance_cents: 100
                    shortfall_cents: 150
                    funded_by: buyer
                price_mismatch:
                  summary: Price has changed
                  value:
                    error:
                      code: 422
                      message: 'Content (b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e) price appears to have changed'
                retrieval_failed:
                  summary: Brokered content could not be retrieved
                  value:
                    error:
                      code: 422
                      message: 'Content could not be retrieved'
                      type: retrieval_failed

  /v1/purchases/{id}:
    get:
      summary: Get purchase by ID
      description: >
        One of the caller's own purchases. Another buyer's purchase answers 404, exactly as an
        unknown id does (the lookup is scoped to the caller), and so does an id that is not a
        UUID. Never carries `content_body` or `content_uri`. Requires a buyer token; seller and
        merchant tokens get 403 `Invalid Role`.
      tags:
        - Purchases
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Purchase ID
      responses:
        '200':
          description: Purchase object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
              examples:
                purchase:
                  summary: Purchase details
                  value:
                    id: '3f7b9a8c-1d2e-3f4a-5b6c-7d8e9f0a1b2c'
                    content_id: 'b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e'
                    content:
                      id: 'b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e'
                      content_type: 'markdown'
                      title: 'Sample Blog Post'
                      resource_url: null
                      publication: null
                    buyer_id: '09357c22-389a-4fab-b166-822e52a5bf5e'
                    buyer:
                      id: '09357c22-389a-4fab-b166-822e52a5bf5e'
                      name: 'Buyer Name'
                    seller_id: '87654321-dcba-4fed-ba98-76543210fedc'
                    seller:
                      id: '87654321-dcba-4fed-ba98-76543210fedc'
                      name: 'Seller Name'
                    amount_cents: 1200
                    timestamp: '2025-05-18T13:27:45Z'
                    status: 'completed'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
