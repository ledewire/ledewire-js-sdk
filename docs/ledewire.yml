        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — not a member of this store, or an API key for another store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

