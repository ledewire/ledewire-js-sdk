                    seller_id: '87654321-dcba-4fed-ba98-76543210fedc'
                    amount_cents: 1200
                    timestamp: '2025-05-18T13:27:45Z'
                    status: 'completed'
        '402':
          description: >
            Payment Required — the buyer's daily spend cap would be exceeded. No money moved
            and no purchase was completed. Note the absence of a funding URL: adding wallet
            funds cannot clear a cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySpendCapReachedError'
              examples:
                daily_spend_cap_reached:
                  summary: Daily spend cap reached
                  value:
                    error:
                      code: 402
                      message: 'Daily spend cap reached'
                      type: 'daily_spend_cap_reached'
                    cap_cents: 1000
                    spent_cents: 999
                    remaining_cents: 1
                    resets_at: '2026-08-21T00:00:00Z'
        '400':
          description: Invalid purchase request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient_funds:
                  summary: Insufficient funds
                  value:
                    error: 'Insufficient funds to complete purchase'
                already_purchased:
                  summary: Already purchased
                  value:
                    error: 'User has already purchased this content'
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User lacks sufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Content not found — no work carries this id, **or** the work it names is not
            `public`. Visibility is access control rather than discoverability: a work a
            Seller has set to `unlisted` is withheld from sale on every buyer-facing path,
            and this endpoint answers for it exactly as it does for an id that names
            nothing. The refusal is free — it precedes the wallet debit, so no funds move
            and no purchase record is written. A Seller's own access to their unlisted
            work through the seller-scoped paths is unaffected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Content not found
                  value:
                    error: 'Content with specified ID not found'
                not_public:
                  summary: Content exists but is not public
                  value:
                    error: 'Content (b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e) was not found'
        '422':
          description: Unprocessable Content - Price mismatch or other validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                price_mismatch:
                  summary: Price has changed
                  value:
                    error:
                      code: 422
                      message: 'Content (b1c2d3e4-f5a6-7b8c-9d0e-1f2a3b4c5d6e) price appears to have changed'

