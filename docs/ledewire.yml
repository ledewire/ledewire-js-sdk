  /v1/wallet/transactions:
    get:
      summary: Wallet transaction history
      description: >
        Returns the authenticated user's wallet ledger, newest first. Not paginated: the full
        history is returned. It contains: completed funding transfers into the user's personal
        wallet (credits; pending, processing, failed and cancelled ones are excluded, as are
        Company wallet top-ups); purchases that are `completed` or `refunded` and are not part of a
        Bulk acquisition; and Bulk acquisitions, one entry each, that are still holding funds or
        have captured something (`captured_cents > 0`). Requires a buyer token; seller and
        merchant tokens get 403 `Invalid Role`.
      tags:
