  /v1/x402/contents/{id}:
    get:
      summary: Fetch content via x402 payment protocol
      description: >
        Implements the x402 v2 payment protocol using the `ledewire-wallet` scheme.
        On the first request (no `PAYMENT-SIGNATURE` header) the server responds with
        `402 Payment Required` and a `PAYMENT-REQUIRED` header describing the price and
        a single-use nonce. The client retries with a `PAYMENT-SIGNATURE` header
        containing the buyer JWT and nonce. On success the server responds with `200`,
        a `PAYMENT-RESPONSE` header with the settlement result, and the content body.

        **Short-circuits (no 402 round-trip):**
        - Free content (`price_cents: 0`) — returns `200` immediately.
        - Returning purchaser — if `Authorization` header is present and the resolved
          buyer already has a completed purchase, returns `200` directly.
      tags:
        - x402
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Content UUID
        - in: header
          name: PAYMENT-SIGNATURE
          required: false
          schema:
            type: string
          description: >-
            Base64-encoded x402 v2 PaymentPayload JSON. Required for paid content
            (unless returning purchaser short-circuit applies). The optional
            `extensions.payment-identifier` field accepts a stable UUID; if the
            server has already settled a payment for that identifier it returns the
            original PAYMENT-RESPONSE from cache without re-charging — safe to retry
            on network errors.
        - in: header
          name: Authorization
          required: false
          schema:
            type: string
          description: Optional Bearer JWT. If present and the buyer has already purchased this content, returns 200 directly without a 402 round-trip.
      responses:
        '200':
          description: Payment settled; content delivered.
          headers:
            PAYMENT-RESPONSE:
              schema:
                type: string
              description: >
                Base64-encoded x402 v2 SettlementResponse JSON. Omitted for free content and
                when the returning-purchaser short-circuit applies (no new settlement).
                The decoded JSON includes `accessToken` — a short-lived RS256-signed JWT
                (default 24h TTL) that third-party proxies and CMS plugins can verify offline
                against `/.well-known/x402-jwks.json`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402ContentResponse'
        '402':
          description: Payment required. PAYMENT-REQUIRED header contains the x402 v2 PaymentRequired JSON (Base64-encoded).
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: >
                Base64-encoded x402 v2 PaymentRequired JSON describing accepted schemes, price, and
                payment parameters. The `accepts[0].extra` object contains `nonce` (single-use token),
                `expiresAt` (Unix timestamp), and `contentId` (UUID of the content being purchased).
                The `extensions` block contains two sub-objects: `payment-identifier: { supported: true }`
                (server advertises idempotent retry support — clients should generate a stable UUID per
                logical fetch and include it in `extensions.payment-identifier` of the PAYMENT-SIGNATURE
                to avoid double-charging on network errors), and `ledewire-wallet` (discovery block with
                `apiBase` [request-derived, environment-aware], `authEndpoint` [`/v1/auth/login/buyer-api-key`],
                `signupUrl` [configurable via `LEDEWIRE_SIGNUP_URL`], `schemeVersion` [`ledewire:v1`],
                and `contentId` [UUID of the Ledewire content record]). Clients such as `@ledewire/x402-client`
                use the `ledewire-wallet` block to self-configure without hardcoding the API location.
                `contentId` is essential for the Worker gate case where the origin URL carries no Ledewire
                identifier — the client reads it from here to construct the `PAYMENT-SIGNATURE` payload.

                A 402 carrying a `DailySpendCapReachedError` body and **no** PAYMENT-REQUIRED header is
                the other case: the buyer's daily spend cap would be exceeded. Retrying the handshake
                cannot help and neither can funding the wallet — the cap resets at `resets_at`.
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a DailySpendCapReachedError body also satisfies
                # ErrorResponse, which only constrains the envelope.
                anyOf:
                  - $ref: '#/components/schemas/DailySpendCapReachedError'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                payment_required:
                  summary: x402 handshake — read the PAYMENT-REQUIRED header
                  value:
                    error:
                      code: 402
                      message: 'Payment required'
                daily_spend_cap_reached:
                  summary: Daily spend cap reached
                  value:
                    error:
                      code: 402
                      message: 'Daily spend cap reached'
                      type: 'daily_spend_cap_reached'
                    cap_cents: 1000
                    spent_cents: 1000
                    remaining_cents: 0
                    resets_at: '2026-08-21T00:00:00Z'
        '400':
          description: Malformed PAYMENT-SIGNATURE (invalid Base64 or JSON), unsupported x402Version, mismatched scheme/network, or contentId mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid JWT in PAYMENT-SIGNATURE payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: JWT in PAYMENT-SIGNATURE belongs to a non-buyer role (merchant or store-manager).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content not found or not publicly visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (30 requests per minute per IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/x402/discovery/resources:
    get:
      summary: Discover publicly available x402 v2 resources (Bazaar)
      description: >
        Unauthenticated endpoint for x402 crawlers and agents to discover Ledewire content
        without requiring MCP support. Returns public content formatted as x402 v2 Bazaar
        resource entries. `content_body` and `content_uri` are never included.
      tags:
        - x402
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of resources to return (max 100).
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based offset for pagination.
      responses:
        '200':
          description: Paginated list of x402 v2 Bazaar resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402BazaarDiscoveryResponse'

  /v1/x402/verify-origin:
    get:
      summary: Verify that a URL is a registered Ledewire content item
      description: >
        Unauthenticated endpoint used by the browser extension, JS snippet, and proxy
        to confirm that a URL is legitimately registered as a Ledewire content item
        before showing any payment UI. Returns `verified: false` silently for unknown
        URLs to prevent enumeration and to avoid misleading users.

        Responses are HTTP-cached for the configured TTL (default 1 hour).
        New content registrations propagate within that window.
      tags:
        - x402
      security: []
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: Absolute URL of the page to verify (e.g. https://theirsite.com/articles/slug)
      responses:
        '200':
          description: >
            Always returns 200. `verified: true` means the URL is registered;
            `verified: false` means it is not (or the URL was invalid).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOriginVerified'
                  - $ref: '#/components/schemas/VerifyOriginUnverified'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/x402-jwks.json:
    get:
      summary: JSON Web Key Set for x402 accessToken verification
      description: >
        Publishes the RS256 public key used to sign `accessToken` values included in
        `PAYMENT-RESPONSE`. Third-party proxies and CMS plugins fetch this once (and
        cache it for 24 hours) to verify access tokens offline without calling Ledewire
        on every request.

        Standard JWKS format (RFC 7517). The `kid` claim in the access token matches
        the `kid` in the JWKS entry.
      tags:
        - x402
      security: []
      responses:
        '200':
          description: JWKS document
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=86400, public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '503':
          description: Key material unavailable (credentials not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/publications:
    get:
      summary: List the publications available to license
      description: >
        Every Publication the Broker reports as ready to license, ordered by name. Served from our
        own registry, reconciled daily against the Broker's directory, so it answers even while
        the Broker is unreachable.


        Licensability is the only filter. A publication that publishes no `FULL_USE` rate is
        listed and flagged `bulk_licensable: false` rather than omitted, and nothing is hidden
        for its page types, article lengths or perceived value.


        **Authorization:** none.
      tags:
        - bulk-licensing
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A page of publications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationListResponse'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/publications/{id}/works:
    get:
      summary: List a publication's works by date range
      description: >
        One page of the article URLs a Publication has available to license, read live from the
        Broker's catalog and optionally bounded by modification date. A page of URLs is exactly
        what `POST /v1/acquisitions` takes as a Selection. Works are not priced here; pricing
        happens when the Selection is quoted.


        Check `date_filter` before reading an empty page as "nothing in range". Some publications'
        catalogs carry no modification dates, and on those the Broker's date filter returns
        nothing at all. That is reported as `unsupported`.


        **Authorization:** none.
      tags:
        - bulk-licensing
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Earliest modification date, inclusive, as `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Latest modification date, inclusive, as `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: cursor
          in: query
          required: false
          description: The previous page's `next_cursor`, sent with the same `from`/`to`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Works per page. Defaults to the maximum.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: A page of works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationWorkListResponse'
        '400':
          description: A malformed or reversed date, a limit out of range, or a cursor that is invalid or was issued for a different query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No listed publication has that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Broker's catalog could not be read, even after retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions:
    post:
      summary: Submit a Selection and open a Bulk acquisition
      description: >
        Uploads the list of works a Buyer wants and returns the acquisition that will carry its
        quote. Returns in milliseconds: nothing here calls the broker.


        **Quoting is asynchronous.** Resolving rates for 10,000 works is roughly 200 upstream
        batch calls under undocumented limits, so the response comes back `quote_state: pending`
        with a snapshot the Buyer can already read, and pricing runs behind it. Poll
        `GET /v1/acquisitions/{id}` until `quote_state` is `ready`.


        Two limits are enforced before any upstream call, and they refuse differently because
        they want different remedies: too many works means "trim the file", while too much value
        means "split this into two acquisitions".


        **Authorization:** buyer JWT.
      tags:
        - bulk-licensing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >
                    The works to license, in the order they should be recorded. Every row gets a
                    disposition, refused ones included — a row that vanished silently between
                    upload and quote is the failure the acknowledgement step exists to prevent.
      responses:
        '201':
          description: The acquisition, with its quote not yet priced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '400':
          description: No `urls`, or an empty list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Refused whole, before any upstream call. `error.type` distinguishes the two and they
            want different remedies: `selection_too_large` carries `maximum` and `submitted` and
            means trim the file, where `selection_value_too_large` means split this into two
            acquisitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No broker store is configured, so there is nothing bulk may run against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    get:
      summary: Poll a Bulk acquisition
      description: >
        The one resource the whole flow hangs off — the quote arriving and the run progressing
        are both read here, because the Buyer holds one id and neither question is answerable
        from the other.


        Cheap enough to poll for hours: it carries counts and an exclusion tally rather than
        rows. Per-work detail is `GET /v1/acquisitions/{id}/works`.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: The acquisition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No such acquisition for this Buyer — deliberately the same answer as "not yours".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/quote:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Re-price a quote by identity
      description: >
        Re-prices the snapshot at today's rates **without re-resolving it**. The Buyer returns to
        the id they already hold and gets the same works at current prices without uploading
        anything again, which is what makes the 24-hour quote expiry cheap rather than punitive.


        What is re-asked is what the rate surface decides — an unrated property may start
        publishing, a repriced one may come back under the ceiling. What is not re-asked is what
        the uploaded file decided: a malformed row is still malformed and a duplicate is still
        the second spelling of a work already in the list.


        Asynchronous, like the first quote. The acknowledgement is withdrawn, because the list
        the Buyer acknowledged is not this list.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '202':
          description: Re-pricing started. Poll the acquisition until `quote_state` is `ready`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Refused. `error.type` is `quote_in_progress` when a re-pricing is already running —
            pricing is expensive upstream, so a client polling and re-quoting in one loop is not
            allowed to queue one per iteration. Otherwise the hold is already placed: a re-quote
            moves the total the funds are reserved against, so it is refused once the money is
            committed. A `failed` quote is re-quotable, and asking again is the remedy for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/acknowledgement:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Acknowledge what cannot be sold
      description: >
        The Buyer registers the exclusions. Its own step rather than a flag on authorize, and the
        reason is the product being sold: a large upload will contain rows we cannot honour,
        rejecting the whole file is hostile at that size, and quoting the remainder silently is
        worse. The failure that matters most for an audit-trail product is a Buyer authorizing
        without registering that works they asked for are not coming.


        Withdrawn again by any re-quote, so it always refers to the current exclusions.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: Acknowledged. The acquisition can now be authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Nothing to acknowledge yet, or a quote too old to stand behind. `error.type` is
            `quote_expired` in the second case, and carries `quoted_at` and `valid_for_seconds`;
            the remedy is a re-quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/authorization:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    post:
      summary: Place the hold and start the run
      description: >
        The one moment a Bulk acquisition's money is committed. Funds move from the wallet to
        held funds for the stated maximum chargeable total, and retrieval begins off the request
        thread — 10,000 works is 10,000 round trips against a broker with no bulk primitive, so
        this returns immediately and the Buyer polls the acquisition.


        Two constraints are checked and they are not the same constraint. **Wallet balance** asks
        whether the Buyer has the money; **cap headroom** asks whether they are allowed to spend
        it today. The cap is read first and answered in its own terms, because sending a
        capped-out Buyer to add funds would send them to do something that cannot work.


        The spend cap is read once, here. Captures drawing on this hold are never re-checked: a
        refusal now is actionable, where a refusal at capture 31,000 is a half-delivered
        acquisition with money held and licences already paid for upstream.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '202':
          description: Hold placed, run started. Poll the acquisition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: >
            The daily spend cap refuses this acquisition. Carries `cap_cents`, `spent_cents`,
            `remaining_cents`, `resets_at` and `bulk_exempt` — and deliberately **no funding
            URL**, because adding money cannot clear a cap. Distinct from insufficient funds for
            that reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySpendCapReachedError'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The hold was refused and the quote survives, so it can be acknowledged or re-priced
            and authorized again. Either the exclusions are unacknowledged, or the quote expired
            between acknowledgement and here, or the wallet is short, or the acquisition is not
            in a state that can be authorized. Insufficient funds answers here rather than at
            402 — the existing contract for this API — which is what keeps it distinct from a
            cap refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/works:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
    get:
      summary: Per-work dispositions
      description: >
        Every work in the Selection with what happened to it, in submission order, refused rows
        included.


        **Partial failure is read from here, not caught.** An acquisition where 300 of 10,000
        works failed is ordinary — it does not fail the request and it is not an exception — so
        each outcome is a line item carrying its typed reason.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: A page of works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcquisitionWorkList'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/corpus:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    get:
      summary: Where the corpus is
      description: >
        Answers with a **state**, never with an error — every case is a 200. A corpus is a
        rendering of Purchases the Buyer already holds rather than an entitlement of its own, so
        a blob past its 30-day retention answers `rebuild_required`: a 404 or a 410 would say
        something was lost, and nothing was.


        Reading the state never starts work. Use `POST` to ask for an assembly.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: The corpus state, whatever it is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Build the corpus, if there is nothing to serve
      description: >
        Starts an assembly when the state is `rebuild_required`, and does nothing when a corpus
        is already downloadable — re-assembling one that is sitting there spends minutes of a
        worker for a file the Buyer can already have.


        A separate verb from `GET` rather than a flag on it, because a Buyer polling every few
        seconds while a run finishes would otherwise queue one assembly per poll.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: Nothing to do — a corpus is already downloadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '202':
          description: Assembly started. Poll the GET until `ready`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/corpus/download:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    get:
      summary: Download the corpus
      description: >
        The archive itself, behind the same authentication as everything else here — deliberately
        not a presigned object-store link, which would be a bearer capability anyone holding it
        could spend. The bytes are streamed from this route in every environment; it never
        redirects, so one authenticated request is the whole download:


        `curl -o corpus.tar.gz -H "Authorization: Bearer $TOKEN" https://api.ledewire.com/v1/acquisitions/$ID/corpus/download`


        The archive is sent with chunked transfer encoding and carries no `Content-Length`. To
        verify a download is complete, compare its size with the `byte_size` the state endpoint
        reports.


        A corpus that is not `ready` answers with its state at 200, exactly as the state endpoint
        would: asking for the file of an expired corpus is the same situation as asking where it
        is.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - bulk-licensing
      responses:
        '200':
          description: >
            The archive, or — when there is nothing to serve — the corpus state as JSON.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such acquisition for this Buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/acquisitions/{acquisition_id}/manifest:
    parameters:
      - name: acquisition_id
        in: path
        required: true
        schema:
          type: string
        description: Bulk acquisition UUID. Must belong to the authenticated Buyer.
    get:
      summary: The signed manifest of a Bulk acquisition
      description: >
        Returns the audit record standalone, so it can be obtained long after the corpus blob has
        expired. Its own resource rather than a field on the corpus download, because a field on a
        download that no longer exists is not a record anyone can obtain.


        To verify a corpus against it, resolve `signing_kid` through
        `/.well-known/ledewire-signing-keys.json`, match the key on all 32 raw public-key bytes,
        check it was valid at `signed_at`, verify the detached signature over the manifest's exact
        bytes, recompute every delivered entry's content hash against its file, and check the
        archive holds no file the manifest does not list. See docs/bulk-corpus-and-manifest.md.


        **Authorization:** buyer JWT. The acquisition must be the caller's own.
      tags:
        - audit-export
      responses:
        '200':
          description: The signed manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusManifestResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No such acquisition for this Buyer. Deliberately the same answer as "not yours": a 403
            distinguishing them would confirm to a stranger that a named Buyer ran a bulk
            acquisition, which is the one fact this product's customers care about keeping quiet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            The acquisition exists and has no manifest yet. The manifest is written once, at first
            assembly, so this says "ask for the corpus" rather than "there is nothing here".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/ledewire-signing-keys.json:
    get:
      summary: The audit-export signing key history
      description: >
        Publishes the append-only, hash-chained log of every Ed25519 key that has signed an
        audit-export manifest. A verifier holding a corpus resolves the manifest's `kid` through
        this document — never through the `jwk` inline in the manifest's own JWS header, which an
        attacker controls end to end. The match is on all 32 raw public-key bytes.

        Public and unauthenticated by necessity: a third party verifying a decade-old corpus holds
        no credentials of ours, and an anchor you need our permission to reach is not an anchor.

        Note the limit, stated in full in docs/audit-export-key-history.md: the root entry is
        signed by nothing and this document is served from a domain we control, so content and
        licence terms verify without us while our attestation does not, until #989 lands.
      tags:
        - audit-export
      security: []
      responses:
        '200':
          description: The key history, in chain order
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=86400, public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyHistoryResponse'
        '503':
          description: >
            No signing key has been activated. Deliberately not an empty list — a verifier reading
            `[]` would conclude its signature came from a key we never had, which is the answer it
            should get for a forgery, and the two must not look alike.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/pricing_rules:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store UUID. The authenticated user must have an owner StoreUser record for this store.
    get:
      summary: List active pricing rules
      description: >
        Returns all active `ContentPricingRule` records for the store, ordered by creation date descending.


        **Authorization:** merchant JWT (any store member) or API key with `view` or `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of active pricing rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantPricingRule'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a pricing rule
      description: >
        Creates a new active `ContentPricingRule` for the store.
        The domain in `url_pattern` must have a verified `StoreDomainVerification` record
        for this store before a rule can be created.


        Wildcards: `*` matches any path segment; `**` matches across path separators.
        Example: `https://example.com/articles/*` gates all article pages.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url_pattern, price_cents]
              properties:
                url_pattern:
                  type: string
                  description: Glob URL pattern. Must begin with http:// or https://. Supports * and ** wildcards only.
                  example: 'https://example.com/articles/*'
                price_cents:
                  type: integer
                  minimum: 0
                  description: Price in cents to charge for access to matching URLs.
                  example: 150
      responses:
        '201':
          description: Pricing rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPricingRule'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — non-owner attempting write operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable — domain not verified, invalid pattern, or negative price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/pricing_rules/{id}:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: UUID of the pricing rule.
    delete:
      summary: Deactivate a pricing rule
      description: >
        Soft-deletes the rule by setting `active: false`. The record is retained for
        audit purposes (existing lazily-registered `Content` records reference the rule
        ID in `metadata.paywall.rule_id`). The rule is immediately excluded from URL
        matching.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Rule deactivated \u2014 returns the updated rule with active: false"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPricingRule'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/domains:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store UUID.
    get:
      summary: List domain verifications
      description: >
        Returns all `StoreDomainVerification` records for the store, ordered by creation
        date descending. Each record includes the DNS TXT record name and value the
        store owner must publish to complete verification.


        **Authorization:** merchant JWT (any store member) or API key with `view` or `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of domain verification records
          content:
