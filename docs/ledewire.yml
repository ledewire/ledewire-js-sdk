  /v1/auth/login/buyer-api-key:
    post:
      summary: Exchange a buyer API key + secret for a JWT
      tags:
        - Authentication
      description: >
        Authenticate as a buyer using a named API key and secret.
        Returns the same token shape as `POST /v1/auth/login/email`.
        Rate-limited to 60 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginBuyerApiKeyRequest'
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Invalid key or secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/user/api-keys:
    get:
      summary: List buyer API keys for the authenticated user
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys (secret never included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserApiKey'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new buyer API key
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserApiKeyCreateRequest'
      responses:
        '201':
          description: Key and secret (secret shown once only — store immediately)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiKeyCreateResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/user/api-keys/{id}:
    delete:
      summary: Revoke a buyer API key
      tags:
        - Buyer API Keys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key revoked
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/user/spend-cap:
    get:
      summary: Read the authenticated buyer's daily spend cap
      description: >
        Returns the cap, the timezone bounding the spend window, spend so far in the current
        window, what remains, and when the window rolls. The session token names the buyer;
        there is no id in the path, so no buyer can read another's cap.
      tags:
        - Buyer Spend Cap
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The buyer's spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSpendCap'
        '401':
          description: Missing or invalid buyer session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Set or clear the authenticated buyer's daily spend cap
      description: >
        Writes daily_spend_limit_cents for the buyer the session token names — null clears the
        cap, leaving the buyer uncapped. This is the supported way to become uncapped: buyer
        creation always applies the default cap, even when an explicit null is supplied.
        Returns the updated cap in the same shape GET returns.
      tags:
        - Buyer Spend Cap
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSpendCapUpdateRequest'
      responses:
        '200':
          description: The updated spend cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSpendCap'
        '401':
          description: Missing or invalid buyer session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cap is negative, fractional, non-integer, or the field was omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login/api-key:
    post:
      summary: Log in using API key and secret
      tags:
        - Authentication
      description: >
        Authenticate as a seller using API credentials.


        **Permission Levels:**

        - Provide only `api_key` (without `api_secret`) to receive a token with **`view` permission** (read-only access)

        - Provide both `api_key` and `api_secret` to receive a token with **`full` permission** (read/write access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginApiKeyRequest'
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                success:
                  summary: Successful API key authentication
                  value:
                    access_token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI4NzY1NDMyMS1kY2JhLTRmZWQtYmE5OC03NjU0MzIxMGZlZGMiLCJyb2xlIjoic2VsbGVyIiwic2VsbGVyX2NsYWltcyI6eyJzZWxsZXJfaWQiOiI4NzY1NDMyMS1kY2JhLTRmZWQtYmE5OC03NjU0MzIxMGZlZGMifSwiaXNzIjoiTGVkZVdpcmUgQVBJIiwiYXVkIjoid2ViIiwiZXhwIjoxNzQ3NTU5OTczLCJpYXQiOjE3NDc1NTgxNzN9'
                    refresh_token: '3ef21098a76b5c4d32e1f0g9h8i7j6k5l4m3n2o1p0q9r8s7t6u5v4w3x2y1z'
                    expires_at: '2025-05-18T10:39:33Z'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_api_key:
                  summary: Invalid API credentials
                  value:
                    error: 'Invalid API key or secret'

  /v1/auth/token/refresh:
    post:
      summary: Refresh an access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRefreshRequest'
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'

  /v1/auth/merchant/stores:
    get:
      summary: List stores the authenticated user can manage
      description: >
        Returns all stores the authenticated user has a StoreUser record for.
        Requires a merchant JWT. The response includes `is_author` so
        clients can determine what actions the user may perform in each store.
      tags:
        - Merchant Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of manageable stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManageableStore'
              examples:
                stores:
                  summary: Stores the user manages
                  value:
                    - id: 'a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d'
                      name: 'My Store'
                      store_key: 'my-store'
                      role: 'owner'
                      is_author: true
                      logo: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (invalid token role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/merchant/login/email:
    post:
      summary: Log in as a merchant with email and password
      description: >
        Authenticates a user and returns a store-agnostic merchant JWT.
        The token carries `role: merchant` with no embedded store context.
        Use `GET /v1/auth/merchant/stores` to discover which stores the user
        can manage, then pass the desired `store_id` as a URL parameter on
        merchant resource endpoints.
      tags:
        - Merchant Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantEmailLoginRequest'
            examples:
              login:
                summary: Email and password login
                value:
                  email: 'owner@example.com'
                  password: 'password123'
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Merchant token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAuthenticationResponse'
        '400':
          description: Missing or invalid request fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Wrong password or unknown email
                  value:
                    error:
                      code: 404
                      message: 'Invalid email or password'
        '403':
          description: >
            Authenticated successfully but the account has no merchant store access.
            The credentials are valid; the account needs to be added as an owner
            or author to at least one store before it can use the merchant API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_merchant_access:
                  summary: Account exists but has no store associations
                  value:
                    error:
                      code: 403
                      message: 'This account does not have merchant access. Use a merchant or owner account.'

  /v1/auth/merchant/login/google:
    post:
      summary: Log in as a merchant with Google OAuth
      description: >
        Authenticates a user via Google OAuth and returns a store-agnostic merchant JWT.
      tags:
        - Merchant Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantGoogleLoginRequest'
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Merchant token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAuthenticationResponse'
        '400':
          description: Missing or invalid request fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired Google token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Google token is valid and the account was found, but the account has
            no merchant store access. This is the expected response when a personal
            Google account previously registered as a buyer is used on the merchant
            login endpoint. Use a different account or have the account added as
            an owner or author to a store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_merchant_access:
                  summary: Buyer account authenticated via Google — no store associations
                  value:
                    error:
                      code: 403
                      message: 'This account does not have merchant access. Use a merchant or owner account.'
        '503':
          description: Google service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/merchant/password/reset-request:
    post:
      summary: Request a merchant password reset code
      description: >
        Sends a 6-digit reset code to the given email address if a matching account exists.
        Always returns 200 to prevent email enumeration.
      tags:
        - Merchant Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset code sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_requested:
                  summary: Reset code sent (or silently suppressed for unknown email)
                  value:
                    message: 'If an account with this email exists, a reset code has been sent.'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error:
                      code: 400
                      message: 'email must be a valid email address'
        '429':
          description: Too many requests (rate limit exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  summary: Rate limit exceeded
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'

  /v1/auth/merchant/password/reset:
    post:
      summary: Reset merchant password using code
      description: >
        Validates the 6-digit reset code and replaces the user's password.
        The reset code is single-use and expires after a short window.
      tags:
        - Merchant Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  description: 6-digit numeric code received by email
                  example: '246810'
                password:
                  type: string
                  description: New password (minimum 6 characters)
      responses:
        '429':
          description: Too many requests (throttled by source IP or per-account backoff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_success:
                  summary: Password updated
                  value:
                    message: 'Password has been successfully reset.'
        '400':
          description: Invalid request, code, or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_code:
                  summary: Invalid or expired code
                  value:
                    error:
                      code: 400
                      message: 'Invalid or expired reset code'
                invalid_password:
                  summary: Password too short
                  value:
                    error:
                      code: 400
                      message: 'Failed to update password: Password is too short (minimum is 6 characters)'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    error:
                      code: 404
                      message: 'User not found'

  /v1/merchant/{store_id}/users:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store ID. The authenticated user must have a StoreUser record for this store.
    get:
      summary: List store members
      description: >
        Returns a paginated list of all StoreUser records for the given store.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
        Non-owner users (including `is_author: true`) receive `403 Forbidden`.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based).
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of items per page. Maximum 100.
      responses:
        '200':
          description: Paginated list of store members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Invite a user to the store
      description: >
        Adds a user as a member of the store.
        If the user already has an account, they are added immediately.
        If not, an invitation email is sent and a pending StoreUser is created.


        `is_author` defaults to `true`; set it explicitly to `false` to add
        a store member without authoring permissions.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantInviteRequest'
            examples:
              add_author:
                summary: Invite an existing user as an author
                value:
                  email: 'author@example.com'
              add_member_no_authorship:
                summary: Invite a member without author permissions
                value:
                  email: 'member@example.com'
                  is_author: false
      responses:
        '200':
          description: User added or invitation sent
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MerchantUser'
                  - $ref: '#/components/schemas/MerchantInviteResponse'
        '201':
          description: User added or invitation sent
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MerchantUser'
                  - $ref: '#/components/schemas/MerchantInviteResponse'
        '409':
          description: User is already a member of this store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/merchant/{store_id}/users/{id}:
    parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
        description: Store ID
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: StoreUser ID
    patch:
      summary: Update a store member's permissions
      description: >
        Updates attributes for a store member. Supports toggling `is_author` and setting
        a per-author fee override (`author_fee_bps`). At least one field must be provided.
        `author_fee_bps: null` clears the per-author override, reverting to the store default.
        Role (`owner`) can only be assigned via the platform admin UI.
        Owners cannot update their own record.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_author:
                  type: boolean
                  description: Grant or revoke author permissions.
                author_fee_bps:
                  type: [integer, 'null']
                  description: Per-author fee override in basis points (0–10000). Set to `null` to revert to the store default.
            examples:
              grant_authorship:
                summary: Grant author permissions
                value:
                  is_author: true
              revoke_authorship:
                summary: Revoke author permissions
                value:
                  is_author: false
              set_author_fee:
                summary: Set a custom author fee of 18%
                value:
                  author_fee_bps: 1800
              clear_author_fee:
                summary: Clear the per-author fee override
                value:
                  author_fee_bps: null
      responses:
        '200':
          description: Updated store member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantUser'
        '403':
          description: Forbidden — cannot modify own record or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove a store member
      description: >
        Removes a user from the store. Owners cannot remove themselves.


        **Authorization:** `owner` role (merchant JWT) or API key with `full` permission.
      tags:
        - Merchant
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Removed successfully
        '403':
          description: Forbidden — cannot remove self or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

