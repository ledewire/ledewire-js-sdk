      responses:
        '200':
          description: List of wallet transactions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletTransactionItem'
              examples:
                transactions:
                  summary: Wallet transaction history
                  value:
                    - id: 'abc-123'
                      type: 'debit'
                      reason: 'purchase'
                      amount_cents: 1000
                      balance_after_cents: 4000
                      status: 'completed'
                      reference_id: 'abc-123'
                      description: 'Purchase: Some Content Title'
                      occurred_at: '2026-03-04T12:00:00Z'
                    - id: 'def-456'
                      type: 'credit'
                      reason: 'wallet_funding'
                      amount_cents: 5000
                      balance_after_cents: 5000
                      status: 'completed'
                      reference_id: 'def-456'
                      description: 'Wallet top-up'
                      occurred_at: '2026-03-04T11:55:00Z'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/content/{id}/with-access:
    get:
      summary: Preview a work, with the caller's checkout state
      description: >
        A Buyer's preview of one work, telling them what it is, what it costs, and whether they
        can buy it. It takes a **Buyer token**, and answers about that Buyer only, with their own
        balance or, for a Company member, their Remaining and Company. With **no token** it
        gives the unauthenticated preview (`next_required_action: authenticate`).


        **A store credential is refused** with 403: a seller API-key token, a merchant token or a
        store-manager token.
        Whether a Buyer can afford a work is answered only to that Buyer. A store reads its own
        works through the Merchant API.


        The id resolves as it does for `GET /v1/checkout/state/{content_id}` and
        `POST /v1/purchases`: the work where one exists, and the licensable Catalog entry where
        nobody has bought it yet. An unlisted or archived work gives 404.


        The response is a preview and never delivers the work: there is no `content_body` or
        `content_uri`, even after a purchase. `has_sufficient_funds` and `next_required_action`
        agree with `GET /v1/checkout/state/{content_id}` for the same Buyer and work.
      tags:
        - Content
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The preview and the caller's checkout state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentWithAccessResponse'
        '401':
          description: >
            An `Authorization` header that does not authenticate (`Invalid token`). A header that
            is present is never downgraded to the unauthenticated preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Not a Buyer token: a seller API-key token, a merchant token or a store-manager token,
            whether or not the request names a Buyer. This endpoint answers a Buyer about
            themselves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                store_credential:
                  value:
                    error:
                      code: 403
                      message: >-
                        This endpoint answers a Buyer about themselves and takes a Buyer token.
                        A Buyer's checkout state is at GET /v1/checkout/state/{content_id};
                        a store reads its own works through the Merchant API.
        '404':
          description: No work for sale under this id, including an unlisted or archived one (`Content was not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error:
                      code: 404
                      message: 'Content was not found'

  /v1/content/search:
    post:
      summary: Search LedeWire for content from every Store and every Publication
      description: >
        A signed-in Buyer's LedeWire search, the same search as MCP `search_content`: works from
        every Store and brokered works from every Publication, taken in turn, each in its own
        order of relevance. Each brokered work names its Publication. Unlisted and archived works
        never appear.


        Paged by one opaque cursor. Send each page's `next_cursor` back as `cursor`, with the
        same `query`, `tags`, `max_price_cents`, `metadata`, `publication` and `limit`, until it
        comes back null.
        A page never holds more than `limit` rows. A cursor lasts 24 hours. Without a `query`,
        only Store works are searched, unless `form_type`, `ticker` or `cik` lists SEC filings.


        When part of the search cannot be run the call still succeeds, with what could be found
        and `partial_results: true`. `next_cursor` then still points at what was missed, so
        sending it asks for it again. `unavailable_providers` is deprecated and always empty.


        **Authorization:** any Buyer, by session or Buyer key, Machine users included.
      tags:
        - Content
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSearchRequest'
            examples:
              firstPage:
                summary: First page of a search
                value:
                  query: quantum computing
                  max_price_cents: 500
                  limit: 20
      responses:
        '200':
          description: One page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSearchResponse'
        '400':
          description: A malformed body, such as a `limit` out of range or `tags` that are not strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No valid Buyer credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The credentials are not a Buyer's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The `cursor` is invalid, expired (24 hours), in an older format, or issued for a
            different `query`, `tags`, `max_price_cents`, `metadata`, `publication` or `limit`.
            Nothing was
            searched. Start again without one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >
            Too many searches from this Buyer — 15 a minute per authenticated user, because a search
            with a `query` is a live search of brokered works. Counted per Buyer, not per address, and apart
            from the `GET /v1/publications/{id}/works` budget. Nothing was searched. Waiting
            `Retry-After` seconds is always enough.
          headers:
            Retry-After:
              description: >
                Seconds to wait. Always the full window (60), so an upper bound: the window opened
                at this Buyer's first search and may close sooner.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/checkout/state/{content_id}:
    get:
      summary: Get user's current checkout state for specific content
      description: >
        Public, with optional authentication. Without an `Authorization` header it answers the
        anonymous state (`is_authenticated: false`, `has_sufficient_funds: null`,
        `next_required_action: authenticate`). An `Authorization` header that is present is
        authenticated and never downgraded to anonymous: an empty or invalid token answers 401,
        and a token that is not a buyer token answers 403 `Invalid Role`. Creates nothing.
      security:
        - {}
        - BearerAuth: []
      tags:
        - Checkout
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User's current checkout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStateResponse'
        '401':
          description: >
            An `Authorization` header was sent but did not authenticate: empty
            (`Request must include a valid Bearer Token`), invalid or expired (`Invalid token`),
            or a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    error:
                      code: 401
                      message: 'Invalid token'
        '403':
          description: The token is not a buyer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_role:
                  summary: Non-buyer token
                  value:
                    error:
                      code: 403
                      message: 'Invalid Role'
        '404':
          description: >
            No work for sale has this id. Answered for an id that names nothing, and for a work
            that is unlisted or archived. A Publication's work found by `POST /v1/content/search`
            that nobody has bought yet resolves like any other, at the price the search quoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: No work for sale has this id
                  value:
                    error:
                      code: 404
                      message: 'requested content was not found'

  /v1/purchases:
    get:
      summary: List user purchases
      description: >
