  /v1/company/purchases:
    get:
      summary: List everything the Company paid for
      description: >
        Company admins only. Every purchase and Bulk acquisition drawn on the Company wallet, newest
        first, each attributed to the member who bought it — including members who have since left.
        A Bulk acquisition's per-work purchases are not listed separately, and a failed purchase,
        which bought nothing, is not listed. A Bulk acquisition's Corpus and Manifest are reached
        through `/v1/acquisitions/{acquisition_id}/corpus` and `/manifest` with its id.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: >
            Page number (1-based). A value below 1, or one that is not a number, reads as 1; a page
            past the end returns an empty `data`.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: >
            Number of items per page. A value above 100 is capped at 100, not refused; a negative
            one is refused with 400. When it is absent, 0 or not a number, `limit` is read instead,
            and failing that the default applies.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: >
            An alias for `per_page`, under the same rules, read only when `per_page` is absent, 0 or
            not a number.
        - name: member
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: >
            A membership id (`member.id`), open or closed. A person who left and rejoined has one per
            membership.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            The first day to include, `YYYY-MM-DD`, read in the Company's timezone — the same days
            its Spend window counts.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: The last day to include, `YYYY-MM-DD`, read in the Company's timezone.
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [purchase, bulk_acquisition]
          description: Only purchases, or only Bulk acquisitions. Both by default.
      responses:
        '200':
          description: Company purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPurchaseList'
        '400':
          description: Invalid filter or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
