    delete:
      summary: Leave the Company
      description: >
        Closes the buyer's own membership. Their purchases are paid from their personal wallet again afterwards. The last admin cannot leave.
        A Machine user cannot leave (403); an admin deactivates it instead.
      tags:
        - Company Memberships
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Left
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is a Machine user (`Machine users cannot leave a Company`), or the token is
            not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The buyer belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The buyer is the Company's last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/wallet:
    get:
      summary: Read the Company wallet
      description: >
        Company admins only. The Company wallet's spendable balance, what Company-paid Bulk
        acquisitions hold, and what top-ups are on their way. Members never see the balance, and
        GET /v1/wallet/balance reports none even to an admin; this is the only place it appears.
      tags:
        - Company Wallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The Company wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyWallet'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/wallet/payment-session:
    post:
      summary: Start a Company wallet top-up
      description: >
        Company admins only. Creates a payment session that funds the Company wallet, by card or ACH
        (us_bank_account). Confirm it client-side with the returned client_secret, as for a personal
        top-up. The top-up is spendable only once it settles: a card usually settles at once, an ACH
        debit after about four business days. Starting another top-up never cancels an ACH debit
        already processing.
      tags:
        - Company Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletPaymentSessionRequest'
      responses:
        '200':
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPaymentSessionResponse'
        '400':
          description: >
            The body failed validation: `amount_cents` missing or not from 1 to 2147483647, a `currency`
            other than `usd`, or `metadata` that is not an object or breaks its limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The payment provider refused to create the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/company/wallet/pending-top-ups:
    get:
      summary: List the Company's top-ups that are not yet spendable
      description: >
        Company admins only. Newest first. `pending` is a session not yet paid;
        `awaiting_verification` is a bank account whose microdeposits are not yet confirmed (up to
        ten days); `processing` is an ACH debit under way.
      tags:
        - Company Wallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending top-ups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPendingTopUpList'
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
            A buyer token whose user no longer exists gets `User not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The caller is not a Company admin, or the token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The caller belongs to no Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/login/api-key:
    post:
      summary: Log in using API key and secret
      tags:
        - Authentication
      description: >
        Authenticate as a seller using API credentials.


        **Permission Levels:**

        - Provide only `key` (without `secret`) to receive a token with **`view` permission** (read-only access)

        - Provide both `key` and `secret` to receive a token with **`full` permission** (read/write access)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginApiKeyRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/login/email`, `/login/google`, `/login/api-key` and `/login/buyer-api-key`.
            Repeated failures against one `key` also earn that key a growing backoff (up to 15 minutes),
            shared with `POST /v1/auth/login/buyer-api-key`. A key-only (view) login never clears it.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                success:
                  summary: Successful API key authentication
                  value:
                    token_type: Bearer
                    access_token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI4NzY1NDMyMS1kY2JhLTRmZWQtYmE5OC03NjU0MzIxMGZlZGMiLCJyb2xlIjoic2VsbGVyIiwic2VsbGVyX2NsYWltcyI6eyJzZWxsZXJfaWQiOiI4NzY1NDMyMS1kY2JhLTRmZWQtYmE5OC03NjU0MzIxMGZlZGMifSwiaXNzIjoiTGVkZVdpcmUgQVBJIiwiYXVkIjoid2ViIiwiZXhwIjoxNzQ3NTU5OTczLCJpYXQiOjE3NDc1NTgxNzN9'
                    refresh_token: '3ef21098a76b5c4d32e1f0g9h8i7j6k5l4m3n2o1p0q9r8s7t6u5v4w3x2y1z'
                    expires_at: '2025-05-18T10:39:33Z'
        '400':
          description: '`key` missing or empty, or `secret` sent but empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_key:
                  summary: Key not sent
                  value:
                    error:
                      code: 400
                      message: 'key is missing'
        '401':
          description: >
            The key (or the key and secret) match no store or API key; an unknown key and a wrong
            secret are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                key_and_secret:
                  summary: Key and secret sent
                  value:
                    error:
                      code: 401
                      message: 'Key and Secret do not match an existing store or API key'
                key_only:
                  summary: Key alone sent
                  value:
                    error:
                      code: 401
                      message: 'Key does not match an existing store or API key'

  /v1/auth/token/refresh:
    post:
      summary: Refresh an access token
      description: >
        Exchanges a refresh token for a new token pair; the refresh token is rotated. A refresh
        token issued by a merchant login answers in the merchant shape (with `stores`); every
        other refresh token answers in the plain shape.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRefreshRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 60 refreshes per minute. There is no
            per-account backoff on this route.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a merchant body also satisfies the looser
                # AuthenticationResponse, so oneOf would reject every merchant refresh.
                anyOf:
                  - $ref: '#/components/schemas/AuthenticationResponse'
                  - $ref: '#/components/schemas/MerchantAuthenticationResponse'
        '400':
          description: '`refresh_token` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: Refresh token not sent
                  value:
                    error:
                      code: 400
                      message: 'refresh_token is missing'
        '401':
          description: Unknown or expired refresh token; the two are not distinguished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Unknown or expired
                  value:
                    error:
                      code: 401
                      message: 'Invalid Refresh Token'
        '403':
          description: >
            A merchant refresh token whose account no longer owns or authors any store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_merchant_access:
                  summary: Merchant access lost
                  value:
                    error:
                      code: 403
                      message: 'This account does not have merchant access. Use a merchant or owner account.'

  /v1/auth/merchant/stores:
    get:
      summary: List stores the authenticated user can manage
      description: >
        Returns the stores the authenticated user owns or authors; a membership that is
        neither is not listed. Requires a merchant JWT. The response includes `is_author` so
        clients can determine what actions the user may perform in each store.
      tags:
        - Merchant Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of manageable stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManageableStore'
              examples:
                stores:
                  summary: Stores the user manages
                  value:
                    - id: 'a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d'
                      name: 'My Store'
                      store_key: 'my-store'
                      role: 'owner'
                      is_author: true
                      logo: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (invalid token role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/merchant/accept-invitation:
    post:
      summary: Accept a store invitation
      description: >
        Joins the signed-in merchant to the store whose invitation `invitation_token` names. The
        invitation must be addressed to one of the account's addresses (its email or its Google
        email, compared case-insensitively) and must be less than 7 days old. Not throttled.
      tags:
        - Merchant Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token]
              properties:
                invitation_token:
                  type: string
                  minLength: 1
                  description: The token from the store invitation email.
      responses:
        '200':
          description: The membership the invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantInvitationAcceptedResponse'
        '400':
          description: '`invitation_token` missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: Token not sent
                  value:
                    error:
                      code: 400
                      message: 'invitation_token is missing'
        '401':
          description: No, invalid or expired Bearer token, or its user no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            The Bearer token is not a merchant token (`This token does not have merchant access`),
            or the invitation was sent to a different address (`reason` `wrong_email`, in the
            `InvitationNotAcceptedError` shape).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                not_merchant:
                  summary: Buyer or seller token
                  value:
                    error:
                      code: 403
                      message: 'This token does not have merchant access'
                wrong_email:
                  summary: Invitation addressed to someone else
                  value:
                    error:
                      code: 403
                      message: 'This invitation was sent to a different email address'
                      type: invitation_not_accepted
                    reason: wrong_email
        '404':
          description: No invitation has this token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                not_found:
                  summary: Unknown token
                  value:
                    error:
                      code: 404
                      message: 'Invitation not found'
                      type: invitation_not_accepted
                    reason: not_found
        '409':
          description: >
            Already accepted (`already_accepted`), or the account already belongs to the store
            (`already_member`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                already_accepted:
                  summary: Invitation already used
                  value:
                    error:
                      code: 409
                      message: 'Invitation already accepted'
                      type: invitation_not_accepted
                    reason: already_accepted
                already_member:
                  summary: Already a member of the store
                  value:
                    error:
                      code: 409
                      message: 'You already belong to this store'
                      type: invitation_not_accepted
                    reason: already_member
        '410':
          description: The invitation was sent more than 7 days ago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                expired:
                  summary: Expired
                  value:
                    error:
                      code: 410
                      message: 'Invitation has expired'
                      type: invitation_not_accepted
                    reason: expired
        '422':
          description: The membership could not be saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotAcceptedError'
              examples:
                invalid:
                  summary: Could not be saved
                  value:
                    error:
                      code: 422
                      message: 'Failed to accept invitation'
                      type: invitation_not_accepted
                    reason: invalid

  /v1/auth/merchant/login/email:
    post:
      summary: Log in as a merchant with email and password
      description: >
        Authenticates a user and returns a store-agnostic merchant JWT.
        The token carries `role: merchant` with no embedded store context.
        Use `GET /v1/auth/merchant/stores` to discover which stores the user
        can manage, then pass the desired `store_id` as a URL parameter on
        merchant resource endpoints.
      tags:
        - Merchant Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantEmailLoginRequest'
            examples:
              login:
                summary: Email and password login
                value:
                  email: 'owner@example.com'
                  password: 'password123'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/merchant/login/email` and `/merchant/login/google`, and counted apart from
            the buyer login routes.
            Repeated failures against one email address also earn that address a growing backoff
            (up to 15 minutes), shared with the buyer email login and the OAuth consent screen.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Merchant token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAuthenticationResponse'
        '400':
          description: Missing or invalid request fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Unknown email or wrong password; the two are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Wrong password or unknown email
                  value:
                    error:
                      code: 401
                      message: 'Invalid email or password'
        '403':
          description: >
            Authenticated successfully but the account has no merchant store access.
            The credentials are valid; the account needs to be added as an owner
            or author to at least one store before it can use the merchant API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_merchant_access:
                  summary: Account exists but has no store associations
                  value:
                    error:
                      code: 403
                      message: 'This account does not have merchant access. Use a merchant or owner account.'

  /v1/auth/merchant/login/google:
    post:
      summary: Log in as a merchant with Google OAuth
      description: >
        Authenticates a user via Google OAuth and returns a store-agnostic merchant JWT.
        Token problems are refused exactly as on `POST /v1/auth/login/google`.
      tags:
        - Merchant Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantGoogleLoginRequest'
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 20 requests per minute, one budget shared by
            `POST /v1/auth/merchant/login/email` and `/merchant/login/google`, and counted apart from
            the buyer login routes.
            There is no per-account backoff on this route.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Merchant token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAuthenticationResponse'
        '400':
          description: >
            Every problem with the token, and only those: `id_token` missing or not a three-segment
            JWT; a signature that does not verify, an expired token, a token minted for another
            OAuth client, or Google's key set unreachable (all `Invalid token signature`); a token
            that cannot be read (`Invalid token`); a verified token naming no usable address
            (`Failed to create user`, `Invalid user data`); or an unexpected failure while verifying
            (`Authentication failed`). This route never answers 401 or 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: Missing ID token
                  value:
                    error:
                      code: 400
                      message: 'id_token is missing'
                malformed_token:
                  summary: Not a three-segment JWT
                  value:
                    error:
                      code: 400
                      message: 'id_token must be a valid JWT token'
                unverifiable_token:
                  summary: Bad signature, expired, wrong audience, or key set unreachable
                  value:
                    error:
                      code: 400
                      message: 'Invalid token signature'
        '403':
          description: >
            Google token is valid and the account was found, but the account has
            no merchant store access. This is the expected response when a personal
            Google account previously registered as a buyer is used on the merchant
            login endpoint. Use a different account or have the account added as
            an owner or author to a store.

            Also returned, with `error.type` `email_not_verified`, when Google has not verified
            the account's email address. That refusal happens before any account is looked up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_not_verified:
                  summary: Google has not verified the address
                  value:
                    error:
                      code: 403
                      message: "This Google account's email address is not verified"
                      type: email_not_verified
                no_merchant_access:
                  summary: Buyer account authenticated via Google — no store associations
                  value:
                    error:
                      code: 403
                      message: 'This account does not have merchant access. Use a merchant or owner account.'

  /v1/auth/merchant/password/reset-request:
    post:
      summary: Request a merchant password reset code
      description: >
        Sends a 6-digit reset code to the given email address if a matching account exists.
        Always returns 200 to prevent email enumeration.
      tags:
        - Merchant Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset code sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_requested:
                  summary: Reset code sent (or silently suppressed for unknown email)
                  value:
                    message: 'If an account with this email exists, a reset code has been sent.'
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error:
                      code: 400
                      message: 'email must be a valid email address'
        '429':
          description: >
            Too many requests. The source IP is limited to 10 requests per minute, one budget shared by
            `POST /v1/auth/merchant/password/reset-request` and `/merchant/password/reset`, and counted
            apart from the buyer password-reset routes.
            Each address may also request only a few codes before a growing backoff (up to 15 minutes)
            applies; every request counts, whether or not the account exists.
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'

  /v1/auth/merchant/password/reset:
    post:
      summary: Reset merchant password using code
      description: >
        Validates the 6-digit reset code and replaces the user's password.
        The reset code is single-use and expires after a short window.
      tags:
        - Merchant Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reset_code, password]
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6-digit numeric code received by email
                  example: '246810'
                password:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
      responses:
        '429':
          description: >
            Too many requests. The source IP is limited to 10 requests per minute, one budget shared by
            `POST /v1/auth/merchant/password/reset-request` and `/merchant/password/reset`, and counted
            apart from the buyer password-reset routes.
            Repeated failed resets against one address also earn it a growing backoff (up to 15 minutes).
          headers:
            Retry-After:
              $ref: '#/components/headers/AuthRetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                throttled:
                  summary: Throttled
                  value:
                    error:
                      code: 429
                      message: 'Too many requests. Please try again later.'
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                reset_success:
                  summary: Password updated
                  value:
                    message: 'Password has been successfully reset.'
        '400':
          description: >
            A field is missing or invalid (email format, a `reset_code` that is not 6 digits, a
            password shorter than 6 characters), or the code is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_code:
                  summary: Invalid or expired code
