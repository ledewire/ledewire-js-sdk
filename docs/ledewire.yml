          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [buyer, seller]

    PurchaseStatus:
      type: string
      enum: [completed, refunded, pending, reverted, failed]

    PurchaseResponse:
      type: object
      required:
        [
          id,
          content_id,
          content,
          buyer_id,
          buyer,
          seller_id,
          seller,
          amount_cents,
          timestamp,
          status,
        ]
      properties:
        id:
          type: string
        content_id:
          type: string
        content:
          type: object
          required: [id, content_type, title]
          properties:
            id:
              type: string
            content_type:
              type: string
            title:
              type: string
        buyer_id:
          type: string
        buyer:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        seller_id:
          type: string
        seller:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        amount_cents:
          type: integer
        timestamp:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        content_body:
          type: string
          description: >
            The delivered work, present **only** on the response to `POST /v1/purchases` and only
            when the deliverable is something we hold. It is the delivery, not a field of the
            purchase record: the same purchase read back from `GET /v1/purchases/{id}` or listed
            from `GET /v1/purchases` does not carry it, and there is no route that serves it
            again.


            That asymmetry is the rule rather than an omission. A Buyer keeps what they were
            given — single use is non-transferable, not read-once — but LedeWire does not hand
            the same bytes over a second time without a second grant, and every read from
            LedeWire is a purchase.
        content_uri:
          type: string
          format: uri
          description: >
            Where the work lives, in place of `content_body`, for a deliverable hosted elsewhere.
            Same rule: present only on the response to the purchase that paid for it.

