  /v1/purchases/{id}/license_document:
    get:
      summary: Get a purchase's licence document
      description: >
        The licence document one of the caller's own purchases was delivered under, as Ledewire
        captured it from the work's source: the bytes, with the content type the source served
        them as (usually `application/pdf`). For an SEC filing, Ledewire's terms for SEC filings
        in the version it was delivered under, as `text/markdown`. Always sent as an attachment. This is where a
        purchase's `license.document_url` points. Requires a buyer token, or an MCP API key with
        the `mcp:search` scope sent as `Bearer <key>:<secret>`. Another buyer's purchase, a
        purchase that is not completed, and one whose document has not been captured all answer
        404, exactly as an unknown id does.
      tags:
        - Purchases
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Purchase ID
      responses:
        '200':
          description: The licence document's bytes.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid token, or an MCP API key that does not authenticate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A token that is not a buyer token, or an MCP API key without the `mcp:search` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No captured licence document for one of the caller's completed purchases with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/purchase/verify:
    get:
      summary: Verify purchase
      description: >
        Reports whether the caller has bought a work. This is history, not access. When the
        caller holds several purchases of the work, the one reported is chosen completed first,
        then newest. `has_purchased` is true only when that purchase is `completed`.
        `purchase_details` and `checkout_readiness` are present whenever the caller holds any
        purchase of the work, in any status, so they can appear alongside
        `has_purchased: false` (for a pending, failed or refunded purchase). An unknown
        `content_id`, or none at all, answers 200 `{has_purchased: false}` rather than an error.
        Requires a buyer token; seller and merchant tokens get 403 `Invalid Role`.
      tags:
        - Purchases
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: content_id
          required: true
          description: >
            The work to check. Documented as required, but not enforced: omitting it, or naming
            no work, answers `{has_purchased: false}`.
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseVerifyResponse'
              examples:
                verified:
                  summary: Content has been purchased
                  value:
                    has_purchased: true
                    purchase_details:
                      purchase_id: '3f7b9a8c-1d2e-3f4a-5b6c-7d8e9f0a1b2c'
                      purchase_date: '2025-05-18T13:27:45Z'
                    checkout_readiness:
                      is_authenticated: true
                      has_sufficient_funds: true
                pending:
                  summary: Only a pending purchase exists
                  value:
                    has_purchased: false
                    purchase_details:
                      purchase_id: '3f7b9a8c-1d2e-3f4a-5b6c-7d8e9f0a1b2c'
                      purchase_date: '2025-05-18T13:27:45Z'
                    checkout_readiness:
                      is_authenticated: true
                      has_sufficient_funds: false
                not_purchased:
                  summary: No purchase of this work, or no such work
                  value:
                    has_purchased: false
        '401':
          description: >
            Missing or invalid token (`Request must include a valid Bearer Token`, `Invalid token`),
            or the caller is a deactivated Machine user (`Machine user is deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token is not a buyer token (`Invalid Role`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/seller/content:
    post:
      summary: Create a new piece of content
      deprecated: true
      tags:
        - Content
      description: >
        Supports the following content types:

        - **`markdown`** — written article, base64-encoded body stored in `content_body`

        - **`external_ref`** — proxy content pointing to an external resource (Vimeo, YouTube,
          PDF, etc.). The URI is stored in `content_uri` and is only revealed to buyers
          after a completed purchase.


        **Authorization:**

        Store manager tokens: only `owner` role and users with `is_author: true` may create content.
        Users with neither (no role, `is_author: false`) will receive a `403 Forbidden`.


        API key/secret authentication: permitted with `full` permission; a `view` key gets 403
        `Invalid Role`. The store's `owner` will be automatically set as the author if one
        exists; otherwise content is created without an author.


        **Deprecated.** Use `POST /v1/merchant/{store_id}/content` instead. Every response carries `Deprecation: true`,
        `Sunset: 2026-09-01` and a `Link` to the successor; the route still serves past that date.
        Besides a store-manager token or a seller API-key token, a merchant token is accepted when
        sent with a `store_id` (query or body) naming one of the merchant's stores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Content'
            examples:
